<!-- @dsCard group="Website" viewport="1440x1800" name="FAQ & Help Centre" subtitle="Grouped FAQs with search and contact CTA" -->
<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FAQ & Help Centre · The Singapore Mint</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../assets/data/categories.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="../../components/core/site-footer.runtime.js"></script>
<script src="../../components/core/chat-bubble.js" defer></script>
<style>
body{margin:0;background:#fff;color:var(--ink-1000);font-family:var(--font-body)}
a{color:inherit}a:hover{color:#cf0731}
.wrap{max-width:1280px;margin:0 auto}
.container{max-width:1280px;margin:0 auto;padding:0 24px;box-sizing:border-box}
.crumbs{display:flex;gap:8px;padding:20px 0 8px;font-size:13px;color:var(--ink-500)}
.crumbs a{color:var(--ink-500);text-decoration:none}
.crumbs a:hover{color:var(--ink-1000);text-decoration:underline}

.hero{position:relative;background:radial-gradient(120% 100% at 65% 30%, #cf0731 0%, #8a0522 60%, #34000a 100%);color:#fff;padding:52px 40px;border-radius:14px;margin:8px 0 32px;overflow:hidden;text-align:center}
.hero::before{content:"";position:absolute;inset:0;background:url('../../assets/imagery/noise.png');opacity:.15;mix-blend-mode:overlay;pointer-events:none}
.hero .kicker{font-family:var(--font-label);font-weight:700;font-size:12px;letter-spacing:.15em;text-transform:uppercase;opacity:.85;margin:0 0 10px}
.hero h1{font-family:var(--font-label);font-weight:800;font-size:42px;letter-spacing:-.01em;margin:0 0 20px;line-height:1.05}
.search{position:relative;max-width:560px;margin:0 auto}
.search input{width:100%;box-sizing:border-box;height:54px;padding:0 20px 0 50px;border:0;border-radius:10px;font-family:var(--font-body);font-size:15px;color:var(--ink-1000);outline:none;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.search .si{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--ink-400)}

.layout{display:grid;grid-template-columns:230px 1fr;gap:40px;padding-bottom:64px;align-items:start}
.cats{position:sticky;top:24px;display:flex;flex-direction:column;gap:4px}
.cats button{display:flex;align-items:center;gap:10px;text-align:left;padding:11px 14px;border:0;background:none;border-radius:8px;font-family:var(--font-label);font-weight:600;font-size:14px;color:var(--ink-600);cursor:pointer;transition:background .12s,color .12s}
.cats button .ic{width:18px;height:18px;flex-shrink:0;color:var(--ink-400)}
.cats button:hover{background:var(--ink-25);color:var(--ink-1000)}
.cats button.on{background:#fff7f9;color:#cf0731}
.cats button.on .ic{color:#cf0731}

.groups{min-width:0}
.group{margin-bottom:40px;scroll-margin-top:24px}
.group h2{font-family:var(--font-label);font-weight:800;font-size:22px;margin:0 0 4px;letter-spacing:-.005em}
.group .gsub{font-size:13.5px;color:var(--ink-500);margin:0 0 16px}
.qa{border:1px solid var(--ink-75);border-radius:10px;margin-bottom:10px;overflow:hidden;background:#fff;transition:box-shadow .15s,border-color .15s}
.qa.open{border-color:var(--ink-200);box-shadow:0 6px 18px rgba(0,0,0,.06)}
.qa .q{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:18px 20px;border:0;background:none;cursor:pointer;font-family:var(--font-label);font-weight:700;font-size:15px;color:var(--ink-1000);line-height:1.4}
.qa .q .chev{margin-left:auto;flex-shrink:0;color:var(--ink-400);transition:transform .2s}
.qa.open .q .chev{transform:rotate(180deg);color:#cf0731}
.qa .a{max-height:0;overflow:hidden;transition:max-height .28s ease}
.qa.open .a{max-height:400px}
.qa .a-inner{padding:0 20px 20px 20px;font-size:14px;line-height:1.65;color:var(--ink-700)}
.qa .a-inner a{color:#cf0731;font-weight:600;text-decoration:none}
.qa .a-inner a:hover{text-decoration:underline}
.qa .a-inner b{color:var(--ink-1000)}
.no-res{padding:60px 20px;text-align:center;color:var(--ink-500);border:1px dashed var(--ink-100);border-radius:10px}
.no-res b{color:var(--ink-1000);font-family:var(--font-label)}

.help-cta{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:12px}
.help-card{border:1px solid var(--ink-75);border-radius:12px;padding:24px;text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s,border-color .15s;background:#fff}
.help-card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.1);border-color:transparent;color:inherit}
.help-card .ic{width:44px;height:44px;border-radius:10px;background:#fde5ec;color:#cf0731;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.help-card h3{font-family:var(--font-label);font-weight:800;font-size:15px;margin:0 0 5px}
.help-card p{font-size:13px;color:var(--ink-500);line-height:1.5;margin:0}
.help-head{font-family:var(--font-label);font-weight:800;font-size:22px;margin:48px 0 4px}
.help-sub{font-size:13.5px;color:var(--ink-500);margin:0 0 18px}

@media(max-width:900px){
  .hero{padding:40px 24px;border-radius:0;margin-left:-24px;margin-right:-24px}
  .hero h1{font-size:30px}
  .layout{grid-template-columns:1fr;gap:20px}
  .cats{position:static;flex-direction:row;flex-wrap:wrap;gap:8px}
  .cats button{border:1px solid var(--ink-100)}
  .help-cta{grid-template-columns:1fr}
}

/*om-footer*/
footer.site{background:#000;color:#fff;padding:60px 0 24px;margin-top:0;width:100vw;position:relative;left:50%;right:50%;margin-left:-50vw;margin-right:-50vw}
footer.site .footer-inner{max-width:1280px;margin:0 auto;padding:0 56px;box-sizing:border-box}
footer.site .cols{display:grid;grid-template-columns:repeat(4,1fr);gap:40px}
footer.site h4{font-family:var(--font-label);text-transform:uppercase;font-size:14px;margin:0 0 20px;letter-spacing:.06em;color:#fff}
footer.site ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
footer.site a,footer.site li{color:var(--ink-300);font-family:var(--font-label);font-size:13px;line-height:22px;text-decoration:none}
footer.site .socials{display:flex;gap:12px;margin-top:20px}
footer.site .socials a{width:36px;height:36px;border:1px solid rgba(255,255,255,.25);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff}
footer.site .base{display:flex;align-items:center;justify-content:space-between;padding-top:32px;margin-top:40px;border-top:1px solid rgba(255,255,255,.12);color:var(--ink-300);font-family:var(--font-label);font-size:13px}
.stores-strip{width:100vw;position:relative;left:50%;right:50%;margin-left:-50vw;margin-right:-50vw}
@media(max-width:900px){footer.site .cols{grid-template-columns:1fr;gap:24px}footer.site .footer-inner{padding:0 24px}}
</style></head><body>
<div id="root"></div>
<script type="text/babel">
const { Navi, Icon } = window.TheSingaporeMintDesignSystem_6a655a;

const ic = (path) => <svg className="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{path}</svg>;

const GROUPS = [
  {
    id:'orders', label:'Orders & Payment',
    icon:<><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></>,
    sub:'Placing orders, payment methods and order forms.',
    items:[
      { q:'How do I place an order?', a:'You can order online at singaporemint.com, in person at any of our retail stores, or by mail order. To order by mail, download the order form from the Catalogues & Order Form page and email your completed form to order@singaporemint.com.sg.' },
      { q:'What payment methods do you accept?', a:'Online checkout is powered by DBS Bank Singapore and accepts Visa and Mastercard credit/debit cards as well as PayNow. Payment is secured with 256-bit SSL encryption.' },
      { q:'Can I use Singapore Mint gift vouchers?', a:'Yes. Gift vouchers may be used to offset up to <b>50%</b> of the total transaction value in a single receipt. Vouchers are not valid for precious metal products, coins, or notes.' },
      { q:'Where can I find the latest catalogue and order form?', a:'All current and past e-Catalogues, plus the July / August order form, are available on the <a href="/catalogues">Catalogues & Order Form</a> page.' },
    ]
  },
  {
    id:'delivery', label:'Delivery & Pickup',
    icon:<><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></>,
    sub:'Shipping options, fees and store collection.',
    items:[
      { q:'Is local delivery free?', a:'Local delivery is <b>free on orders of $150 and above</b>. Orders below $150 are charged a flat $8 delivery fee. During promotional periods, free local delivery may apply to a minimum spend of $500.' },
      { q:'Do you ship overseas?', a:'Yes. Overseas orders are shipped via <b>FedEx International Priority</b>, with the rate auto-calculated at checkout based on destination zone and parcel weight. Duties and taxes may be collected on delivery by the carrier.' },
      { q:'Can I collect my order in store?', a:'Yes — choose <b>Store Pickup</b> at checkout and select one of our three stores (Coin Gallery, Chinatown Point, or Suntec City). Orders are typically ready in 1–2 hours, and you\'ll receive an email and SMS when it\'s ready for collection.' },
      { q:'What do I need to bring for pickup?', a:'Please bring your order confirmation and a photo ID. For pre-orders, the original copy of the collection letter is also required.' },
    ]
  },
  {
    id:'stock', label:'Products & Stock',
    icon:<><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></>,
    sub:'Availability, product codes and stock levels.',
    items:[
      { q:'How do I check if an item is in stock?', a:'Each product page shows a real-time <b>Check store availability</b> section with per-store stock levels. Product cards also display the current quantity available.' },
      { q:'What does "PREORDER" mean?', a:'A PREORDER item has not been released yet. You can reserve it now and it will be shipped or made available for collection once stock arrives. Pre-order collection requires the original collection letter and photo ID.' },
      { q:'Are member prices available?', a:'Members with a valid <b>GOLD</b> or <b>PLATINUM</b> membership enjoy members\' prices at retail shops and via mail order. Selected launches also offer members\' early bird pricing.' },
    ]
  },
  {
    id:'promos', label:'Promotions & Events',
    icon:<><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></>,
    sub:'Gifts with purchase, gift tiers and fairs.',
    items:[
      { q:'How does Spend & Be Rewarded work?', a:'Spend across a single receipt to earn Singapore Mint gift vouchers: $30 voucher for $300–$599, $50 for $600–$899, and $100 for $900 and above. See the <a href="/promotion">Promotions</a> page for full terms.' },
      { q:'Where can I redeem gift-with-purchase items?', a:'GWP redemption is available at our retail shops (Coin Gallery, Chinatown Point, Suntec City). Orders opting for delivery may redeem in store by presenting the original delivery letter. One receipt is entitled to one gift tier.' },
      { q:'When is the next event?', a:'The Singapore Mint will be at the <b>Singapore International Coin Fair 2026</b>, 20–22 March 2026 at Marina Bay Sands, Booth S38. Details are on the <a href="/events">Events</a> page.' },
    ]
  },
  {
    id:'account', label:'Account & Returns',
    icon:<><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>,
    sub:'Your account, addresses and the Return & Reward scheme.',
    items:[
      { q:'How do I manage my saved addresses?', a:'Sign in and go to your <a href="/account#info">Dashboard → Settings</a>. There you can add, edit, remove and set a default address, which is then used automatically at checkout.' },
      { q:'Where can I view my past orders and receipts?', a:'Your <a href="/account#orders">Order History</a> tab lists all past orders with itemised receipts you can download.' },
      { q:'What is the Return & Reward scheme?', a:'Bring your empty S001 / S002 coin boxes back to any retail shop and enjoy <b>$2 off</b> your next purchase for every box returned (excludes S624 Lunar Horse Red Packets). Terms and conditions apply.' },
    ]
  },
];

const ALL = GROUPS.flatMap(g => g.items.map(it => ({...it, group:g.id})));

const App = () => {
  const [active, setActive] = React.useState(GROUPS[0].id);
  const [query, setQuery] = React.useState('');
  const [open, setOpen] = React.useState({});
  const q = query.trim().toLowerCase();

  const toggle = (key) => setOpen(o => ({...o, [key]: !o[key]}));
  const jump = (id) => { setActive(id); const el = document.getElementById('g-'+id); if(el) window.scrollTo({top: el.getBoundingClientRect().top + window.scrollY - 20, behavior:'smooth'}); };

  const matches = q ? ALL.filter(it => (it.q+' '+it.a).toLowerCase().includes(q)) : null;

  return (
    <div className="wrap">
      {Navi ? <Navi active="Latest"/> : null}
      <div className="container">
        <nav className="crumbs"><a href="/">Home</a> / <span>FAQ & Help Centre</span></nav>

        <section className="hero">
          <div className="kicker">Help Centre</div>
          <h1>How can we help?</h1>
          <div className="search">
            <span className="si"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
            <input type="text" placeholder="Search for answers — delivery, pickup, payment…" value={query} onChange={e=>setQuery(e.target.value)}/>
          </div>
        </section>

        {matches ? (
          <div style={{paddingBottom:64}}>
            <p style={{fontFamily:'var(--font-label)',fontWeight:700,fontSize:14,color:'var(--ink-500)',margin:'0 0 16px'}}>{matches.length} result{matches.length!==1?'s':''} for "{query}"</p>
            {matches.length === 0 ? (
              <div className="no-res"><b>No matching answers.</b><div style={{marginTop:8}}>Try another keyword or <a href="/contact" style={{color:'#cf0731',fontWeight:600}}>contact our team</a>.</div></div>
            ) : matches.map((it,i) => (
              <div key={i} className={`qa${open['s'+i]?' open':''}`}>
                <button className="q" onClick={()=>toggle('s'+i)}>{it.q}<span className="chev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span></button>
                <div className="a"><div className="a-inner" dangerouslySetInnerHTML={{__html: it.a}}/></div>
              </div>
            ))}
          </div>
        ) : (
          <div className="layout">
            <aside className="cats">
              {GROUPS.map(g => (
                <button key={g.id} className={active===g.id?'on':''} onClick={()=>jump(g.id)}>{ic(g.icon)}{g.label}</button>
              ))}
            </aside>

            <div className="groups">
              {GROUPS.map(g => (
                <section key={g.id} id={'g-'+g.id} className="group">
                  <h2>{g.label}</h2>
                  <p className="gsub">{g.sub}</p>
                  {g.items.map((it,i) => {
                    const key = g.id+i;
                    return (
                      <div key={i} className={`qa${open[key]?' open':''}`}>
                        <button className="q" onClick={()=>toggle(key)}>{it.q}<span className="chev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span></button>
                        <div className="a"><div className="a-inner" dangerouslySetInnerHTML={{__html: it.a}}/></div>
                      </div>
                    );
                  })}
                </section>
              ))}

              <h2 className="help-head">Still need help?</h2>
              <p className="help-sub">Our customer care team is here to assist.</p>
              <div className="help-cta">
                <a className="help-card" href="/contact">
                  <div className="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg></div>
                  <h3>Contact Us</h3>
                  <p>Reach our head office and customer service line.</p>
                </a>
                <a className="help-card" href="mailto:order@singaporemint.com.sg">
                  <div className="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/></svg></div>
                  <h3>Email Orders</h3>
                  <p>order@singaporemint.com.sg</p>
                </a>
                <a className="help-card" href="/stay-connected">
                  <div className="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
                  <h3>Stay Connected</h3>
                  <p>Join our mailing list and social channels.</p>
                </a>
              </div>
            </div>
          </div>
        )}
      </div>

      <SiteFooter Icon={Icon}/>
    </div>
  );
};
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
