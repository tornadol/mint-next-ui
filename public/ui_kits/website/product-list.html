function parseHash(){
  const h = (window.location.hash||'').replace(/^#\/?/, '');
  const [pathPart, queryPart] = h.split('?');
  const seg = pathPart.split('/').filter(Boolean);
  const q = new URLSearchParams(queryPart||'');
  return {
    cat: seg[0] || null,
    sub: seg[1] || null,
    q: q.get('q') || '',
    tags: (q.get('tags')||'').split(',').filter(Boolean),
    page: parseInt(q.get('page')||'1',10)||1,
    sort: q.get('sort') || 'featured',
  };
}
function writeHash(st){
  const parts = [];
  if (st.cat) { parts.push(st.cat); if (st.sub) parts.push(st.sub); }
  const q = new URLSearchParams();
  if (st.q) q.set('q', st.q);
  if (st.tags && st.tags.length) q.set('tags', st.tags.join(','));
  if (st.page && st.page > 1) q.set('page', st.page);
  if (st.sort && st.sort !== 'featured') q.set('sort', st.sort);
  const qs = q.toString();
  const hash = '#/' + parts.join('/') + (qs ? '?'+qs : '');
  if (hash !== window.location.hash) window.history.replaceState(null, '', hash);
}

function Pagination({page, totalPages, onGo}){
  if (totalPages <= 1) return null;
  const [jump, setJump] = React.useState('');
  const nums = [];
  const push = n => nums.push(n);
  push(1);
  const start = Math.max(2, page-1);
  const end = Math.min(totalPages-1, page+1);
  if (start > 2) nums.push('…');
  for (let i=start; i<=end; i++) push(i);
  if (end < totalPages-1) nums.push('…');
  if (totalPages > 1) push(totalPages);
  return (
    <div className="pagination">
      <button className="pg-btn" onClick={()=>onGo(page-1)} disabled={page<=1}><Icon name="ChevronLeft" size={16}/> Prev</button>
      {nums.map((n,i)=> n==='…'
        ? <span key={'e'+i} className="pg-ellipsis">…</span>
        : <button key={n} className={`pg-btn${n===page?' on':''}`} onClick={()=>onGo(n)}>{n}</button>
      )}
      <button className="pg-btn" onClick={()=>onGo(page+1)} disabled={page>=totalPages}>Next <Icon name="ChevronRight" size={16}/></button>
    </div>
  );
}

    return () => window.removeEventListener('hashchange', h);
  }, []);
  React.useEffect(()=>{ writeHash(state); }, [state]);

  const patch = (p) => setState(s => ({...s, ...p, page: p.page!==undefined ? p.page : (p.cat!==undefined||p.sub!==undefined||p.q!==undefined||p.tags!==undefined ? 1 : s.page)}));

    let list = PRODUCTS.filter(p => {
      if (state.cat && p.category !== state.cat) return false;
      if (state.sub && p.sub !== state.sub) return false;
      if (qq) {
        const hay = (p.name+' '+p.sku+' '+p.category+' '+p.tags.join(' ')).toLowerCase();
        if (!hay.includes(qq)) return false;
      }
      if (state.tags.length && !state.tags.every(t => p.tags.includes(t))) return false;
      return true;
    });
    if (state.sort === 'price-asc') list = [...list].sort((a,b)=>a.price-b.price);
    else if (state.sort === 'price-desc') list = [...list].sort((a,b)=>b.price-a.price);
    else if (state.sort === 'name') list = [...list].sort((a,b)=>a.name.localeCompare(b.name));
    return list;
  }, [state.cat, state.sub, state.q, state.tags, state.sort]);

  const totalPages = Math.max(1, Math.ceil(filtered.length / PER_PAGE));

    var s = img.getBoundingClientRect(), t = target.getBoundingClientRect();
    var clone = document.createElement('img');
    clone.src = img.src; clone.className = 'fly-coin';
    clone.style.left = s.left + s.width/2 - 28 + 'px';
    clone.style.top = s.top + s.height/2 - 28 + 'px';
    clone.style.setProperty('--dx', (t.left + t.width/2 - s.left - s.width/2) + 'px');
    clone.style.setProperty('--dy', (t.top + t.height/2 - s.top - s.height/2) + 'px');
    var kf = [
      {transform:'translate(0,0) scale(1) rotate(0)', opacity:1},
      {transform:'translate(calc(var(--dx)*.5), calc(var(--dy)*.2 - 80px)) scale(.7) rotate(120deg)', opacity:.9, offset:.5},
      {transform:'translate(var(--dx), var(--dy)) scale(.15) rotate(240deg)', opacity:0}
    ];
    document.body.appendChild(clone);
    var a = clone.animate(kf, {duration:800, easing:'cubic-bezier(.5,0,.7,1)', fill:'forwards'});
    a.onfinish = function(){ clone.remove(); target.animate([{transform:'scale(1)'},{transform:'scale(1.25)'},{transform:'scale(1)'}], {duration:400, easing:'cubic-bezier(.34,1.56,.64,1)'}); };
  }
  document.addEventListener('click', function(e){
    var b = e.target && e.target.closest && e.target.closest('.add-cart');
    if(b){ b.classList.remove('added'); void b.offsetWidth; b.classList.add('added'); fly(b); }
  }, true);
})();
</script>
