<body><div id="root"></div>
<script type="text/babel">
const { useState } = React;
const NS = window.TheSingaporeMintDesignSystem_e173f5 || {};
function Ic({name,size=22,color}){
  const C = NS[name];
  const glyph = C ? <C size={size}/> : (NS.Icon ? <NS.Icon name={name} size={size}/> : null);
  return glyph ? <span style={{color,display:'inline-flex'}}>{glyph}</span> : <span style={{width:size,height:size,display:'inline-block'}}/>;
}
const mLink={fontFamily:'var(--desktop-body-m-font-family)',fontSize:16,fontWeight:400,color:'#000',lineHeight:1.2};
const mHead={fontFamily:'var(--desktop-subheading-5-uppercase-font-family)',fontSize:12,fontWeight:500,letterSpacing:'0.96px',textTransform:'uppercase',color:'#BABABA'};

function navHref(label){if(!label)return '#';if(RAFFLES_SLUG[label])return '/Collection?c='+RAFFLES_SLUG[label];const m={'About us':'/About','Membership':'/Membership','Visit our stores':'/Stores','All Raffles Mint':'/Collection','Custom corporate gifts':'/CorporateGifts','Catalogue orders':'/CatalogueOrders','Coin recycling':'/CoinRecycling'};return m[label]||'/Shop';}

const SHOP_MENU_A = ['Bestsellers','Sale items','Shop all'];

  {h:'Shop by Type',items:['Coins','Medallions & Ingots','Figurines & Ornaments','Jewelry & Accessories','Notes','International Collectibles'],all:'All types'},

];
const SHOP_MENU_C = [
  {h:'Shop by Theme',items:['2026 Lunar New Year','Singapore Series','Pop Culture'],all:'All themes'},

];

function MenuGroup({group}){
  return (
    <div style={{width:210,display:'flex',flexDirection:'column',gap:20}}>

}
const MSHOP=[

}
