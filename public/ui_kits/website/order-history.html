<!-- @dsCard group="Website" viewport="1440x1200" name="Order History" subtitle="Past orders and receipts" -->
<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order History · The Singapore Mint</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../assets/data/categories.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="../../components/core/SiteFooter.jsx"></script>
<style>
body{margin:0;background:#fff;color:var(--ink-1000);font-family:var(--font-body)}
.wrap{max-width:1280px;margin:0 auto}
.wrap>header{width:100vw!important;margin-left:calc(50% - 50vw)}
.container{max-width:1280px;margin:0 auto;padding:0 24px;box-sizing:border-box}
a{color:inherit}a:hover{color:#cf0731}
.crumbs{display:flex;gap:8px;padding:20px 0;font-size:13px;color:var(--ink-500)}
.crumbs a{color:var(--ink-500);text-decoration:none}.crumbs a:hover{color:var(--ink-1000);text-decoration:underline}
h1{font-family:var(--font-label);font-weight:800;font-size:32px;margin:0 0 6px}
.sub{color:var(--ink-500);font-size:14px;margin:0 0 24px}
.orders{display:flex;flex-direction:column;gap:14px;padding-bottom:64px}
.order{border:1px solid var(--ink-75);border-radius:6px;overflow:hidden;background:#fff}
.order-head{display:flex;flex-wrap:wrap;gap:22px;padding:20px 24px;background:var(--ink-25);border-bottom:1px solid var(--ink-75)}
.oh-col{display:flex;flex-direction:column;gap:3px}
.oh-col .l{font-family:var(--font-label);font-weight:700;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-500)}
.oh-col .v{font-family:var(--font-label);font-weight:700;font-size:13.5px;color:var(--ink-1000)}
.oh-col.grow{margin-left:auto}
.status-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:#e8f6ec;color:#0a8a4a;font-family:var(--font-label);font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.status-pill .d{width:6px;height:6px;border-radius:999px;background:#0a8a4a}
.order-body{padding:20px 24px}
.o-row{display:flex;gap:14px;padding:12px 0;border-bottom:1px dashed var(--ink-50)}
.o-row:last-child{border-bottom:0}
.o-row img{width:56px;height:56px;border:1px solid var(--ink-75);object-fit:contain;padding:4px;flex-shrink:0}
.o-row .info{flex:1;min-width:0}
.o-row .n{font-family:var(--font-label);font-weight:700;font-size:13.5px;line-height:1.35}
.o-row .m{font-size:12px;color:var(--ink-500);margin-top:2px}
.o-row .p{font-family:var(--font-label);font-weight:700;font-size:13.5px}
.order-foot{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:#fafaf9;border-top:1px solid var(--ink-75)}
.order-total{font-family:var(--font-label);font-weight:800;font-size:16px}
.btn-outline{background:#fff;border:1px solid var(--ink-100);color:var(--ink-1000);padding:9px 16px;border-radius:4px;font-family:var(--font-label);font-weight:700;font-size:12px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;text-decoration:none;display:inline-block}
.btn-outline:hover{border-color:var(--ink-400)}
.empty{padding:80px 30px;text-align:center;color:var(--ink-500);border:1px dashed var(--ink-100);border-radius:6px}
.empty h3{font-family:var(--font-label);font-weight:800;font-size:20px;margin:0 0 8px;color:var(--ink-1000)}
.empty a{display:inline-block;margin-top:14px;background:#cf0731;color:#fff;text-decoration:none;padding:12px 24px;font-family:var(--font-label);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;border-radius:4px}
.filter-row{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.chip{padding:8px 14px;border:1px solid var(--ink-100);border-radius:999px;font-family:var(--font-label);font-weight:600;font-size:12px;color:var(--ink-800);cursor:pointer;background:#fff}
.chip.on{background:#cf0731;color:#fff;border-color:#cf0731}
/*om-footer*/
footer.site{background:#000;color:#fff;padding:60px 0 24px;margin-top:0;width:100vw;position:relative;left:50%;right:50%;margin-left:-50vw;margin-right:-50vw}
footer.site .footer-inner{max-width:1280px;margin:0 auto;padding:0 56px;box-sizing:border-box}
footer.site .cols{display:grid;grid-template-columns:repeat(4,1fr);gap:40px}
footer.site h4{font-family:var(--font-label);text-transform:uppercase;font-size:14px;margin:0 0 20px;letter-spacing:.06em;color:#fff}
footer.site ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
footer.site a,footer.site li{color:var(--ink-300);font-family:var(--font-label);font-size:13px;line-height:22px;text-decoration:none}
footer.site .socials{display:flex;gap:12px;margin-top:20px}
footer.site .socials a{width:36px;height:36px;border:1px solid rgba(255,255,255,.25);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff}
footer.site .base{display:flex;align-items:center;justify-content:space-between;padding-top:32px;margin-top:40px;border-top:1px solid rgba(255,255,255,.12);color:var(--ink-300);font-family:var(--font-label);font-size:13px}
footer.site .contact-mobile h4{color:#fff}
.stores-strip{width:100vw;position:relative;left:50%;right:50%;margin-left:-50vw;margin-right:-50vw}
@media(max-width:900px){footer.site .cols{grid-template-columns:1fr;gap:24px}footer.site .footer-inner{padding:0 24px}.stores-strip>div{padding:0 24px!important}}
</style><script src="../../components/core/chat-bubble.js" defer></script>
</head><body>
<div id="root"></div>
<script type="text/babel">
const { Navi, Icon } = window.TheSingaporeMintDesignSystem_6a655a;
const fmt = n => '$' + (n||0).toFixed(2);
const PROD_IMG = i => `../../assets/imagery/coins/coin-0${i}.png`;
const MOCK_ORDERS = [
  { id:'SM-2026-4821', date:new Date(Date.now()-2*864e5).toISOString(), method:'DBS Bank · **** 4291', status:'Out for Delivery', fulfill:'ship', total:316.00, address:'Guest User, 10 Marina Blvd, Singapore 018983, Singapore', items:[{name:'Year of the Horse 1oz Silver Proof Coin',price:158,qty:2,img:PROD_IMG(4)}] },
  { id:'SM-2026-4790', date:new Date(Date.now()-3*864e5).toISOString(), method:'DBS Bank · **** 4291', status:'In Transit', fulfill:'ship', total:148.00, address:'Guest User, 10 Marina Blvd, Singapore 018983, Singapore', items:[{name:'1oz 999 Fine Silver Proof Coin',price:148,qty:1,img:PROD_IMG(3)}] },
  { id:'SM-2026-4712', date:new Date(Date.now()-5*864e5).toISOString(), method:'FedEx · Intl Priority', status:'In Transit', fulfill:'ship', total:420.00, address:'Guest User, 350 5th Ave, New York 10118, United States', items:[{name:'SG59 Commemorative Gold Medallion',price:420,qty:1,img:PROD_IMG(6)}] },
  { id:'SM-2026-4655', date:new Date(Date.now()-9*864e5).toISOString(), method:'DBS Bank · **** 4291', status:'Delivered', fulfill:'ship', total:96.00, address:'Guest User, 1 Raffles Place, Singapore 048616, Singapore', items:[{name:'Merlion Bronze Proof Coin',price:96,qty:1,img:PROD_IMG(7)}] },
];
const statusStyle = (s) => {
  const k=(s||'Paid').toLowerCase();
  if(k==='delivered') return {bg:'#e8f6ec',fg:'#0a8a4a'};
  if(k==='out for delivery') return {bg:'#fdeede',fg:'#c26a00'};
  if(k==='in transit') return {bg:'#e7f0fd',fg:'#1257c2'};
  if(k==='shipped') return {bg:'#e7f0fd',fg:'#1257c2'};
  return {bg:'#f0efec',fg:'#6b6b6b'};
};
const isTrackable = (s) => ['in transit','out for delivery','shipped'].includes((s||'').toLowerCase());

const App = () => {
  const [orders, setOrders] = React.useState([]);
  const [filter, setFilter] = React.useState('all');
  React.useEffect(() => {
    let list = [];
    try { list = JSON.parse(localStorage.getItem('sm-orders') || '[]'); } catch(_){}
    if (!Array.isArray(list)) list = [];
    const ids = new Set(list.map(o=>o.id));
    const merged = [...list, ...MOCK_ORDERS.filter(m=>!ids.has(m.id))];
    merged.sort((a,b)=>new Date(b.date)-new Date(a.date));
    setOrders(merged);
  }, []);
  const matchFilter = (o) => {
    const s=(o.status||'Paid').toLowerCase();
    if(filter==='all') return true;
    if(filter==='transit') return s==='in transit' || s==='out for delivery' || s==='shipped';
    return s===filter;
  };
  const shown = orders.filter(matchFilter);
  return (
    <div className="wrap">
      {Navi ? <Navi active="Home"/> : null}
      <div className="container">
        <nav className="crumbs"><a href="index.html">Home</a> / <span>Order History</span></nav>
        <h1>Order History</h1>
        <div className="sub">{orders.length} order{orders.length===1?'':'s'} on this account.</div>
        {orders.length > 0 && (
          <div className="filter-row">
            <div className={`chip ${filter==='all'?'on':''}`} onClick={()=>setFilter('all')}>All</div>
            <div className={`chip ${filter==='paid'?'on':''}`} onClick={()=>setFilter('paid')}>Paid</div>
            <div className={`chip ${filter==='transit'?'on':''}`} onClick={()=>setFilter('transit')}>In Transit</div>
            <div className={`chip ${filter==='delivered'?'on':''}`} onClick={()=>setFilter('delivered')}>Delivered</div>
          </div>
        )}
        <div className="orders">
          {shown.length === 0 && (
            <div className="empty">
              <h3>No orders yet</h3>
              <div>{filter==='all' ? "Your past orders will appear here after you check out." : `No ${filter} orders.`}</div>
              {filter==='all' && <a href="product-list.html">Start Shopping</a>}
            </div>
          )}
          {shown.map(o => {
            const trackable = isTrackable(o.status);
            const ss = statusStyle(o.status);
            const goTrack = () => { if(o.fulfill!=='pickup') window.location.href=`order-tracking.html?order=${encodeURIComponent(o.id)}`; };
            return (
            <div key={o.id} className="order" onClick={trackable?goTrack:undefined} style={trackable?{cursor:'pointer'}:undefined}>
              <div className="order-head">
                <div className="oh-col"><span className="l">Order #</span><span className="v">{o.id}</span></div>
                <div className="oh-col"><span className="l">Placed</span><span className="v">{new Date(o.date).toLocaleDateString('en-SG',{day:'numeric',month:'short',year:'numeric'})}</span></div>
                <div className="oh-col"><span className="l">Payment</span><span className="v">{o.method}</span></div>
                <div className="oh-col grow" style={{alignItems:'flex-end'}}>
                  <span className="l">Status</span>
                  <span className="status-pill" style={{background:ss.bg,color:ss.fg}}><span className="d" style={{background:ss.fg}}/> {o.status||'Paid'}</span>
                </div>
              </div>
              <div className="order-body">
                {o.items.map((it,i)=>(
                  <div key={i} className="o-row">
                    <img src={it.img} alt=""/>
                    <div className="info">
                      <div className="n">{it.name}</div>
                      <div className="m">Qty: {it.qty||1}{it.meta?' · '+it.meta:''}</div>
                    </div>
                    <div className="p">{fmt((it.price||0)*(it.qty||1))}</div>
                  </div>
                ))}
              </div>
              <div className="order-foot">
                <div className="order-total">Total {fmt(o.total)}</div>
                <div style={{display:'flex',gap:10,flexWrap:'wrap'}} onClick={e=>e.stopPropagation()}>
                  {o.fulfill!=='pickup' && <a className="btn-outline" href={`order-tracking.html?order=${encodeURIComponent(o.id)}`} style={{background:'#cf0731',color:'#fff',borderColor:'#cf0731',display:'inline-flex',alignItems:'center',gap:7}}>
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
                    Track Order
                  </a>}
                  <a className="btn-outline" href="#" onClick={e=>e.preventDefault()}>View Receipt</a>
                  <a className="btn-outline" href="product-list.html">Buy Again</a>
                </div>
              </div>
            </div>
            );
          })}
        </div>
      </div>
      <SiteFooter Icon={Icon} noStores={true}/>
    </div>
  );
};
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
