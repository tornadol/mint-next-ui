<style>
body{margin:0;background:#fff;color:var(--ink-1000);font-family:var(--font-body)}
.wrap{max-width:1280px;margin:0 auto}
.container{max-width:1280px;margin:0 auto;padding:0 24px;box-sizing:border-box}
a{color:inherit}a:hover{color:#cf0731}
.crumbs{display:flex;gap:8px;padding:20px 0;font-size:13px;color:var(--ink-500)}
.crumbs a{color:var(--ink-500);text-decoration:none}.crumbs a:hover{color:var(--ink-1000);text-decoration:underline}
h1{font-family:var(--font-label);font-weight:800;font-size:32px;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--ink-500);font-size:14px;margin:0 0 24px}

/* Dashboard overview */
.dash{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
.stat{background:#fff;border:1px solid var(--ink-75);border-radius:8px;padding:18px 20px}
.stat .l{font-family:var(--font-label);font-weight:700;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-500);margin-bottom:8px}
.stat .v{font-family:var(--font-label);font-weight:800;font-size:24px;color:var(--ink-1000);line-height:1}
.stat .s{font-size:12px;color:var(--ink-500);margin-top:6px}
.dash-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:28px}
.section{background:#fff;border:1px solid var(--ink-75);border-radius:8px;padding:20px 22px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-head h3{font-family:var(--font-label);font-weight:800;font-size:14px;letter-spacing:.02em;margin:0}
.section-head a{font-family:var(--font-label);font-weight:700;font-size:11.5px;color:#cf0731;text-decoration:none;letter-spacing:.05em;text-transform:uppercase}
.mini-order{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--ink-50)}

.mini-order .m{flex:1;min-width:0}
.mini-order .m .n{font-family:var(--font-label);font-weight:700;font-size:13px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-order .m .d{font-size:11.5px;color:var(--ink-500);margin-top:2px}
.mini-order .p{font-family:var(--font-label);font-weight:800;font-size:13px}
.mini-order .st{font-family:var(--font-label);font-weight:700;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#0a8a4a;background:#e8f6ec;padding:3px 8px;border-radius:999px;margin-left:6px}
.addr{padding:12px 0;border-bottom:1px dashed var(--ink-50);font-size:13px;line-height:1.55}

.addr .t{font-family:var(--font-label);font-weight:700;font-size:12px;display:flex;align-items:center;gap:8px;margin-bottom:2px}
.addr .tag{font-size:9.5px;background:var(--ink-50);color:var(--ink-700);padding:2px 7px;border-radius:999px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.addr .tag.default{background:#fde5ec;color:#cf0731}

.rec{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--ink-50);font-size:13px}

/* Tabs */

.tab{position:relative;padding:14px 2px;font-family:var(--font-label);font-weight:700;font-size:14px;letter-spacing:.02em;color:var(--ink-500);cursor:pointer;background:none;border:0;transition:color .15s}

<div id="root"></div>
<script type="text/babel">
const { Navi, Icon } = window.TheSingaporeMintDesignSystem_6a655a;
const fmt = n => '$' + (n||0).toFixed(2);

function readUser(){
  try { return JSON.parse(localStorage.getItem('sm-user') || 'null'); } catch(_){ return null; }
}
function writeUser(u){ try { localStorage.setItem('sm-user', JSON.stringify(u)); } catch(_){} }

const DEFAULT_ADDRESSES = [
  { id:'a1', label:'Home', name:'Guest User', phone:'+65 9123 4567', line1:'10 Marina Boulevard, #05-01', line2:'Marina Bay Financial Centre', postal:'018983', country:'Singapore', default:true },
  { id:'a2', label:'Work', name:'Guest User', phone:'+65 9123 4567', line1:'1 Raffles Place, Level 24', line2:'One Raffles Place', postal:'048616', country:'Singapore', default:false },
];
function readAddresses(){
  try { const raw = localStorage.getItem('sm-addresses'); if(!raw) return DEFAULT_ADDRESSES.slice(); const a = JSON.parse(raw); return Array.isArray(a) ? a : DEFAULT_ADDRESSES.slice(); } catch(_){ return DEFAULT_ADDRESSES.slice(); }
}
function writeAddresses(list){ try { localStorage.setItem('sm-addresses', JSON.stringify(list)); window.dispatchEvent(new CustomEvent('sm-addresses-updated')); } catch(_){} }
const addrToString = a => `${a.name} · ${a.phone}\n${a.line1}${a.line2?'\n'+a.line2:''}\n${a.country} ${a.postal}`.trim();

function pwScore(pw){
  if(!pw) return 0;
  let s = 0;
  if(pw.length >= 8) s++;
  if(/[A-Z]/.test(pw) && /[a-z]/.test(pw)) s++;
  if(/\d/.test(pw) && /[^A-Za-z0-9]/.test(pw)) s++;
  return s;
}

function InfoPanel({orders, gotoOrders}){
  return <DashboardOverview orders={orders} gotoOrders={gotoOrders}/>;
}

function AddressForm({initial, onSave, onCancel}){
  const empty = { label:'Home', name:'', phone:'', line1:'', line2:'', postal:'', country:'Singapore', default:false };
  const [f, setF] = React.useState(initial ? {...empty, ...initial} : empty);
  const submit = () => {
    if (!f.name.trim() || !f.line1.trim() || !f.postal.trim()){ return; }
    onSave(f);
  };
  return (
    <div className="addr-form">
      <div className="row">
        <div className="field"><label>Label</label>
          <select value={f.label} onChange={e=>setF({...f,label:e.target.value})} style={{padding:'11px 14px',border:'1px solid var(--ink-100)',borderRadius:6,fontFamily:'var(--font-body)',fontSize:14,background:'#fff'}}>
            <option>Home</option><option>Work</option><option>Family</option><option>Other</option>
          </select>
        </div>
        <div className="field"><label>Full name</label><input value={f.name} onChange={e=>setF({...f,name:e.target.value})} placeholder="Alex Tan"/></div>
        <div className="field full"><label>Phone</label><input value={f.phone} onChange={e=>setF({...f,phone:e.target.value})} placeholder="+65 9123 4567"/></div>
        <div className="field full"><label>Address line 1</label><input value={f.line1} onChange={e=>setF({...f,line1:e.target.value})} placeholder="Street, unit, block"/></div>
        <div className="field full"><label>Address line 2 (optional)</label><input value={f.line2} onChange={e=>setF({...f,line2:e.target.value})} placeholder="Building, floor"/></div>
        <div className="field"><label>Postal code</label><input value={f.postal} onChange={e=>setF({...f,postal:e.target.value})} placeholder="018983"/></div>
        <div className="field"><label>Country</label>
          <select value={f.country} onChange={e=>setF({...f,country:e.target.value})} style={{padding:'11px 14px',border:'1px solid var(--ink-100)',borderRadius:6,fontFamily:'var(--font-body)',fontSize:14,background:'#fff'}}>
            <option>Singapore</option><option>Malaysia</option><option>Indonesia</option><option>Thailand</option>
          </select>
        </div>
        <label className="chk" style={{gridColumn:'1/-1'}}>
          <input type="checkbox" checked={!!f.default} onChange={e=>setF({...f,default:e.target.checked})}/> Set as default address
        </label>
      </div>
      <div className="actions" style={{marginTop:16,paddingTop:14,borderTop:'1px solid var(--ink-50)'}}>
        <button type="button" className="btn btn-outline" onClick={onCancel}>Cancel</button>
        <button type="button" className="btn btn-primary" onClick={submit}>{initial ? 'Save changes' : 'Add address'}</button>
      </div>
    </div>
  );
}

function SettingsPanel({user, setUser, toast}){
  const [name, setName] = React.useState(user.name || '');
  const [email] = React.useState(user.email || 'guest@gmail.com');
  const [avatar, setAvatar] = React.useState(user.avatar || null);
  const [addresses, setAddresses] = React.useState(readAddresses());
  const [editingAddr, setEditingAddr] = React.useState(null); // {mode:'add'|'edit', data}
  const persistAddresses = (list) => { setAddresses(list); writeAddresses(list); };
  const onSaveAddress = (data) => {
    let list;
    if (editingAddr.mode === 'add'){
      const id = 'a'+Date.now();
      const nu = { id, ...data };
      list = [...addresses, nu];
      if (data.default) list = list.map(a => ({...a, default: a.id===id}));
      else if (!list.some(a => a.default)) list[list.length-1].default = true;
    } else {
      list = addresses.map(a => a.id === editingAddr.data.id ? { ...a, ...data } : a);
      if (data.default) list = list.map(a => ({...a, default: a.id===editingAddr.data.id}));
    }
    persistAddresses(list);
    setEditingAddr(null);
    toast('Address saved');
  };
  const setDefault = (id) => { persistAddresses(addresses.map(a => ({...a, default: a.id===id}))); toast('Default address updated'); };
  const removeAddress = (id) => {
    let list = addresses.filter(a => a.id !== id);
    if (list.length && !list.some(a => a.default)) list[0].default = true;
    persistAddresses(list); toast('Address removed');
  };
  const [cur, setCur] = React.useState('');
  const [nw, setNw] = React.useState('');
  const [cf, setCf] = React.useState('');
  const [errs, setErrs] = React.useState({});
  const fileRef = React.useRef(null);

  const saveProfile = (e) => {
    e && e.preventDefault();
    const nu = { ...user, name: name.trim() || 'Guest User', avatar };
    setUser(nu); writeUser(nu);
    toast('Profile updated');
  };
  const onPick = (e) => {
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = () => setAvatar(r.result);
    r.readAsDataURL(f);
  };
  const removeAvatar = () => setAvatar(null);
  const initial = (name || 'G').trim().charAt(0).toUpperCase();

  const savePassword = (e) => {
    e.preventDefault();
    const ne = {};
    if(!cur) ne.cur = 'Enter your current password';
    if(!nw || nw.length < 8) ne.nw = 'Use at least 8 characters';
    if(nw !== cf) ne.cf = 'Passwords do not match';
    setErrs(ne);
    if(Object.keys(ne).length) return;
    setCur(''); setNw(''); setCf('');
    toast('Password changed');
  };
  const score = pwScore(nw);

  return (
    <div className="info-grid">
      <aside className="card">
        <h2>Profile Photo</h2>
        <div className="desc">JPG or PNG. Max 4MB.</div>
        <div className="avatar-wrap">
          <div className="avatar">
            {avatar ? <img src={avatar} alt=""/> : initial}
          </div>
          <label className="upload-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Upload photo
            <input ref={fileRef} type="file" accept="image/*" onChange={onPick}/>
          </label>
          {avatar && <button className="link-btn" onClick={removeAvatar}>Remove</button>}
          <div className="avatar-help">Square images work best.<br/>Shown in the nav and on reviews.</div>
        </div>
      </aside>

      <div style={{display:'flex',flexDirection:'column',gap:24}}>
        <form className="card" onSubmit={saveProfile}>
          <h2>Personal Info</h2>
          <p className="desc">Update the name shown across your account and orders.</p>
          <div className="form-stack">
            <div className="two-col">
              <div className="field">
                <label htmlFor="fn">Full name</label>
                <input id="fn" type="text" value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Alex Tan"/>
              </div>
              <div className="field">
                <label htmlFor="em">Email</label>
                <input id="em" type="email" value={email} disabled/>
                <span className="hint">Contact support to change your email.</span>
              </div>
            </div>
            <div className="actions">
              <button type="button" className="btn btn-outline" onClick={()=>setName(user.name||'')}>Cancel</button>
              <button type="submit" className="btn btn-primary">Save changes</button>
            </div>
          </div>
        </form>

        <div className="card">
          <h2>Saved Addresses</h2>
          <p className="desc">Manage the addresses used for shipping and pickup.</p>
          <div className="addr-list">
            {addresses.map(a => (
              <div key={a.id} className={`addr-card${a.default?' def':''}`}>
                <div className="hd">
                  <span className="lb">{a.label}</span>
                  {a.default && <span className="df">Default</span>}
                </div>
                <div className="body">{addrToString(a)}</div>
                <div className="row">
                  <button onClick={()=>setEditingAddr({mode:'edit', data:a})}>Edit</button>
                  {!a.default && <button className="pri" onClick={()=>setDefault(a.id)}>Set as default</button>}
                  {addresses.length > 1 && <button onClick={()=>removeAddress(a.id)}>Remove</button>}
                </div>
              </div>
            ))}
          </div>
          {editingAddr ? (
            <AddressForm
              initial={editingAddr.mode==='edit' ? editingAddr.data : null}
              onSave={onSaveAddress}
              onCancel={()=>setEditingAddr(null)}
            />
          ) : (
            <button className="add-addr" onClick={()=>setEditingAddr({mode:'add', data:null})}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Add new address
            </button>
          )}
        </div>

        <form className="card" onSubmit={savePassword}>
          <h2>Password</h2>
          <p className="desc">Use at least 8 characters with a mix of letters, numbers, and symbols.</p>
          <div className="form-stack">
            <div className="field">
              <label htmlFor="cp">Current password</label>
              <input id="cp" type="password" value={cur} onChange={e=>setCur(e.target.value)} autoComplete="current-password"/>
              {errs.cur && <span className="err">{errs.cur}</span>}
            </div>
            <div className="two-col">
              <div className="field">
                <label htmlFor="np">New password</label>
                <input id="np" type="password" value={nw} onChange={e=>setNw(e.target.value)} autoComplete="new-password"/>
                <div className="pw-strength">
                  <div className={`bar ${score>=1?'on-'+Math.min(score,3):''}`}/>
                  <div className={`bar ${score>=2?'on-'+Math.min(score,3):''}`}/>
                  <div className={`bar ${score>=3?'on-3':''}`}/>
                </div>
                {errs.nw && <span className="err">{errs.nw}</span>}
              </div>
              <div className="field">
                <label htmlFor="cfp">Confirm new password</label>
                <input id="cfp" type="password" value={cf} onChange={e=>setCf(e.target.value)} autoComplete="new-password"/>
                {errs.cf && <span className="err">{errs.cf}</span>}
              </div>
            </div>
            <div className="actions">
              <button type="button" className="btn btn-outline" onClick={()=>{setCur('');setNw('');setCf('');setErrs({});}}>Cancel</button>
              <button type="submit" className="btn btn-primary">Update password</button>
            </div>
          </div>
        </form>
      </div>
      </div>
  );
}

function DashboardOverview({orders, gotoOrders}){
  const fmt = n => '$' + (n||0).toFixed(2);
  const totalSpent = orders.reduce((s,o)=>s+(o.total||0),0);
  const itemCount = orders.reduce((s,o)=>s+(o.items||[]).reduce((a,i)=>a+(i.qty||1),0),0);
  const recent = orders.slice(0,3);
  const flatItems = orders.flatMap(o => (o.items||[]).map(i => ({...i, orderId:o.id, date:o.date}))).slice(0,3);
  const [addresses, setAddresses] = React.useState(readAddresses());
  React.useEffect(() => {
    const h = () => setAddresses(readAddresses());
    window.addEventListener('sm-addresses-updated', h);
    return () => window.removeEventListener('sm-addresses-updated', h);
  }, []);
  return (
    <React.Fragment>
      <div className="dash">
        <div className="stat"><div className="l">Total Orders</div><div className="v">{orders.length}</div><div className="s">Lifetime</div></div>
        <div className="stat"><div className="l">Items Purchased</div><div className="v">{itemCount}</div><div className="s">Across all orders</div></div>
        <div className="stat"><div className="l">Total Spent</div><div className="v">{fmt(totalSpent)}</div><div className="s">Lifetime value</div></div>
        <div className="stat"><div className="l">Saved Addresses</div><div className="v">{addresses.length}</div><div className="s">Ready at checkout</div></div>
      </div>

      <div className="dash-grid">
        <div className="section">
          <div className="section-head">
            <h3>Recent Orders</h3>
            {orders.length>0 && <a href="order-history.html">View all</a>}
          </div>
          {recent.length===0 ? (
            <div className="empty-mini">No orders yet. <a href="product-list.html" style={{color:'#cf0731',fontWeight:700}}>Start shopping</a></div>
          ) : recent.map(o => (
            <div key={o.id} className="mini-order">
              <img src={(o.items[0]||{}).img} alt=""/>
              <div className="m">
                <div className="n">{(o.items[0]||{}).name}{o.items.length>1 && <span style={{color:'var(--ink-500)',fontWeight:500}}> +{o.items.length-1} more</span>}</div>
                <div className="d">#{o.id} · {new Date(o.date).toLocaleDateString('en-SG',{day:'numeric',month:'short',year:'numeric'})}</div>
              </div>
              <div className="p">{fmt(o.total)}</div>
              <span className="st">{o.status||'Paid'}</span>
            </div>
          ))}
        </div>

        <div className="section">
          <div className="section-head">
            <h3>Saved Addresses</h3>
            <a href="#" onClick={e=>e.preventDefault()}>Manage</a>
          </div>
          {addresses.map((a) => (
            <div key={a.id} className="addr">
              <div className="t">{a.label} {a.default && <span className="tag default">Default</span>}</div>
              <div className="body" style={{whiteSpace:'pre-line'}}>{addrToString(a)}</div>
            </div>
          ))}
        </div>
      </div>

      <div className="section" style={{marginBottom:28}}>
        <div className="section-head">
          <h3>Receipts</h3>
          {orders.length>0 && <a href="order-history.html">All receipts</a>}
        </div>
        {orders.length===0 ? (
          <div className="empty-mini">Receipts appear here after your first order.</div>
        ) : orders.slice(0,4).map(o => (
          <div key={o.id} className="rec">
            <div className="ic">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="14" y2="17"/></svg>
            </div>
            <div className="m">
              <div className="n">Receipt — #{o.id}</div>
              <div className="d">{new Date(o.date).toLocaleDateString('en-SG',{day:'numeric',month:'short',year:'numeric'})} · {fmt(o.total)} · {o.method}</div>
            </div>
            <a href="#" className="dl" onClick={e=>e.preventDefault()}>Download PDF</a>
          </div>
        ))}
      </div>
    </React.Fragment>
  );
}

function OrdersPanel(){
  const [orders, setOrders] = React.useState([]);
  React.useEffect(() => { try { setOrders(JSON.parse(localStorage.getItem('sm-orders') || '[]')); } catch(_){} }, []);
  if(orders.length === 0){
    return (
      <div className="empty">
        <h3>No orders yet</h3>
        <div>Your past orders will appear here after you check out.</div>
        <a href="product-list.html">Start Shopping</a>
      </div>
    );
  }
  return (
    <div className="orders">
      {orders.map(o => (
        <div key={o.id} className="order">
          <div className="order-head">
            <div className="oh-col"><span className="l">Order #</span><span className="v">{o.id}</span></div>
            <div className="oh-col"><span className="l">Placed</span><span className="v">{new Date(o.date).toLocaleDateString('en-SG',{day:'numeric',month:'short',year:'numeric'})}</span></div>
            <div className="oh-col"><span className="l">Payment</span><span className="v">{o.method}</span></div>
            <div className="oh-col grow" style={{alignItems:'flex-end'}}>
              <span className="l">Status</span>
              <span className="status-pill"><span className="d"/> {o.status||'Paid'}</span>
            </div>
          </div>
          <div className="order-body">
            {o.items.map((it,i)=>(
              <div key={i} className="o-row">
                <img src={it.img} alt=""/>
                <div className="info-r">
                  <div className="n">{it.name}</div>
                  <div className="m">Qty: {it.qty||1}{it.meta?' · '+it.meta:''}</div>
                </div>
                <div className="p">{fmt((it.price||0)*(it.qty||1))}</div>
              </div>
            ))}
          </div>
          <div className="order-foot">
            <div className="order-total">Total {fmt(o.total)}</div>
            <div style={{display:'flex',gap:10}}>
              <a className="btn btn-outline" href="#" onClick={e=>e.preventDefault()}>View Receipt</a>
              <a className="btn btn-outline" href="product-list.html">Buy Again</a>
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

const App = () => {
  const initialTab = (typeof location !== 'undefined' && (location.hash === '#settings' || location.hash === '#orders')) ? 'settings' : 'info';
  const [tab, setTab] = React.useState(initialTab);
  const [user, setUser] = React.useState(readUser() || { name:'Guest User', email:'guest@gmail.com', avatar:null });
  const [orders, setOrders] = React.useState([]);
  const [orderCount, setOrderCount] = React.useState(0);
  const [toastMsg, setToastMsg] = React.useState(null);
  const toast = React.useCallback((m) => { setToastMsg(m); setTimeout(()=>setToastMsg(null), 2200); }, []);

  React.useEffect(() => {
    try { const arr = JSON.parse(localStorage.getItem('sm-orders') || '[]'); setOrders(arr); setOrderCount(arr.length); } catch(_){}
  }, []);
  React.useEffect(() => {
    if(typeof location !== 'undefined') location.hash = tab === 'settings' ? '#settings' : '#info';
  }, [tab]);

  return (
    <div className="wrap">
      {Navi ? <Navi active="Home"/> : null}
      <div className="container">
        <nav className="crumbs"><a href="index.html">Home</a> / <span>Dashboard</span></nav>
        <h1>Dashboard</h1>
        <div className="sub">Your orders, addresses, receipts and profile in one place.</div>
        <div className="tabs" role="tablist">
          <button className={`tab ${tab==='info'?'on':''}`} role="tab" aria-selected={tab==='info'} onClick={()=>setTab('info')}>Info</button>
          <button className={`tab ${tab==='settings'?'on':''}`} role="tab" aria-selected={tab==='settings'} onClick={()=>setTab('settings')}>Settings</button>
        </div>
        {tab === 'settings'
          ? <SettingsPanel user={user} setUser={setUser} toast={toast}/>
          : <InfoPanel orders={orders} gotoOrders={()=>setTab('settings')}/>}
      </div>
      <SiteFooter Icon={Icon} noStores={true}/>
      {toastMsg && <div className="toast">✓ {toastMsg}</div>}
    </div>
  );
};
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
