<!-- @dsCard group="Website" viewport="1440x900" name="Login" subtitle="Sign in page" -->
<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — The Singapore Mint</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../../assets/data/categories.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-body);color:var(--ink-1000);background:#fff;min-height:100vh;display:flex;flex-direction:column}
.main{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.left{background:radial-gradient(ellipse 120% 90% at 60% 60%, #c40024 0%, #6b0015 50%, #0d0003 100%);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.left::before{content:"";position:absolute;inset:0;background:url('../../assets/imagery/noise.png');opacity:.18;mix-blend-mode:overlay}
.left .coins{position:relative;z-index:1;width:420px;height:420px}
.left .coins img{position:absolute;filter:drop-shadow(0 8px 24px rgba(0,0,0,.6))}
.left .tagline{position:absolute;bottom:48px;left:48px;right:48px;z-index:2;color:#fff}
.left .tagline h2{font-family:var(--font-label);font-weight:800;font-size:32px;line-height:1.1;text-transform:uppercase;margin:0 0 8px}
.left .tagline p{font:var(--text-body-reg);color:rgba(255,255,255,.75);margin:0}
.right{display:flex;align-items:center;justify-content:center;padding:64px 80px;background:var(--warm-1)}
.form-box{width:100%;max-width:400px}
.form-box h1{font-family:var(--font-label);font-weight:800;font-size:28px;text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}
.form-box .sub{font:var(--text-meta);color:var(--ink-500);margin:0 0 36px}
.form-box .sub a{color:var(--brand-red-800);text-decoration:none}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:20px}
.field label{font-family:var(--font-label);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-700)}
.field input{height:48px;padding:0 14px;border:1px solid var(--ink-200);border-radius:0;background:#fff;font:var(--text-body-reg);color:var(--ink-1000);outline:none;transition:border-color .15s}
.field input:focus{border-color:var(--brand-red-800)}
.forgot{font:var(--text-meta);color:var(--brand-red-800);text-decoration:none;display:block;text-align:right;margin-top:-12px;margin-bottom:28px}
.btn-primary{width:100%;height:52px;background:var(--brand-red-800);color:#fff;border:0;font-family:var(--font-label);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;transition:opacity .15s;margin-bottom:20px}
.btn-primary:hover{opacity:.9}
.btn-outline{width:100%;height:52px;background:#fff;color:var(--ink-1000);border:1px solid var(--ink-200);font-family:var(--font-label);font-weight:600;font-size:14px;letter-spacing:.04em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:border-color .15s}
.btn-outline:hover{border-color:var(--ink-400)}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--ink-300);font:var(--text-meta)}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--ink-100)}
.register{margin-top:28px;text-align:center;font:var(--text-meta);color:var(--ink-500)}
.register a{color:var(--brand-red-800);text-decoration:none;font-weight:600}
footer.mini{background:#000;color:var(--ink-300);font-family:var(--font-label);font-size:12px;padding:20px 56px;display:flex;align-items:center;justify-content:space-between}
footer.mini img{height:22px;filter:invert(1) hue-rotate(180deg)}
@media(max-width:768px){
  .main{grid-template-columns:1fr}
  .left{display:none}
  .right{padding:40px 24px}
  footer.mini{padding:16px 24px;flex-direction:column;gap:8px;text-align:center}
}
</style><script src="../../components/core/chat-bubble.js" defer></script>
</head>
<body><div id="root"></div>
<script type="text/babel" data-presets="react">
const { } = window.TheSingaporeMintDesignSystem_6a655a;

const App = () => {
  const CREDENTIALS = [
    { email: 'guest@gmail.com', password: 'Abc@abc', name: 'Guest User' },
    { email: 'admin@singaporemint.com', password: 'Admin@123', name: 'Admin' },
  ];
  const [email, setEmail] = React.useState('');
  const [pw, setPw] = React.useState('');
  const [error, setError] = React.useState('');
  const [loading, setLoading] = React.useState(false);

  const handleLogin = () => {
    setError('');
    const match = CREDENTIALS.find(c => c.email === email.trim() && c.password === pw);
    if (!match) { setError('Incorrect email or password. Try guest@gmail.com / Abc@abc'); return; }
    setLoading(true);
    try {
      localStorage.setItem('sm-user', JSON.stringify({ email: match.email, name: match.name }));
      window.dispatchEvent(new CustomEvent('sm-user-updated'));
    } catch(_){}
    setTimeout(() => { window.location.href = '/'; }, 600);
  };

  const handleKey = (e) => { if (e.key === 'Enter') handleLogin(); };

  return (
    <div style={{display:'flex',flexDirection:'column',minHeight:'100vh'}}>
      <div className="main">
        {/* LEFT — brand panel */}
        <div className="left">
          <div className="coins">
            <img src="../../assets/imagery/coins/coin-01.png" style={{width:180,left:'10%',top:'5%',transform:'rotate(-14deg)'}}/>
            <img src="../../assets/imagery/coins/coin-05.png" style={{width:150,left:'52%',top:'0%',transform:'rotate(20deg)'}}/>
            <img src="../../assets/imagery/coins/coin-08.png" style={{width:130,left:'68%',top:'40%',transform:'rotate(-8deg)'}}/>
            <img src="../../assets/imagery/coins/coin-11.png" style={{width:120,left:'5%',top:'52%',transform:'rotate(18deg)'}}/>
            <img src="../../assets/imagery/coins/coin-03.png" style={{width:110,left:'42%',top:'65%',transform:'rotate(-22deg)'}}/>
          </div>
          <div className="tagline">
            <h2>Crafted in Singapore<br/>since 1968</h2>
            <p>Sign in to access your collection, track orders and get member exclusives.</p>
          </div>
        </div>

        {/* RIGHT — form */}
        <div className="right">
          <div className="form-box">
            <h1>Sign In</h1>
            <p className="sub">New here? <a href="/register">Create an account</a></p>

            <div className="field">
              <label>Email address</label>
              <input type="email" placeholder="you@example.com" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={handleKey}/>
            </div>
            <div className="field">
              <label>Password</label>
              <input type="password" placeholder="••••••••" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={handleKey}/>
            </div>
            <a href="#" className="forgot">Forgot password?</a>

            <button className="btn-primary" onClick={handleLogin} disabled={loading}>{loading ? 'Signing in…' : 'SIGN IN'}</button>

            {error && <div style={{background:'#fff2f4',border:'1px solid #ffd1d1',borderRadius:4,padding:'10px 14px',color:'#cf0731',fontFamily:'var(--font-label)',fontWeight:600,fontSize:13,marginBottom:12}}>{error}</div>}

            <div style={{background:'#fafaf9',border:'1px solid var(--ink-75)',borderRadius:4,padding:'10px 14px',fontFamily:'var(--font-body)',fontSize:12.5,color:'var(--ink-500)',marginBottom:20}}>
              <strong style={{color:'var(--ink-800)'}}>Demo credentials:</strong><br/>
              guest@gmail.com / Abc@abc
            </div>

            <div className="divider">or continue with</div>
            <button className="btn-outline">
              <svg width="18" height="18" viewBox="0 0 21 21"><path fill="#f25022" d="M1 1h9v9H1z"/><path fill="#7fba00" d="M11 1h9v9h-9z"/><path fill="#00a4ef" d="M1 11h9v9H1z"/><path fill="#ffb900" d="M11 11h9v9h-9z"/></svg>
              Continue with Microsoft
            </button>

            <div className="register">Don't have an account? <a href="/register">Register now</a></div>
          </div>
        </div>
      </div>

      <footer className="mini">
        <img src="../../assets/brand/sm-logo-slogan.png" alt="The Singapore Mint"/>
        <span>© 2019 Singapore Mint. All Rights Reserved.</span>
      </footer>
    </div>
  );
};
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
