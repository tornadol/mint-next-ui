<script type="text/babel">
const { useState, useRef, useLayoutEffect, useEffect } = React;
const Store={
  get(k){try{return JSON.parse(localStorage.getItem('tsm_'+k))||[]}catch(e){return[]}},
  toggle(k,id){let a=Store.get(k);a=a.indexOf(id)>=0?a.filter(x=>x!==id):a.concat([id]);localStorage.setItem('tsm_'+k,JSON.stringify(a));window.dispatchEvent(new Event('tsm-store'));return a},
  has(k,id){return Store.get(k).indexOf(id)>=0},

};
function useStore(){const[,f]=useState(0);useEffect(()=>{const h=()=>f(x=>x+1);window.addEventListener('tsm-store',h);window.addEventListener('storage',h);return()=>{window.removeEventListener('tsm-store',h);window.removeEventListener('storage',h)}},[]);}

}

        <button onClick={()=>setDrawer(false)} aria-label="Close cart" style={{display:'inline-flex',color:'#000'}}><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg></button>
      </div>
      <div style={{flex:1,minHeight:0,overflowY:'auto',padding:'0 40px',display:cartItems.length?'block':'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:24,textAlign:'center'}}>
        {cartItems.length===0 && <><p style={{margin:0,fontSize:16,color:'#6b6b6b'}}>Your cart is empty.</p><a href="/Shop" style={{alignSelf:'stretch',height:56,display:'flex',alignItems:'center',justifyContent:'center',borderRadius:100,background:'#1a1a1a',color:'#fff',fontSize:14,fontWeight:600,letterSpacing:'.08em',textTransform:'uppercase'}}>Shop all</a></>}
        {cartItems.map((p,i)=>(
          <div key={i} style={{display:'flex',gap:16,padding:'16px 0',borderTop:'1px solid #b9b9b6'}}>
            <div style={{flex:'0 0 96px',height:128,background:'#fff',display:'flex',alignItems:'center',justifyContent:'center'}}><img src={p.img} style={{width:'80%',height:'80%',objectFit:'contain'}}/></div>
            <div style={{flex:1,minWidth:0,display:'flex',flexDirection:'column',gap:10}}>
              <div style={{display:'flex',justifyContent:'space-between',gap:12,alignItems:'flex-start'}}>
                <div className="serif" style={{fontWeight:400,fontSize:18,lineHeight:1.2,color:'#000'}}>{p.name}</div>
                <div style={{fontWeight:600,fontSize:15,whiteSpace:'nowrap'}}>{p.price}</div>
              </div>
              <div style={{fontSize:13,color:'#6b6b6b'}}>{p.desc}</div>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <span style={{display:'inline-flex',alignItems:'center',gap:14,border:'1px solid #d3d3cf',padding:'6px 14px',fontSize:14}}>1</span>
                <button onClick={()=>remove(p)} style={{fontSize:10,letterSpacing:'.08em',textTransform:'uppercase',color:'#6b6b6b'}}>Remove</button>
              </div>
            </div>
          </div>
        ))}
      </div>
      <div style={{padding:'20px 40px 32px',borderTop:'1px solid #b9b9b6',display:cartItems.length?'flex':'none',flexDirection:'column',gap:20}}>
        <div style={{display:'flex',justifyContent:'space-between',fontWeight:600,fontSize:16}}><span>Subtotal</span><span>S${total.toLocaleString('en-SG',{minimumFractionDigits:2})}</span></div>
        <button onClick={()=>location.href='/Checkout'} style={{height:48,borderRadius:100,background:'#1a1a1a',color:'#fff',fontSize:14,fontWeight:600,letterSpacing:'.08em',textTransform:'uppercase',cursor:'pointer'}}>Checkout</button>
        <button onClick={()=>location.href='/Cart'} style={{height:48,borderRadius:100,background:'transparent',border:'2px solid #6b6b6b',color:'#6b6b6b',fontSize:14,fontWeight:600,letterSpacing:'.08em',textTransform:'uppercase',cursor:'pointer'}}>View cart</button>
      </div>
    </aside>
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<!-- support chat widget -->
<style>

.sm-chat-btn svg{width:100%;height:100%;display:block;border-radius:50%}

.sm-chat-input{flex:1;min-width:0;border:1px solid #dcdddd;border-radius:12px;padding:16px;font-size:16px;font-family:inherit;outline:none;color:#000}
.sm-chat-input:focus{border-color:#03363d}
.sm-chat-send{flex:0 0 auto;border:none;border-radius:12px;padding:0 26px;background:var(--tsm-red,#ed1b2f);color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer}

</style>

<div class="sm-chat-panel" id="sm-chat-panel">

  </div>
</div>
</body>
