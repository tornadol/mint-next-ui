<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Secure Checkout — Singapore Mint</title>
<link rel="stylesheet" href="_ds/the-singapore-mint-design-system-e173f591-022e-4eac-9354-1736355188d3/tokens/fonts.css"/>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Kumbh Sans",Helvetica,Arial,sans-serif;color:#1a1a1a;background:#fff}
a{color:#e2231a}
.pay-top{display:flex;align-items:center;justify-content:space-between;padding:22px 40px;border-bottom:1px solid #e6e6e6}
.pay-brand{font-size:20px;font-weight:500}
.pay-secure{display:inline-flex;align-items:center;gap:8px;font-size:16px;color:#333}
.pay-wrap{display:grid;grid-template-columns:1fr 460px;min-height:calc(100vh - 66px)}
.pay-main{padding:48px 40px 64px;max-width:1080px;width:100%;justify-self:center}
.pay-side{background:#f6f6f8;padding:56px 48px}
.pay-back{display:inline-flex;align-items:center;gap:8px;color:#e2231a;font-size:18px;background:none;border:none;cursor:pointer;padding:0;text-decoration:none}
.pay-cardhead{display:flex;align-items:center;justify-content:space-between;margin:56px 0 28px}
.pay-cardhead h2{margin:0;font-size:18px;font-weight:500}
.pay-marks{display:flex;align-items:center;gap:8px}
.mark{height:26px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #e6e6e6;border-radius:4px;padding:0 6px;font-size:11px;font-weight:800}
.mark.mc{gap:0;padding:0 6px}
.mark.mc span{width:16px;height:16px;border-radius:50%}
.mark.mc span:first-child{background:#eb001b}
.mark.mc span:last-child{background:#f79e1b;margin-left:-6px;mix-blend-mode:multiply}
.mark.visa{color:#1a1f71}
label.fld{display:block;margin-bottom:22px}
.fld-label{font-size:15px;font-weight:700;margin-bottom:10px;display:block}
.fld-label .req{color:#e2231a}
.fld-label .opt{font-weight:400;color:#555}
.fld-input{position:relative}
.fld-input input,.fld-input select{width:100%;height:52px;border:1px solid #767676;border-radius:6px;padding:0 44px 0 14px;font-size:16px;font-family:inherit;outline:none;color:#1a1a1a;background:#fff}
.fld-input input:focus,.fld-input select:focus{border-color:#1a1a1a;box-shadow:0 0 0 1px #1a1a1a}
.fld-input .ic{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#555;display:inline-flex}
.pay-row{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.exp-input{display:flex;align-items:center;gap:6px;height:52px;border:1px solid #767676;border-radius:6px;padding:0 14px}
.exp-input input{border:none;outline:none;font-size:16px;font-family:inherit;width:44px;text-align:center;height:auto;padding:0}
.exp-input .sep{color:#999}
.pay-billing{margin:40px 0 8px;font-size:22px;font-weight:600}
.pay-billing .opt{font-size:15px;font-weight:400;color:#555}
.pay-addlink{display:inline-flex;align-items:center;gap:8px;color:#e2231a;font-size:16px;background:none;border:none;cursor:pointer;padding:0;margin:6px 0 22px}
.pay-btn{width:100%;height:56px;border:none;border-radius:6px;background:#d9d9dd;color:#666;font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;cursor:not-allowed;transition:background .15s,color .15s}
.pay-btn.ready{background:#e2231a;color:#fff;cursor:pointer}
.pay-btn.ready:hover{background:#c31d15}
.pay-foot{margin-top:40px;font-size:16px;color:#1a1a1a}
.pay-foot-row{display:flex;align-items:center;justify-content:space-between;margin-top:40px;gap:20px;flex-wrap:wrap}
.pay-lang{display:inline-flex;align-items:center;gap:8px;color:#333;font-size:16px}
.pay-powered{display:inline-flex;align-items:center;gap:10px;color:#333;font-size:16px}
.pay-side h2{margin:0 0 28px;font-size:24px;font-weight:600}
.pay-side .ord{font-size:17px;color:#333}
.pay-side .rule{height:1px;background:#e0e0e4;margin:28px 0}
.pay-total{display:flex;align-items:baseline;justify-content:space-between}
.pay-total .lbl{font-size:20px;color:#333}
.pay-total .amt{font-size:26px;font-weight:500}
.pay-total .cur{font-size:15px;color:#666;margin-right:6px}
@media(max-width:900px){.pay-wrap{grid-template-columns:1fr}.pay-side{order:-1;padding:32px 24px}.pay-main{padding:32px 24px 56px}.pay-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="pay-top"><span class="pay-brand">Singapore Mint</span><span class="pay-secure"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8 11V8a4 4 0 018 0v3" stroke="currentColor" stroke-width="1.6"/></svg>Secure Checkout</span></div>
<div class="pay-wrap">
  <div class="pay-main">
    <a class="pay-back" href="/checkout"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</a>
    <div class="pay-cardhead">
      <h2>Credit or Debit card</h2>
      <div class="pay-marks"><span class="mark mc"><span></span><span></span></span><span class="mark visa">VISA</span></div>
    </div>
    <form id="pay-form">
      <label class="fld"><span class="fld-label">Cardholder name <span style="font-weight:400">(exactly as shown on card)</span> <span class="req">*</span></span><span class="fld-input"><input id="f-name" required autocomplete="cc-name" value="John Tan Ming Xin"/></span></label>
      <label class="fld"><span class="fld-label">Card number <span class="req">*</span></span><span class="fld-input"><input id="f-num" required inputmode="numeric" maxlength="19" autocomplete="cc-number" value="5412 7500 0000 0002"/><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8 11V8a4 4 0 018 0v3" stroke="currentColor" stroke-width="1.6"/></svg></span></span></label>
      <div class="pay-row">
        <div><span class="fld-label">Expiry date <span class="req">*</span></span><div class="exp-input"><input id="f-mm" placeholder="MM" maxlength="2" inputmode="numeric" value="08"/><span class="sep">/</span><input id="f-yy" placeholder="YY" maxlength="2" inputmode="numeric" value="28"/></div></div>
        <label class="fld" style="margin-bottom:0"><span class="fld-label">Security code <span class="req">*</span></span><span class="fld-input"><input id="f-cvv" required inputmode="numeric" maxlength="4" autocomplete="cc-csc" value="123"/><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="12" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3 10h18" stroke="currentColor" stroke-width="1.6"/></svg></span></span></label>
      </div>
      <div class="pay-billing">Billing address <span class="opt">(optional)</span></div>
      <label class="fld"><span class="fld-label">Country</span><span class="fld-input"><select id="f-country"><option value="">Select Country</option><option>Singapore</option><option>Malaysia</option><option>United States</option><option>United Kingdom</option><option>Australia</option></select><span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span></label>
      <label class="fld"><span class="fld-label">Address</span><span class="fld-input"><input id="f-addr"/></span></label>
      <button type="button" class="pay-addlink"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Add Apt #, floor, unit, suite, etc.</button>
      <div class="pay-row">
        <label class="fld"><span class="fld-label">City</span><span class="fld-input"><input id="f-city"/></span></label>
        <label class="fld"><span class="fld-label">Postcode / ZIP Code</span><span class="fld-input"><input id="f-zip"/></span></label>
      </div>
      <label class="fld"><span class="fld-label">State / Province</span><span class="fld-input"><input id="f-state"/></span></label>
      <button type="submit" id="pay-btn" class="pay-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8 11V8a4 4 0 018 0v3" stroke="currentColor" stroke-width="1.6"/></svg><span id="pay-btn-label">Pay SGD $28,656.00</span></button>
      <div class="pay-foot">Singapore Mint</div>
      <div class="pay-foot-row">
        <span class="pay-lang"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 5h10M9 3v2M6 5c0 5 3 8 7 9M11 5c0 4-3 7-7 8M13 20l4-9 4 9M14.5 17h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>English (United States) <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="pay-powered">Powered By <span class="mark mc" style="border:none;padding:0"><span></span><span></span></span></span>
      </div>
    </form>
  </div>
  <div class="pay-side">
    <h2>Order summary</h2>
    <div class="ord">Singapore Mint order 29</div>
    <div class="rule"></div>
    <div class="pay-total"><span class="lbl">Total</span><span class="amt"><span class="cur">SGD</span>$28,656.00</span></div>
  </div>
</div>
<script>
(function(){
  var f=document.getElementById('pay-form');
  var btn=document.getElementById('pay-btn');
  var name=document.getElementById('f-name'),num=document.getElementById('f-num'),mm=document.getElementById('f-mm'),yy=document.getElementById('f-yy'),cvv=document.getElementById('f-cvv');
  num.addEventListener('input',function(){var v=num.value.replace(/\D/g,'').slice(0,16);num.value=v.replace(/(.{4})/g,'$1 ').trim();check();});
  [name,mm,yy,cvv].forEach(function(el){el.addEventListener('input',check);});
  check();
  function check(){
    var ok=name.value.trim().length>1 && num.value.replace(/\s/g,'').length>=15 && mm.value.length===2 && yy.value.length===2 && cvv.value.length>=3;
    btn.classList.toggle('ready',ok);
    return ok;
  }
  f.addEventListener('submit',function(e){
    e.preventDefault();
    if(!check())return;
    document.getElementById('pay-btn-label').textContent='Processing…';
    btn.classList.remove('ready');btn.style.cursor='wait';
    setTimeout(function(){location.href='OrderReceived.html';},1400);
  });
})();
</script>
</body>
</html>
