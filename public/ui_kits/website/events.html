<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Events · The Singapore Mint</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../assets/data/categories.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="../../components/core/SiteFooter.jsx"></script>
<script src="../../components/core/chat-bubble.js" defer></script>
<style>
body{margin:0;background:#fff;color:var(--ink-1000);font-family:var(--font-body)}
a{color:inherit}a:hover{color:#cf0731}
.wrap{max-width:1280px;margin:0 auto}
.wrap>header{width:100vw!important;margin-left:calc(50% - 50vw)}
.container{max-width:1280px;margin:0 auto;padding:0 24px;box-sizing:border-box}
.crumbs{display:flex;gap:8px;padding:20px 0 8px;font-size:13px;color:var(--ink-500)}
.crumbs a{color:var(--ink-500);text-decoration:none}
.crumbs a:hover{color:var(--ink-1000);text-decoration:underline}

.hero{position:relative;background:radial-gradient(120% 100% at 65% 30%, #cf0731 0%, #8a0522 60%, #34000a 100%);color:#fff;padding:56px 40px;border-radius:14px;margin:8px 0 40px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:url('../../assets/imagery/noise.png');opacity:.15;mix-blend-mode:overlay;pointer-events:none}
.hero .kicker{font-family:var(--font-label);font-weight:700;font-size:12px;letter-spacing:.15em;text-transform:uppercase;opacity:.85;margin:0 0 10px}
.hero h1{font-family:var(--font-label);font-weight:800;font-size:44px;letter-spacing:-.01em;margin:0 0 12px;line-height:1.05}
.hero p{font-size:15px;line-height:1.6;max-width:640px;color:rgba(255,255,255,.85);margin:0}
.hero .badge{display:inline-block;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:6px 12px;border-radius:999px;font-family:var(--font-label);font-weight:700;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:16px;backdrop-filter:blur(6px)}

.event{border:1px solid var(--ink-75);border-radius:14px;overflow:hidden;margin-bottom:48px;background:#fff}
.event-banner{position:relative;background:linear-gradient(120deg,#1a1a2e 0,#16213e 55%,#0f3460 100%);color:#fff;padding:40px 44px;overflow:hidden}
.event-banner::before{content:"";position:absolute;right:-40px;top:-40px;width:280px;height:280px;background:radial-gradient(circle,rgba(207,7,49,.5) 0,transparent 70%);pointer-events:none}
.event-banner .tag{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);padding:5px 12px;border-radius:999px;font-family:var(--font-label);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:16px}
.event-banner .tag .live{width:7px;height:7px;border-radius:999px;background:#3ddc84;box-shadow:0 0 0 3px rgba(61,220,132,.25)}
.event-banner h2{font-family:var(--font-label);font-weight:800;font-size:34px;line-height:1.08;margin:0 0 10px;letter-spacing:-.01em;position:relative}
.event-banner p{font-size:15px;line-height:1.6;color:rgba(255,255,255,.82);margin:0;max-width:560px;position:relative}

.event-body{padding:36px 44px}
.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--ink-75);border-radius:12px;overflow:hidden;margin-bottom:36px}
.detail{padding:22px 24px;border-right:1px solid var(--ink-75)}
.detail:last-child{border-right:0}
.detail .l{display:flex;align-items:center;gap:8px;font-family:var(--font-label);font-weight:700;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#cf0731;margin-bottom:10px}
.detail .v{font-family:var(--font-label);font-weight:800;font-size:15px;color:var(--ink-1000);line-height:1.4}
.detail .v span{display:block;font-family:var(--font-body);font-weight:400;font-size:13px;color:var(--ink-600);margin-top:3px}

.subhead{font-family:var(--font-label);font-weight:800;font-size:20px;margin:0 0 4px;color:var(--ink-1000)}
.subhead-note{font-size:13px;color:var(--ink-500);margin:0 0 20px}
.subhead-note b{color:#cf0731;font-weight:700}

.promos{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:32px}
.promo{border:1px solid var(--ink-75);border-radius:12px;padding:24px;background:#fff;position:relative;overflow:hidden}
.promo .ic{width:44px;height:44px;border-radius:10px;background:#fde5ec;color:#cf0731;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.promo h3{font-family:var(--font-label);font-weight:800;font-size:16px;margin:0 0 12px}
.promo ul{padding-left:18px;margin:0;font-size:13.5px;line-height:1.65;color:var(--ink-700)}
.promo li{margin-bottom:6px}
.promo li b{color:var(--ink-1000)}

.tc{background:var(--ink-25);border-radius:10px;padding:16px 20px;font-size:12.5px;color:var(--ink-600);line-height:1.6}
.tc b{color:var(--ink-800)}

.map-strip{display:flex;align-items:center;gap:12px;background:var(--ink-25);border:1px solid var(--ink-75);border-radius:10px;padding:16px 20px;margin-bottom:36px;flex-wrap:wrap}
.map-strip .txt{flex:1;min-width:200px;font-size:13.5px;color:var(--ink-700);line-height:1.5}
.map-strip .txt b{color:var(--ink-1000);font-family:var(--font-label);font-weight:800}
.map-strip a{display:inline-flex;align-items:center;gap:7px;background:#cf0731;color:#fff;text-decoration:none;padding:10px 18px;border-radius:8px;font-family:var(--font-label);font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.map-strip a:hover{background:#a80527;color:#fff}

@media(max-width:900px){
  .hero{padding:40px 24px;border-radius:0;margin-left:-24px;margin-right:-24px}
  .hero h1{font-size:32px}
  .event-banner{padding:32px 24px}
  .event-banner h2{font-size:26px}
  .event-body{padding:26px 24px}
  .detail-grid{grid-template-columns:1fr}
  .detail{border-right:0;border-bottom:1px solid var(--ink-75)}
  .detail:last-child{border-bottom:0}
  .promos{grid-template-columns:1fr}
}

/*om-footer*/
footer.site{background:#000;color:#fff;padding:60px 0 24px;margin-top:0;width:100vw;position:relative;left:50%;right:50%;margin-left:-50vw;margin-right:-50vw}
footer.site .footer-inner{max-width:1280px;margin:0 auto;padding:0 56px;box-sizing:border-box}
footer.site .cols{display:grid;grid-template-columns:repeat(4,1fr);gap:40px}
footer.site h4{font-family:var(--font-label);text-transform:uppercase;font-size:14px;margin:0 0 20px;letter-spacing:.06em;color:#fff}
footer.site ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
footer.site a,footer.site li{color:var(--ink-300);font-family:var(--font-label);font-size:13px;line-height:22px;text-decoration:none}
footer.site .socials{display:flex;gap:12px;margin-top:20px}
footer.site .socials a{width:36px;height:36px;border:1px solid rgba(255,255,255,.25);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff}
footer.site .base{display:flex;align-items:center;justify-content:space-between;padding-top:32px;margin-top:40px;border-top:1px solid rgba(255,255,255,.12);color:var(--ink-300);font-family:var(--font-label);font-size:13px}
.stores-strip{width:100vw;position:relative;left:50%;right:50%;margin-left:-50vw;margin-right:-50vw}
@media(max-width:900px){footer.site .cols{grid-template-columns:1fr;gap:24px}footer.site .footer-inner{padding:0 24px}}
</style></head><body>
