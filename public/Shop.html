          </div>
          <div className="shop-grid">
            {list.length===0 && <p style={{gridColumn:'1/-1',padding:'40px 0',fontFamily:'var(--desktop-body-l-font-family)',fontSize:18,color:'var(--grey-80)'}}>No products match your filters. Try clearing a filter or search term.</p>}
            {list.slice(0,3).map((p,i)=><ShopCard key={i} p={p}/>)}
            {showPromo && <a href="#" className="promo-card" style={{background:'#ed1b2f url(assets/promo-horse-banner.png) right center/cover no-repeat',padding:32}}>
              <div style={{display:'flex',flexDirection:'column',gap:16,maxWidth:360,position:'relative',zIndex:2}}>
                <div className="serif" style={{fontSize:24,lineHeight:1.35,color:'#fff'}}>Welcome the year of the horse with our favourite collectible for 2026</div>
                <div style={{fontFamily:'var(--desktop-body-m-font-family)',fontSize:16}}><span style={{fontWeight:500}}>Singapore Lunar Horse</span> <span style={{color:'rgba(255,255,255,.85)'}}>5 troy oz 999.9 Fine Gold Proof Coin</span></div>

            {list.slice(3).map((p,i)=><ShopCard key={i+3} p={p}/>)}

          <div className="pager">

            <span style={{display:'inline-flex',cursor:'pointer'}}><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg></span>
          </div>
        </div>
      </div>
    </section>

    {/* Footer */}
    <footer style={{background:'var(--tsm-black)',marginTop:40}}>
      <div className="navigation-nav-bar">
        <div className="frame">
          <div className="text-wrapper">Stay connected with us</div>
          <div className="div">
            <p className="p">Be the first to know about new releases, exclusive drops and seasonal collections.</p>
            <form className="frame-2" onSubmit={submit}>
              <div className="newsletter-signup">

              <p className="text-wrapper-4">By providing your email address and clicking on "Sign Up", you consent to the collection, use, and disclosure of your personal data by The Singapore Mint, its related companies, and business partners, to send you promotional and marketing information and materials, including information on events, promotions and lucky draws.</p>
              <p aria-live="polite" style={{position:'absolute',width:1,height:1,overflow:'hidden',clip:'rect(0 0 0 0)'}}>{sent?'Thank you for signing up to our newsletter.':''}</p>
            </form>

        <div className="frame-3">

<!-- support chat widget -->
<style>
.sm-chat-btn{position:fixed;right:24px;bottom:24px;z-index:900;width:60px;height:60px;border-radius:50%;border:none;padding:0;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.25);background:none;transition:transform .18s}
.sm-chat-btn:hover{transform:scale(1.06)}
.sm-chat-btn svg{width:100%;height:100%;display:block;border-radius:50%}
.sm-chat-panel{position:fixed;right:24px;bottom:96px;z-index:901;width:360px;max-width:calc(100vw - 32px);background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.28);display:none;flex-direction:column;font-family:var(--font-sans,"Kumbh Sans",sans-serif)}
.sm-chat-panel.open{display:flex}
.sm-chat-head{background:#03363d;color:#fff;padding:22px 24px;display:flex;align-items:center;justify-content:space-between}
.sm-chat-head h3{margin:0;font-family:var(--font-sans,"Kumbh Sans",sans-serif);font-size:22px;font-weight:700}
.sm-chat-close{background:none;border:none;color:#fff;cursor:pointer;display:inline-flex;padding:4px}
.sm-chat-body{padding:24px}
.sm-chat-greet{margin:0 0 24px;font-size:18px;line-height:1.5;color:#3a3a3a}
.sm-chat-row{display:flex;gap:14px}
.sm-chat-input{flex:1;min-width:0;border:1px solid #dcdddd;border-radius:12px;padding:16px;font-size:16px;font-family:inherit;outline:none;color:#000}
.sm-chat-input:focus{border-color:#03363d}
.sm-chat-send{flex:0 0 auto;border:none;border-radius:12px;padding:0 26px;background:var(--tsm-red,#ed1b2f);color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer}
.sm-chat-send:hover{background:#cf1526}
</style>
<button class="sm-chat-btn" aria-label="Chat with support" onclick="document.getElementById('sm-chat-panel').classList.toggle('open')"><svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="400" cy="400" r="400" fill="#03363d"></circle><path fill="#fff" d="M383 359V541H236zM383 289q0 61-43 103.5T236 435V289zM417 541q0-61 43-103.5T564 395v146zM417 471 564 289v182z"></path></svg></button>
<div class="sm-chat-panel" id="sm-chat-panel">

  <div class="sm-chat-body">
    <p class="sm-chat-greet">Hi! Our team typically replies in a few minutes. How can we help you today?</p>
    <div class="sm-chat-row"><input class="sm-chat-input" placeholder="Type a message..."/><button class="sm-chat-send">Send</button></div>
  </div>
</div>
