<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Singapore Mint</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../../assets/data/categories.js"></script>
<style>
body{margin:0;background:#fff;color:var(--ink-1000);font-family:var(--font-body)}
.wrap{max-width:1280px;margin:0 auto}
.page-pad{max-width:1280px;margin:0 auto;padding:0 24px;box-sizing:border-box}
.rail{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;margin:56px 0 20px}
.section-head h2{font-family:var(--font-body);font-weight:400;font-size:24px;line-height:1.2;text-transform:uppercase;margin:0}
.arrow-btns{display:flex;gap:8px}
.arrow-btn{width:40px;height:40px;border:1px solid var(--ink-200);background:#fff;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;cursor:pointer;color:var(--ink-700);box-shadow:var(--shadow-xs);transition:border-color .15s,box-shadow .15s,color .15s}
.arrow-btn:hover{border-color:var(--ink-400);box-shadow:0 2px 8px rgba(0,0,0,.1);color:var(--ink-1000)}
.arrow-btn:active{box-shadow:none;background:var(--ink-25)}
.chips{display:flex;gap:8px;margin:8px 0 20px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:4px;border:1px solid var(--ink-100);background:#fff;font:var(--text-util);color:var(--ink-800);cursor:pointer}
.chip.on{background:var(--ink-1000);color:#fff;border-color:var(--ink-1000)}
.chip .dot{width:14px;height:14px;border-radius:50%;background:var(--ink-800)}
.chip.on .dot{background:#fff}
.chip .dot.green{background:#3d9a5a}.chip .dot.blue{background:#3277b8}.chip .dot.red{background:var(--brand-red-800)}
.card{background:#fff;border:1px solid var(--ink-75);padding:24px 20px 20px;position:relative;min-height:340px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.card .quick-actions{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:6px;z-index:2}
.card .qa-btn{width:32px;height:32px;border-radius:999px;background:#fff;border:1px solid var(--ink-75);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:#cf0731;opacity:0;transform:translateY(-4px);transition:opacity .15s,transform .15s,background .12s,color .12s,border-color .12s}
.card:hover .qa-btn{opacity:1;transform:translateY(0)}
.card .qa-btn.on{opacity:1;transform:translateY(0);background:#cf0731;color:#fff;border-color:#cf0731}
.card .qa-btn:hover{background:#cf0731;color:#fff;border-color:#cf0731}
.card .add-cart{margin-top:auto;background:#cf0731;color:#fff;border:0;padding:11px 14px;font-family:var(--font-label);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .12s}
.card .add-cart:hover{background:#a30425}
@media(max-width:900px){
  .card .qa-btn{opacity:1!important;transform:none!important;width:28px;height:28px}
}
.card .coin-photo{width:100%;height:200px;display:flex;align-items:center;justify-content:center;margin-bottom:0}
.card .coin-photo img{max-width:100%;max-height:180px;width:180px;object-fit:contain;filter:drop-shadow(0 4px 14px rgba(67,80,95,.20))}
.card .meta{font:var(--text-meta);color:var(--ink-500)}
.card .name{font-family:var(--font-body);font-size:13px;line-height:1.35;color:var(--ink-1000);margin-top:6px;min-height:36px;overflow-wrap:break-word;word-break:break-word;flex:1}
.card .price{font-family:var(--font-label);font-weight:700;font-size:14px;color:var(--ink-1000);margin-top:8px;margin-bottom:14px}
.tile{position:relative;overflow:hidden;color:#fff}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .label{position:absolute;left:16px;bottom:16px;background:#fff;color:var(--ink-1000);padding:6px 14px;font:var(--text-cta);text-transform:uppercase;font-size:12px;letter-spacing:.06em}
.tile .title-lg{position:absolute;left:24px;bottom:56px;color:#fff;font:var(--text-section);font-size:28px;line-height:1.15;max-width:60%}
.promo{background:radial-gradient(ellipse 100% 100% at 75% 60%, #c40024 0%, #6b0015 55%, #1a0006 100%);color:#fff;border:none;padding:36px 32px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;min-height:340px}
.promo::before{content:"";position:absolute;inset:0;background:url('../../assets/imagery/noise.png');opacity:.15;mix-blend-mode:overlay;pointer-events:none;z-index:0}
.promo h3{font-family:var(--font-label);font-weight:800;font-size:26px;line-height:1.15;margin:0 0 8px;max-width:70%;text-transform:uppercase;letter-spacing:.005em;position:relative;z-index:2;color:#fff}
.promo .sub{font:var(--text-body-reg);color:rgba(255,255,255,.75);max-width:70%;margin:0 0 20px;position:relative;z-index:2}
.promo .btn{position:relative;z-index:2;background:#fff!important;color:var(--ink-1000)!important}
.promo .btn:hover{background:var(--ink-25)!important}
.promo .img{position:absolute;right:-40px;bottom:-40px;width:70%;height:80%;background-position:right bottom;background-repeat:no-repeat;background-size:contain;z-index:1;mix-blend-mode:screen;opacity:.9}
.promo .btn{align-self:flex-start}
.banner{margin-top:80px;background:linear-gradient(105deg, #a80018 0%, #cc0020 40%, #e01028 62%, #c1001c 100%);color:#fff;padding:0;display:block;position:relative;overflow:hidden}
.banner::before{content:"";position:absolute;inset:0;background:url('../../assets/imagery/member-wave.jpg') center/cover no-repeat;opacity:.5;mix-blend-mode:overlay;pointer-events:none}
.banner::after{content:"";position:absolute;inset:0;background:url('../../assets/imagery/noise.png');opacity:.12;mix-blend-mode:overlay;pointer-events:none}
.banner h3{font:var(--text-section);font-size:32px;font-weight:700;text-transform:uppercase;letter-spacing:.01em;margin:0}
.banner p{font:var(--text-body-reg);margin:0;opacity:.92;max-width:none;white-space:nowrap}
.banner .btn-dark{margin-top:8px;background:transparent;color:#fff;padding:13px 40px;font:var(--text-cta);font-weight:600;text-transform:uppercase;letter-spacing:.06em;border:1px solid rgba(255,255,255,.7);border-radius:999px;cursor:pointer}
footer.site{background:#000;color:#fff;padding:60px 0 24px;margin-top:0}
footer.site .footer-inner{padding:0 56px}
footer.site .cols{display:grid;grid-template-columns:repeat(4,1fr);gap:40px}
footer.site h4{font:var(--text-label);text-transform:uppercase;font-size:14px;margin:0 0 20px;letter-spacing:.06em;color:#fff}
footer.site ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
footer.site a,footer.site li{color:var(--ink-300);font-family:var(--font-label);font-size:13px;line-height:22px;text-decoration:none}
footer.site .socials{display:flex;gap:12px;margin-top:20px}
footer.site .socials a{width:36px;height:36px;border:1px solid rgba(255,255,255,.25);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff}
footer.site .base{display:flex;align-items:center;justify-content:space-between;padding-top:32px;margin-top:40px;border-top:1px solid rgba(255,255,255,.12);color:var(--ink-300);font-family:var(--font-label);font-size:12px}





.hero{position:relative;min-height:clamp(640px,90vh,880px);overflow:hidden;color:#fff;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 120% at 48% 104%, #d80b2f 0%, #c40024 22%, #6b0015 46%, #1a0006 74%, #000 100%)}
.hero::before{content:"";position:absolute;inset:0;background:url('../../assets/imagery/noise.png');opacity:.22;mix-blend-mode:overlay;pointer-events:none;z-index:1}
.hero .coins{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(720px,92vw);height:auto;z-index:2;pointer-events:none}
.hero .coins video{width:100%;height:auto;display:block;filter:brightness(.95) contrast(1.08)}
.hero .copy{position:relative;z-index:3;text-align:left;padding:0 24px}
.hero h1{font-family:var(--font-label);font-weight:800;font-size:clamp(40px,7vw,92px);line-height:.98;letter-spacing:.01em;margin:0;color:#fff;text-transform:uppercase;text-shadow:0 2px 40px rgba(0,0,0,.4)}
.hero h1 span{display:block}
.hero .actions{display:flex;gap:14px;margin-top:34px}
.hero .pill{padding:14px 30px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.14);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;border-radius:999px;font-family:var(--font-label);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:background .15s}
.hero .pill:hover{background:rgba(255,255,255,.26)}
.hero .pill.outline{background:transparent}
.hero .segs{position:absolute;left:50%;transform:translateX(-50%);bottom:40px;display:flex;gap:10px;z-index:5;width:min(520px,70%)}
.hero .segs i{flex:1;height:3px;background:rgba(255,255,255,.28);border-radius:2px;cursor:pointer}
.hero .segs i.on{background:rgba(255,255,255,.9)}
.hero .coins{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,78vw);height:auto;z-index:1;pointer-events:none;mix-blend-mode:screen}
.hero .hero-tint{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:.8;mix-blend-mode:color;transition:background .5s}
.hero .hero-tint2{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:.35;mix-blend-mode:multiply;transition:background .5s}
.hero .hero-dark{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(70% 80% at 0% 100%, rgba(0,0,0,.72) 0%, rgba(0,0,0,.35) 34%, transparent 62%)}
.hero > .hero-dark{max-width:none;margin:0}
.hero .coins img{position:absolute;filter:drop-shadow(0 8px 24px rgba(0,0,0,.55));opacity:.95}
.hero .copy{position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);z-index:3;max-width:640px;text-align:center}
.hero h1{font-family:var(--font-label);font-weight:600;font-size:64px;line-height:1.02;letter-spacing:.005em;margin:0;color:#fff;text-transform:uppercase;text-shadow:0 2px 40px rgba(0,0,0,.35);text-align:center;max-width:520px}
.hero h1 span{display:block}
.hero .actions{display:flex;gap:14px;margin-top:28px;justify-content:center}
.hero .pill{padding:12px 28px;border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;border-radius:999px;font-family:var(--font-label);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:background .15s}
.hero .pill:hover{background:rgba(255,255,255,.12)}
.hero .pill.solid{background:rgba(255,255,255,.12)}
.hero .dots{position:absolute;left:0;right:0;bottom:36px;display:flex;justify-content:center;gap:14px;z-index:3}
.hero .dots i{display:inline-block;width:36px;height:2px;background:rgba(255,255,255,.35)}
.hero .dots i.on{background:#fff}
.hero .side-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:4;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.hero .side-nav.left{left:24px}.hero .side-nav.right{right:24px}
.collections-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.parade{width:100vw;position:relative;left:50%;right:50%;margin-left:-50vw;margin-right:-50vw;background:#fff;cursor:grab;margin-top:12px}
.parade-clip{overflow:hidden}
.parade.drag{cursor:grabbing}
.parade-track{display:flex;align-items:flex-end;gap:56px;padding:40px 48px 0;height:340px;width:max-content;will-change:transform}
.parade-item{flex:0 0 auto;display:flex;align-items:flex-end;height:100%;text-decoration:none}
.parade-item img{width:auto;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
.parade-pop{position:absolute;top:50%;transform:translate(-50%,-50%);width:340px;max-width:86vw;background:#fff;border-radius:9px;overflow:hidden;box-shadow:0 20px 48px rgba(0,0,0,.26);text-decoration:none;color:var(--ink-1000);z-index:6;animation:ppIn .16s ease}
@keyframes ppIn{from{opacity:0}to{opacity:1}}
.parade-pop .pp-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(30px) saturate(1.1);opacity:.45;transform:scale(1.3)}
.parade-pop .pp-body{position:relative;z-index:1;padding:16px 18px 10px}
.parade-pop .pp-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:20px}
.parade-pop .pp-kicker{font-family:var(--font-body);font-size:11px;color:var(--ink-600)}
.parade-pop .pp-coll{font-family:var(--font-label);font-weight:600;font-size:19px;line-height:1.15;color:var(--ink-1000);letter-spacing:-.01em}
.parade-pop .pp-arrow{flex:0 0 auto;width:36px;height:36px;border-radius:999px;border:1px solid rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;color:var(--ink-1000)}
.parade-pop .pp-arrow svg{width:15px;height:15px}
.parade-pop .pp-name{position:relative;z-index:1;font-family:var(--font-label);font-weight:500;font-size:14px;line-height:1.3;padding:0 18px;color:var(--ink-1000)}
.parade-pop .pp-price{position:relative;z-index:1;font-family:var(--font-label);font-weight:700;font-size:15px;padding:8px 18px 14px;color:var(--ink-1000)}
.parade-pop .pp-cta{position:relative;z-index:1;background:rgba(20,16,14,.8);color:#fff;text-align:center;padding:12px;font-family:var(--font-label);font-weight:600;font-size:12px;letter-spacing:.05em}
.collection-tile{position:relative;overflow:hidden;height:320px;color:#fff}
.collection-tile img{width:100%;height:100%;object-fit:cover;display:block}
.collection-tile .grad{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,rgba(0,0,0,.55) 100%)}
.collection-tile .title{position:absolute;left:20px;right:20px;bottom:56px;color:#fff;font:var(--text-section);font-size:24px;line-height:1.1;text-shadow:0 2px 8px rgba(0,0,0,.35)}
.collection-tile .shop{position:absolute;left:16px;bottom:16px;background:#fff;color:var(--ink-1000);padding:8px 16px;font:var(--text-cta);text-transform:uppercase;font-size:12px;letter-spacing:.06em}

@media(max-width:900px){
  .rail{grid-template-columns:repeat(2,1fr)!important}
  .section-head{padding:0 16px;margin:24px 0 12px}
  .section-head h2{font-size:19px}
  .page-pad{padding:0 16px}
  .chips{flex-wrap:wrap}
  .hero{min-height:clamp(520px,78vh,700px)}
  .hero .coins{width:400px;height:400px}
  .banner{flex-direction:column;gap:20px;padding:28px 24px;text-align:center}
  .banner-inner{flex-direction:column!important;align-items:center!important;text-align:center;gap:18px!important;padding:32px 24px!important}
  .banner-inner > div{width:100%}
  .banner h3{font-size:22px;line-height:1.3}
  .banner p{margin:6px auto 0;max-width:420px;white-space:normal}
  .banner .btn-dark{width:100%!important;max-width:320px}
  .collections-grid{display:flex!important;grid-template-columns:none!important;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;padding:0 16px;margin:0 -16px;-webkit-overflow-scrolling:touch}
  .collections-grid::-webkit-scrollbar{display:none}
  .parade-track{height:210px!important;gap:28px!important;padding:24px 16px 0!important}
  .parade-item img{max-height:150px!important}
  .collection-tile{flex:0 0 78%;max-width:280px;aspect-ratio:1/1;height:auto!important;scroll-snap-align:start}
  .collection-tile .title{font-size:20px;bottom:52px;left:16px;right:16px}
  .collection-tile .shop{padding:6px 14px;font-size:11px}
  footer.site{padding:40px 24px 24px}
  footer.site{padding:20px 20px 18px}
  footer.site .cols{grid-template-columns:repeat(3,1fr);gap:16px 12px}
  footer.site h4,footer.site summary{margin-bottom:10px}
  footer.site ul{gap:6px}
  footer.site .contact-mobile{padding:16px 0 18px;margin-top:8px;border-top:1px solid rgba(255,255,255,.12);border-bottom:0;text-align:center}
  footer.site .contact-mobile h4{margin-bottom:12px}
  footer.site .contact-mobile ul{align-items:center;gap:6px}
  footer.site .contact-mobile .socials{justify-content:center;margin-top:14px}
  footer.site .base{flex-direction:row;flex-wrap:nowrap;gap:12px;margin-top:16px;padding-top:16px;text-align:left;font-size:11px}
  footer.site .base img{height:20px}

  .hero .side-nav{display:none}
}
@media(max-width:600px){
  .rail{grid-template-columns:repeat(2,1fr)!important}
  .promo{padding:24px 20px;min-height:0;grid-column:1 / -1!important}
  .promo h3{font-size:clamp(15px,4.8vw,22px);max-width:100%;margin-bottom:8px;line-height:1.14;overflow-wrap:break-word;word-break:break-word;hyphens:auto}
  .promo .sub{font-size:clamp(12px,3.6vw,14px);line-height:1.45;max-width:100%;margin-bottom:18px}
  .promo .img{width:34%;height:40%;right:-8px;bottom:-6px;opacity:.8}
  .promo .btn{padding:12px 20px!important;font-size:clamp(10.5px,3vw,12px)!important;gap:8px!important;align-self:flex-start!important;width:fit-content!important;max-width:max-content!important;white-space:nowrap;flex-direction:row!important;display:inline-flex!important}
  .hero{min-height:clamp(480px,76vh,640px)}
  .hero .copy{max-width:100%;padding:0 12px}
  .hero h1{font-size:clamp(30px,9.5vw,58px)!important;line-height:1.04}
  .hero .actions{flex-wrap:wrap}
  .hero .coins{width:300px;height:300px;opacity:.5}
  footer.site .cols{grid-template-columns:repeat(3,1fr)}
  footer.site .cols{grid-template-columns:repeat(3,1fr)!important}
  .banner .btn-dark{width:100%}
}
@media(max-width:480px){
  .section-head h2{font-size:17px}
  .section-head{margin:18px 0 10px}
}
/* full-bleed inners cap at 1280 */
.banner-inner{max-width:1280px;margin:0 auto;padding:44px 56px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;box-sizing:border-box;width:100%;position:relative;z-index:1}
@media(max-width:1024px){
  .banner-inner{flex-direction:column!important;align-items:center!important;text-align:center;gap:18px!important;padding:32px 24px!important}
  .banner-inner > div{width:100%}
  .banner h3{line-height:1.3}
  .banner p{margin:6px auto 0;max-width:460px}
  .banner .btn-dark{width:100%!important;max-width:320px}
}
.footer-inner,.stores-inner{max-width:1280px;margin:0 auto;box-sizing:border-box;width:100%}
@media(max-width:900px){
  .banner-inner{flex-direction:column;padding:28px 24px;text-align:center;gap:20px}
}
.cat-nav-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:8px 0 20px}
.cat-nav-item{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 14px 18px;background:#fff;border:1px solid var(--ink-75);border-radius:6px;text-decoration:none;color:var(--ink-1000);overflow:hidden;transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s,border-color .25s}
.cat-nav-item::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,#cf0731,#ff5a75);transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.cat-nav-item:hover{transform:translateY(-6px);box-shadow:0 16px 34px -18px rgba(0,0,0,.28);border-color:var(--ink-200);color:var(--ink-1000)}
.cat-nav-item:hover::before{transform:scaleX(1)}
.cat-nav-thumb{width:78px;height:78px;border-radius:999px;background:radial-gradient(circle at 35% 30%,#fff,#f4efe8);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .3s}
.cat-nav-thumb img{width:58px;height:58px;object-fit:contain;filter:drop-shadow(0 4px 12px rgba(67,80,95,.22));transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.cat-nav-item:hover .cat-nav-thumb{transform:scale(1.06);box-shadow:0 10px 24px -12px rgba(207,7,49,.5)}

<script id="om-fly-cart-js">
(function(){
  function fly(fromEl){
    var img = fromEl && fromEl.closest('.card') && fromEl.closest('.card').querySelector('.coin-photo img');
    var target = document.querySelector('[aria-label="Cart"]') || document.querySelector('.sm-navi-right');
    if(!img || !target) return;
    var s = img.getBoundingClientRect(), t = target.getBoundingClientRect();
    var clone = document.createElement('img');
    clone.src = img.src; clone.className = 'fly-coin';
    clone.style.left = s.left + s.width/2 - 28 + 'px';
    clone.style.top = s.top + s.height/2 - 28 + 'px';
    clone.style.setProperty('--dx', (t.left + t.width/2 - s.left - s.width/2) + 'px');
    clone.style.setProperty('--dy', (t.top + t.height/2 - s.top - s.height/2) + 'px');
    var kf = [
      {transform:'translate(0,0) scale(1) rotate(0)', opacity:1},
      {transform:'translate(calc(var(--dx)*.5), calc(var(--dy)*.2 - 80px)) scale(.7) rotate(120deg)', opacity:.9, offset:.5},
      {transform:'translate(var(--dx), var(--dy)) scale(.15) rotate(240deg)', opacity:0}
    ];
    document.body.appendChild(clone);
    var a = clone.animate(kf, {duration:800, easing:'cubic-bezier(.5,0,.7,1)', fill:'forwards'});
    a.onfinish = function(){ clone.remove(); target.animate([{transform:'scale(1)'},{transform:'scale(1.25)'},{transform:'scale(1)'}], {duration:400, easing:'cubic-bezier(.34,1.56,.64,1)'}); };
  }
  document.addEventListener('click', function(e){
    var b = e.target && e.target.closest && e.target.closest('.add-cart');
    if(b){ b.classList.remove('added'); void b.offsetWidth; b.classList.add('added'); fly(b); }
  }, true);
})();
</script>
