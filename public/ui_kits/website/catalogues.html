<!-- @dsCard group="Website" viewport="1440x1400" name="Catalogues & Order Form" subtitle="e-Catalogues and downloadable order forms" -->
<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalogues & Order Form · The Singapore Mint</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../assets/data/categories.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="../../components/core/SiteFooter.jsx"></script>
<script src="../../components/core/chat-bubble.js" defer></script>
<style>
body{margin:0;background:#fff;color:var(--ink-1000);font-family:var(--font-body)}
a{color:inherit}a:hover{color:#cf0731}
.wrap{max-width:1280px;margin:0 auto}
.wrap>header{width:100vw!important;margin-left:calc(50% - 50vw)}
.container{max-width:1280px;margin:0 auto;padding:0 24px;box-sizing:border-box}
.crumbs{display:flex;gap:8px;padding:20px 0 8px;font-size:13px;color:var(--ink-500)}
.crumbs a{color:var(--ink-500);text-decoration:none}
.crumbs a:hover{color:var(--ink-1000);text-decoration:underline}

.hero{position:relative;background:radial-gradient(120% 100% at 65% 30%, #cf0731 0%, #8a0522 60%, #34000a 100%);color:#fff;padding:56px 40px;border-radius:14px;margin:8px 0 40px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:url('../../assets/imagery/noise.png');opacity:.15;mix-blend-mode:overlay;pointer-events:none}
.hero .kicker{font-family:var(--font-label);font-weight:700;font-size:12px;letter-spacing:.15em;text-transform:uppercase;opacity:.85;margin:0 0 10px}
.hero h1{font-family:var(--font-label);font-weight:800;font-size:44px;letter-spacing:-.01em;margin:0 0 12px;line-height:1.05}
.hero p{font-size:15px;line-height:1.6;max-width:600px;color:rgba(255,255,255,.85);margin:0}

.sec{margin-bottom:56px}
.sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:20px}
.sec-head h2{font-family:var(--font-label);font-weight:800;font-size:26px;letter-spacing:-.005em;margin:0}
.sec-head .count{font-family:var(--font-label);font-weight:700;font-size:12px;color:var(--ink-400);letter-spacing:.04em}

.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.cat{border:1px solid var(--ink-75);border-radius:12px;overflow:hidden;background:#fff;text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s,border-color .15s;display:flex;flex-direction:column}
.cat:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(0,0,0,.12);border-color:transparent;color:inherit}
.cat .cover{position:relative;aspect-ratio:3/4;background:linear-gradient(150deg,#1a1a2e 0,#16213e 60%,#0f3460 100%);display:flex;align-items:center;justify-content:center;overflow:hidden}
.cat .cover.festive{background:linear-gradient(150deg,#7a0018 0,#cf0731 60%,#8a0522 100%)}
.cat .cover::after{content:"";position:absolute;inset:0;background:url('../../assets/imagery/noise.png');opacity:.12;mix-blend-mode:overlay}
.cat .cover .yr{font-family:var(--font-label);font-weight:800;color:rgba(255,255,255,.9);text-align:center;line-height:1.1;padding:20px}
.cat .cover .yr .big{display:block;font-size:46px;letter-spacing:-.02em}
.cat .cover .yr .sm{display:block;font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:8px;color:rgba(255,255,255,.7)}
.cat .cover .flag{position:absolute;top:14px;left:14px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);color:#fff;font-family:var(--font-label);font-weight:700;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;backdrop-filter:blur(6px)}
.cat .meta{padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.cat .meta .t{font-family:var(--font-label);font-weight:700;font-size:14px;line-height:1.35}
.cat .meta .dl{color:#cf0731;flex-shrink:0;display:inline-flex}

.order-card{border:1px solid var(--ink-75);border-radius:14px;padding:36px 40px;background:linear-gradient(180deg,var(--ink-25) 0,#fff 60%)}
.order-card .lead{font-size:15px;line-height:1.6;color:var(--ink-700);margin:0 0 8px;max-width:640px}
.order-card .email{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-label);font-weight:800;font-size:18px;color:#cf0731;text-decoration:none;margin-bottom:26px}
.order-card .email:hover{text-decoration:underline}
.forms{display:flex;flex-wrap:wrap;gap:14px}
.form-dl{display:flex;align-items:center;gap:14px;border:1px solid var(--ink-100);border-radius:10px;padding:16px 20px;text-decoration:none;color:var(--ink-1000);background:#fff;transition:border-color .15s,box-shadow .15s;min-width:280px}
.form-dl:hover{border-color:#cf0731;box-shadow:0 6px 18px rgba(0,0,0,.08);color:var(--ink-1000)}
.form-dl .ic{width:44px;height:44px;border-radius:9px;background:#fde5ec;color:#cf0731;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.form-dl .m{flex:1}
.form-dl .m .n{font-family:var(--font-label);font-weight:700;font-size:14px;line-height:1.3}
.form-dl .m .s{font-size:12px;color:var(--ink-500);margin-top:2px}

@media(max-width:900px){
  .hero{padding:40px 24px;border-radius:0;margin-left:-24px;margin-right:-24px}
  .hero h1{font-size:32px}
  .cat-grid{grid-template-columns:repeat(2,1fr);gap:16px}
  .order-card{padding:28px 24px}
}
@media(max-width:560px){.cat-grid{grid-template-columns:1fr 1fr}.cat .cover .yr .big{font-size:34px}.form-dl{min-width:0;width:100%}}

/*om-footer*/
footer.site{background:#000;color:#fff;padding:60px 0 24px;margin-top:0;width:100vw;position:relative;left:50%;right:50%;margin-left:-50vw;margin-right:-50vw}
footer.site .footer-inner{max-width:1280px;margin:0 auto;padding:0 56px;box-sizing:border-box}
footer.site .cols{display:grid;grid-template-columns:repeat(4,1fr);gap:40px}
footer.site h4{font-family:var(--font-label);text-transform:uppercase;font-size:14px;margin:0 0 20px;letter-spacing:.06em;color:#fff}
footer.site ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
footer.site a,footer.site li{color:var(--ink-300);font-family:var(--font-label);font-size:13px;line-height:22px;text-decoration:none}
footer.site .socials{display:flex;gap:12px;margin-top:20px}
footer.site .socials a{width:36px;height:36px;border:1px solid rgba(255,255,255,.25);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff}
footer.site .base{display:flex;align-items:center;justify-content:space-between;padding-top:32px;margin-top:40px;border-top:1px solid rgba(255,255,255,.12);color:var(--ink-300);font-family:var(--font-label);font-size:13px}
.stores-strip{width:100vw;position:relative;left:50%;right:50%;margin-left:-50vw;margin-right:-50vw}
@media(max-width:900px){footer.site .cols{grid-template-columns:1fr;gap:24px}footer.site .footer-inner{padding:0 24px}}
</style></head><body>
<div id="root"></div>
<script type="text/babel">
const { Navi, Icon } = window.TheSingaporeMintDesignSystem_6a655a;

const CATALOGUES = [
  { title:'2026 July / August Catalogue', big:'2026', sm:'Jul / Aug', flag:'Latest' },
  { title:'2026 March / April Catalogue', big:'2026', sm:'Mar / Apr' },
  { title:'2026 Year of the Horse Festive Catalogue', big:'2026', sm:'Festive', festive:true },
  { title:'2025 July / August Catalogue', big:'2025', sm:'Jul / Aug' },
  { title:'2025 March / April Catalogue', big:'2025', sm:'Mar / Apr' },
  { title:'2025 Year of the Snake Festive Catalogue', big:'2025', sm:'Festive', festive:true },
];

const DlIcon = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;

const App = () => {
  return (
    <div className="wrap">
      {Navi ? <Navi active="Latest"/> : null}
      <div className="container">
        <nav className="crumbs"><a href="index.html">Home</a> / <span>Catalogues & Order Form</span></nav>

        <section className="hero">
          <div className="kicker">Browse & Order</div>
          <h1>Catalogues & Order Form</h1>
          <p>Browse our latest e-Catalogues or download an order form to place your order by email.</p>
        </section>

        <section className="sec">
          <div className="sec-head"><h2>e-Catalogues</h2><span className="count">{CATALOGUES.length} available</span></div>
          <div className="cat-grid">
            {CATALOGUES.map((c,i) => (
              <a key={i} className="cat" href="#" onClick={e=>e.preventDefault()}>
                <div className={`cover${c.festive?' festive':''}`}>
                  {c.flag && <span className="flag">{c.flag}</span>}
                  <div className="yr"><span className="big">{c.big}</span><span className="sm">{c.sm}</span></div>
                </div>
                <div className="meta">
                  <div className="t">{c.title}</div>
                  <span className="dl"><DlIcon/></span>
                </div>
              </a>
            ))}
          </div>
        </section>

        <section className="sec">
          <div className="sec-head"><h2>Order Form</h2></div>
          <div className="order-card">
            <p className="lead">To place your order via order form, email your completed order form to:</p>
            <a className="email" href="mailto:order@singaporemint.com.sg">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/></svg>
              order@singaporemint.com.sg
            </a>
            <div className="forms">
              <a className="form-dl" href="#" onClick={e=>e.preventDefault()}>
                <div className="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></div>
                <div className="m"><div className="n">July / August Catalogue Order Form</div><div className="s">PDF · Download</div></div>
                <span className="dl" style={{color:'#cf0731'}}><DlIcon/></span>
              </a>
            </div>
          </div>
        </section>
      </div>

      <SiteFooter Icon={Icon}/>
    </div>
  );
};
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
