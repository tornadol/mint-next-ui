<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Order · The Singapore Mint</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../assets/data/categories.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="../../components/core/site-footer.runtime.js"></script>
<script src="../../components/core/chat-bubble.js" defer></script>
<style>
body{margin:0;background:#fff;color:var(--ink-1000);font-family:var(--font-body)}
html,body{overflow-x:hidden}
a{color:inherit}a:hover{color:#cf0731}
.wrap{max-width:1280px;margin:0 auto;overflow-x:hidden}
.container{max-width:1000px;margin:0 auto;padding:0 24px;box-sizing:border-box}
.crumbs{display:flex;gap:8px;padding:20px 0 8px;font-size:13px;color:var(--ink-500)}
.crumbs a{color:var(--ink-500);text-decoration:none}
.crumbs a:hover{color:var(--ink-1000);text-decoration:underline}
h1{font-family:var(--font-label);font-weight:800;font-size:30px;margin:6px 0 4px;letter-spacing:-.01em}
.sub{color:var(--ink-500);font-size:14px;margin:0 0 26px}
.carrier{display:flex;align-items:center;gap:18px;flex-wrap:wrap;border:1px solid var(--ink-75);border-radius:14px;padding:22px 26px;margin-bottom:22px;background:linear-gradient(180deg,var(--ink-25) 0,#fff 70%)}
.carrier .logo{font-family:var(--font-label);font-weight:900;font-size:22px;letter-spacing:-.02em;padding:10px 16px;border-radius:8px;color:#fff;flex-shrink:0}
.carrier .logo.fedex{background:#4d148c}.carrier .logo.fedex .x{color:#ff6200}
.carrier .logo.ninja{background:#c8102e;font-size:16px}
.carrier .logo.jnt{background:#d3141a;font-size:18px}
.carrier .meta{flex:1;min-width:200px}
.carrier .meta .l{font-family:var(--font-label);font-weight:700;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-500)}
.carrier .meta .track-no{font-family:var(--font-label);font-weight:800;font-size:20px;color:var(--ink-1000);letter-spacing:.01em;margin-top:3px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.carrier .copy-btn{background:none;border:1px solid var(--ink-100);border-radius:6px;padding:4px 10px;font-family:var(--font-label);font-weight:600;font-size:11px;color:var(--ink-600);cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.carrier .copy-btn:hover{border-color:var(--ink-400);color:var(--ink-1000)}
.carrier .ext{display:inline-flex;align-items:center;gap:8px;background:#cf0731;color:#fff;text-decoration:none;padding:12px 20px;border-radius:8px;font-family:var(--font-label);font-weight:700;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.carrier .ext:hover{background:#a80527;color:#fff}
.eta{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--ink-75);border-radius:12px;overflow:hidden;margin-bottom:24px}
.eta .cell{padding:18px 22px;border-right:1px solid var(--ink-75)}
.eta .cell:last-child{border-right:0}
.eta .cell .k{font-family:var(--font-label);font-weight:700;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-500);margin-bottom:6px}
.eta .cell .v{font-family:var(--font-label);font-weight:800;font-size:15px;color:var(--ink-1000);line-height:1.3}
.eta .cell .v.live{color:#0a8a4a;display:inline-flex;align-items:center;gap:7px}
.eta .cell .v.live .dot{width:8px;height:8px;border-radius:999px;background:#0a8a4a;position:relative}
.eta .cell .v.live .dot::after{content:"";position:absolute;inset:0;border-radius:999px;background:#0a8a4a;animation:pl 1.6s ease-out infinite}
@keyframes pl{0%{transform:scale(1);opacity:.6}70%,100%{transform:scale(2.8);opacity:0}}
.prog{display:flex;align-items:center;margin:8px 0 30px;padding:0 6px}
.prog .node{display:flex;flex-direction:column;align-items:center;gap:8px;flex-shrink:0;width:80px;text-align:center}
.prog .node .dot{width:34px;height:34px;border-radius:999px;border:2px solid var(--ink-100);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--ink-300)}
.prog .node.done .dot{background:#0a8a4a;border-color:#0a8a4a;color:#fff}
.prog .node.current .dot{background:#cf0731;border-color:#cf0731;color:#fff;box-shadow:0 0 0 5px rgba(207,7,49,.15)}
.prog .node .cap{font-family:var(--font-label);font-weight:700;font-size:10.5px;letter-spacing:.02em;color:var(--ink-500);line-height:1.25}
.prog .node.done .cap,.prog .node.current .cap{color:var(--ink-1000)}
.prog .bar{flex:1;height:3px;background:var(--ink-100);border-radius:2px;margin:0 -6px 26px}
.prog .bar.done{background:#0a8a4a}
.tl-card{border:1px solid var(--ink-75);border-radius:14px;padding:26px 30px;margin-bottom:40px}
.tl-card h2{font-family:var(--font-label);font-weight:800;font-size:16px;margin:0 0 22px}
.tl{position:relative;padding-left:30px}
.tl::before{content:"";position:absolute;left:9px;top:6px;bottom:10px;width:2px;background:var(--ink-75)}
.tl-item{position:relative;padding-bottom:24px}
.tl-item:last-child{padding-bottom:0}
.tl-item .mk{position:absolute;left:-30px;top:1px;width:20px;height:20px;border-radius:999px;background:#fff;border:2px solid var(--ink-100);display:flex;align-items:center;justify-content:center}
.tl-item.done .mk{background:#0a8a4a;border-color:#0a8a4a}
.tl-item.done .mk::after{content:"";width:6px;height:6px;border-radius:999px;background:#fff}
.tl-item.current .mk{border-color:#cf0731;background:#cf0731;box-shadow:0 0 0 4px rgba(207,7,49,.14)}
.tl-item.current .mk::after{content:"";width:6px;height:6px;border-radius:999px;background:#fff}
.tl-item .t{font-family:var(--font-label);font-weight:800;font-size:14px;color:var(--ink-400)}
.tl-item.done .t,.tl-item.current .t{color:var(--ink-1000)}
.tl-item .loc{font-size:13px;color:var(--ink-600);margin-top:2px}
.tl-item .ts{font-size:12px;color:var(--ink-400);margin-top:3px;font-family:var(--font-label);font-weight:600}
.tl-item.current .t::after{content:"In progress";margin-left:10px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:#fff3e0;color:#c26a00;padding:2px 8px;border-radius:999px;vertical-align:middle}
.empty{border:1px dashed var(--ink-100);border-radius:12px;padding:70px 30px;text-align:center;color:var(--ink-500)}
.empty h3{font-family:var(--font-label);font-weight:800;font-size:20px;color:var(--ink-1000);margin:0 0 8px}
.empty a{display:inline-block;margin-top:14px;background:#cf0731;color:#fff;text-decoration:none;padding:12px 24px;font-family:var(--font-label);font-weight:700;font-size:12px;letter-spacing:.05em;text-transform:uppercase;border-radius:6px}
@media(max-width:700px){
  .eta{grid-template-columns:1fr}
  .eta .cell{border-right:0;border-bottom:1px solid var(--ink-75)}
  .eta .cell:last-child{border-bottom:0}
  .prog{overflow-x:auto;padding-bottom:6px}
  .carrier .ext{width:100%;justify-content:center}
}
/*om-footer*/
footer.site{background:#000;color:#fff;padding:60px 0 24px;margin-top:0;width:100vw;position:relative;left:50%;right:50%;margin-left:-50vw;margin-right:-50vw}
footer.site .footer-inner{max-width:1280px;margin:0 auto;padding:0 56px;box-sizing:border-box}
footer.site .cols{display:grid;grid-template-columns:repeat(4,1fr);gap:40px}
footer.site h4{font-family:var(--font-label);text-transform:uppercase;font-size:14px;margin:0 0 20px;letter-spacing:.06em;color:#fff}
footer.site ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
footer.site a,footer.site li{color:var(--ink-300);font-family:var(--font-label);font-size:13px;line-height:22px;text-decoration:none}
footer.site .socials{display:flex;gap:12px;margin-top:20px}
footer.site .socials a{width:36px;height:36px;border:1px solid rgba(255,255,255,.25);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff}
footer.site .base{display:flex;align-items:center;justify-content:space-between;padding-top:32px;margin-top:40px;border-top:1px solid rgba(255,255,255,.12);color:var(--ink-300);font-family:var(--font-label);font-size:13px}
.stores-strip{width:100vw;position:relative;left:50%;right:50%;margin-left:-50vw;margin-right:-50vw}
@media(max-width:900px){footer.site .cols{grid-template-columns:1fr;gap:24px}footer.site .footer-inner{padding:0 24px}}
</style></head><body>
<div id="root"></div>
<script type="text/babel">
const { Navi, Icon } = window.TheSingaporeMintDesignSystem_6a655a;
const fmt = n => '$' + (n||0).toFixed(2);
function hash(str){ let h=0; str=String(str||''); for(let i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))>>>0; } return h; }

const CARRIERS = [
  { key:'fedex', name:'FedEx', cls:'fedex', prefix:'SGM', url:'https://www.fedex.com/fedextrack/?trknbr=' },
  { key:'ninja', name:'Ninja Van', cls:'ninja', prefix:'NVSG', url:'https://www.ninjavan.co/en-sg/tracking?id=' },
  { key:'jnt', name:'J&T Express', cls:'jnt', prefix:'JT', url:'https://www.jtexpress.sg/index/query/gzquery.html?bills=' },
];
const SHORT = ['Placed','Picked up','In transit','Out for delivery','Delivered'];
const STAGES = ['Order placed','Picked up','In transit','Out for delivery','Delivered'];
const HUBS = ['Singapore Mint Fulfilment, Teban Gardens','Jurong Sorting Hub','Changi Distribution Centre','Local Delivery Depot','Recipient Address'];

function getTracking(order){
  const h = hash(order.id);
  const carrier = CARRIERS[h % CARRIERS.length];
  const trackNo = carrier.prefix + String(h).padStart(11,'0').slice(0,11);
  const placed = new Date(order.date);
  const daysSince = Math.floor((Date.now() - placed.getTime()) / 86400000);
  let stage = Math.min(4, Math.max(1, daysSince));
  if ((order.status||'').toLowerCase()==='delivered') stage = 4;
  if (order.fulfill==='pickup') stage = Math.min(stage, 3);
  return { carrier, trackNo, stage };
}
function stamp(base, hoursOffset){
  const d = new Date(base.getTime() + hoursOffset*3600000);
  return d.toLocaleString('en-SG',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit',hour12:true});
}

const App = () => {
  const params = new URLSearchParams(location.search);
  const wantId = params.get('order');
  const [order, setOrder] = React.useState(undefined);
  const [copied, setCopied] = React.useState(false);
  React.useEffect(() => {
    let list = [];
    try { list = JSON.parse(localStorage.getItem('sm-orders')||'[]'); } catch(_){}
    const found = wantId ? list.find(o=>String(o.id)===String(wantId)) : list[0];
    setOrder(found || null);
  }, []);
  if (order === undefined) return <div className="container" style={{padding:'80px 24px'}}></div>;
  return (
    <div className="wrap">
      {Navi ? <Navi active="Home"/> : null}
      <div className="container">
        <nav className="crumbs"><a href="index.html">Home</a> / <a href="order-history.html">Orders</a> / <span>Track</span></nav>
        {!order ? (
          <div className="empty">
            <h3>Order not found</h3>
            <div>We couldn't find that order to track. Check your order history for the tracking link.</div>
            <a href="order-history.html">View Order History</a>
          </div>
        ) : <Tracker order={order} copied={copied} setCopied={setCopied}/>}
      </div>
      <SiteFooter Icon={Icon} noStores={true}/>
    </div>
  );
};

function Tracker({order, copied, setCopied}){
  const { carrier, trackNo, stage } = getTracking(order);
  const placed = new Date(order.date);
  const isPickup = order.fulfill==='pickup';
  const finalLabel = isPickup ? 'Ready for collection' : 'Delivered';
  const etaDate = new Date(placed.getTime() + (isPickup?2:4)*86400000);
  const events = STAGES.map((s,i)=>({
    title: i===4 ? finalLabel : s,
    loc: HUBS[i],
    ts: i<=stage ? stamp(placed, i*14 + 2) : null,
    done: i < stage,
    current: i === stage,
  }));
  const copy = () => { try{ navigator.clipboard.writeText(trackNo); setCopied(true); setTimeout(()=>setCopied(false),1500);}catch(_){} };
  return (
    <React.Fragment>
      <h1>Track your order</h1>
      <div className="sub">Order <strong>{order.id}</strong> · Placed {placed.toLocaleDateString('en-SG',{day:'numeric',month:'short',year:'numeric'})} · {order.items.reduce((s,i)=>s+(i.qty||1),0)} item(s)</div>
      <div className="carrier">
        <div className={`logo ${carrier.cls}`}>{carrier.key==='fedex' ? <span>Fed<span className="x">Ex</span></span> : carrier.name}</div>
        <div className="meta">
          <div className="l">{carrier.name} · Tracking number</div>
          <div className="track-no">{trackNo}
            <button className="copy-btn" onClick={copy}>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              {copied ? 'Copied' : 'Copy'}
            </button>
          </div>
        </div>
        <a className="ext" href={carrier.url + trackNo} target="_blank" rel="noopener">
          Track on {carrier.name}
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
      </div>
      <div className="eta">
        <div className="cell"><div className="k">Status</div><div className="v live"><span className="dot"/>{SHORT[stage]}</div></div>
        <div className="cell"><div className="k">{isPickup?'Ready by':'Estimated delivery'}</div><div className="v">{etaDate.toLocaleDateString('en-SG',{weekday:'short',day:'numeric',month:'short'})}</div></div>
        <div className="cell"><div className="k">{isPickup?'Collect at':'Ship to'}</div><div className="v" style={{fontSize:13,fontWeight:600}}>{(order.address||'').split('—').slice(-1)[0].trim().slice(0,42)}</div></div>
      </div>
      <div className="prog">
        {SHORT.map((s,i)=>(
          <React.Fragment key={i}>
            {i>0 && <div className={`bar${i<=stage?' done':''}`}/>}
            <div className={`node${i<stage?' done':''}${i===stage?' current':''}`}>
              <div className="dot">
                {i<stage
                  ? <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                  : <span style={{fontFamily:'var(--font-label)',fontWeight:800,fontSize:13}}>{i+1}</span>}
              </div>
              <div className="cap">{s}</div>
            </div>
          </React.Fragment>
        ))}
      </div>
      <div className="tl-card">
        <h2>Shipment activity</h2>
        <div className="tl">
          {events.slice().reverse().map((e,i)=>(
            <div key={i} className={`tl-item${e.done?' done':''}${e.current?' current':''}`}>
              <div className="mk"/>
              <div className="t">{e.title}</div>
              <div className="loc">{e.loc}</div>
              {e.ts ? <div className="ts">{e.ts}</div> : <div className="ts" style={{color:'var(--ink-300)'}}>Pending</div>}
            </div>
          ))}
        </div>
      </div>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
