<!-- @dsCard group="Website" viewport="1440x1200" name="Stay Connected" subtitle="Mailing list signup and social media" -->
<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stay Connected · The Singapore Mint</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../assets/data/categories.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="../../components/core/site-footer.runtime.js"></script>
<script src="../../components/core/chat-bubble.js" defer></script>
<style>
body{margin:0;background:#fff;color:var(--ink-1000);font-family:var(--font-body)}
a{color:inherit}a:hover{color:#cf0731}
.wrap{max-width:1280px;margin:0 auto}
.container{max-width:1280px;margin:0 auto;padding:0 24px;box-sizing:border-box}
.crumbs{display:flex;gap:8px;padding:20px 0 8px;font-size:13px;color:var(--ink-500)}
.crumbs a{color:var(--ink-500);text-decoration:none}
.crumbs a:hover{color:var(--ink-1000);text-decoration:underline}

.hero{position:relative;background:radial-gradient(120% 100% at 65% 30%, #cf0731 0%, #8a0522 60%, #34000a 100%);color:#fff;padding:56px 40px;border-radius:14px;margin:8px 0 40px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:url('../../assets/imagery/noise.png');opacity:.15;mix-blend-mode:overlay;pointer-events:none}
.hero .kicker{font-family:var(--font-label);font-weight:700;font-size:12px;letter-spacing:.15em;text-transform:uppercase;opacity:.85;margin:0 0 10px}
.hero h1{font-family:var(--font-label);font-weight:800;font-size:44px;letter-spacing:-.01em;margin:0 0 12px;line-height:1.05}
.hero p{font-size:15px;line-height:1.6;max-width:560px;color:rgba(255,255,255,.85);margin:0}

.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;padding-bottom:64px;align-items:start}
.card{border:1px solid var(--ink-75);border-radius:14px;padding:36px 40px;background:#fff}
.eyebrow{font-family:var(--font-label);font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#cf0731;margin:0 0 8px}
.card h2{font-family:var(--font-label);font-weight:800;font-size:24px;margin:0 0 6px;letter-spacing:-.005em}
.card .lead{font-size:14px;color:var(--ink-600);line-height:1.55;margin:0 0 24px}

.signup{display:flex;gap:12px;margin-bottom:16px}
.signup input{flex:1;height:52px;padding:0 16px;border:1px solid var(--ink-200);border-radius:8px;font-family:var(--font-body);font-size:15px;color:var(--ink-1000);outline:none;transition:border-color .15s,box-shadow .15s}
.signup input:focus{border-color:#cf0731;box-shadow:0 0 0 3px rgba(207,7,49,.12)}
.signup button{height:52px;padding:0 28px;background:#cf0731;color:#fff;border:0;border-radius:8px;font-family:var(--font-label);font-weight:700;font-size:14px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:background .15s}
.signup button:hover{background:#a80527}
.consent{font-size:11.5px;line-height:1.6;color:var(--ink-500);margin:0}
.thanks{display:flex;align-items:center;gap:12px;background:#e8f6ec;border:1px solid #cce6d6;border-radius:10px;padding:16px 20px;margin-bottom:16px;color:#0a5a30;font-family:var(--font-label);font-weight:600;font-size:14px}
.thanks .ic{width:32px;height:32px;border-radius:50%;background:#0a8a4a;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}

.socials-list{display:flex;flex-direction:column;gap:14px}
.social{display:flex;align-items:center;gap:16px;padding:18px 20px;border:1px solid var(--ink-75);border-radius:12px;text-decoration:none;transition:border-color .15s,transform .15s,box-shadow .15s;color:var(--ink-1000)}
.social:hover{border-color:transparent;transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.1);color:var(--ink-1000)}
.social .ic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.social.fb .ic{background:#1877f2}
.social.ig .ic{background:linear-gradient(45deg,#f09433 0,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%)}
.social .m .n{font-family:var(--font-label);font-weight:800;font-size:15px;line-height:1.2}
.social .m .h{font-size:13px;color:var(--ink-500);margin-top:2px}
.social .arw{margin-left:auto;color:var(--ink-300)}

@media(max-width:900px){
  .hero{padding:40px 24px;border-radius:0;margin-left:-24px;margin-right:-24px}
  .hero h1{font-size:32px}
  .grid{grid-template-columns:1fr;gap:20px}
  .card{padding:28px 24px}
  .signup{flex-direction:column}
  .signup button{width:100%}
}

/*om-footer*/
footer.site{background:#000;color:#fff;padding:60px 0 24px;margin-top:0;width:100vw;position:relative;left:50%;right:50%;margin-left:-50vw;margin-right:-50vw}
footer.site .footer-inner{max-width:1280px;margin:0 auto;padding:0 56px;box-sizing:border-box}
footer.site .cols{display:grid;grid-template-columns:repeat(4,1fr);gap:40px}
footer.site h4{font-family:var(--font-label);text-transform:uppercase;font-size:14px;margin:0 0 20px;letter-spacing:.06em;color:#fff}
footer.site ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
footer.site a,footer.site li{color:var(--ink-300);font-family:var(--font-label);font-size:13px;line-height:22px;text-decoration:none}
footer.site .socials{display:flex;gap:12px;margin-top:20px}
footer.site .socials a{width:36px;height:36px;border:1px solid rgba(255,255,255,.25);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff}
footer.site .base{display:flex;align-items:center;justify-content:space-between;padding-top:32px;margin-top:40px;border-top:1px solid rgba(255,255,255,.12);color:var(--ink-300);font-family:var(--font-label);font-size:13px}
.stores-strip{width:100vw;position:relative;left:50%;right:50%;margin-left:-50vw;margin-right:-50vw}
@media(max-width:900px){footer.site .cols{grid-template-columns:1fr;gap:24px}footer.site .footer-inner{padding:0 24px}}
</style></head><body>
<div id="root"></div>
<script type="text/babel">
const { Navi, Icon } = window.TheSingaporeMintDesignSystem_6a655a;

const App = () => {
  const [email, setEmail] = React.useState('');
  const [done, setDone] = React.useState(false);
  const [err, setErr] = React.useState('');
  const submit = () => {
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ setErr('Please enter a valid email address.'); return; }
    setErr(''); setDone(true);
  };
  return (
    <div className="wrap">
      {Navi ? <Navi active="Latest"/> : null}
      <div className="container">
        <nav className="crumbs"><a href="/">Home</a> / <span>Stay Connected</span></nav>

        <section className="hero">
          <div className="kicker">Stay in the loop</div>
          <h1>Stay Connected</h1>
          <p>Be the first to know about new releases, event-exclusive prices, promotions and lucky draws from The Singapore Mint.</p>
        </section>

        <div className="grid">
          <div className="card">
            <p className="eyebrow">Mailing List</p>
            <h2>Receive updates from The Singapore Mint</h2>
            <p className="lead">Sign up with your email to get the latest coin launches, catalogues and members' offers delivered to your inbox.</p>

            {done ? (
              <div className="thanks">
                <div className="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
                You're on the list! Thank you for subscribing.
              </div>
            ) : (
              <React.Fragment>
                <div className="signup">
                  <input type="email" placeholder="Email address" value={email} onChange={e=>{setEmail(e.target.value); setErr('');}} onKeyDown={e=>{if(e.key==='Enter') submit();}}/>
                  <button onClick={submit}>Sign Up</button>
                </div>
                {err && <p style={{color:'#cf0731',fontSize:13,margin:'0 0 12px',fontFamily:'var(--font-label)',fontWeight:600}}>{err}</p>}
              </React.Fragment>
            )}

            <p className="consent">By providing your email address and clicking on "Sign Up", you consent to the collection, use, and disclosure of your personal data by The Singapore Mint, its related companies, and business partners, to send you promotional and marketing information and materials, including information on events, promotions and lucky draws.</p>
          </div>

          <div className="card">
            <p className="eyebrow">Social Media</p>
            <h2>Follow Us</h2>
            <p className="lead">Join our community for behind-the-scenes looks, giveaways and collector highlights.</p>
            <div className="socials-list">
              <a className="social fb" href="https://www.facebook.com/TheSingaporeMint" target="_blank" rel="noopener">
                <div className="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M22 12a10 10 0 1 0-11.56 9.88v-6.99H7.9V12h2.54V9.8c0-2.5 1.49-3.89 3.78-3.89 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56V12h2.78l-.44 2.89h-2.34v6.99A10 10 0 0 0 22 12z"/></svg></div>
                <div className="m"><div className="n">Facebook</div><div className="h">@TheSingaporeMint</div></div>
                <div className="arw"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg></div>
              </a>
              <a className="social ig" href="https://www.instagram.com/thesingaporemint" target="_blank" rel="noopener">
                <div className="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg></div>
                <div className="m"><div className="n">Instagram</div><div className="h">@thesingaporemint</div></div>
                <div className="arw"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg></div>
              </a>
            </div>
          </div>
        </div>
      </div>

      <SiteFooter Icon={Icon}/>
    </div>
  );
};
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
