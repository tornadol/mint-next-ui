<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Promotions · The Singapore Mint</title>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
body{margin:0;background:#fff;color:var(--ink-1000);font-family:var(--font-body)}
a{color:inherit}a:hover{color:#cf0731}
.wrap{max-width:1280px;margin:0 auto}
.container{max-width:1280px;margin:0 auto;padding:0 24px;box-sizing:border-box}
.crumbs{display:flex;gap:8px;padding:20px 0 8px;font-size:13px;color:var(--ink-500)}
.crumbs a{color:var(--ink-500);text-decoration:none}
.crumbs a:hover{color:var(--ink-1000);text-decoration:underline}

.hero{position:relative;background:radial-gradient(120% 100% at 65% 30%, #cf0731 0%, #8a0522 60%, #34000a 100%);color:#fff;padding:56px 40px;border-radius:14px;margin-bottom:32px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:url('../../assets/imagery/noise.png');opacity:.15;mix-blend-mode:overlay;pointer-events:none}
.hero .kicker{font-family:var(--font-label);font-weight:700;font-size:12px;letter-spacing:.15em;text-transform:uppercase;opacity:.85;margin:0 0 10px}
.hero h1{font-family:var(--font-label);font-weight:800;font-size:44px;letter-spacing:-.01em;margin:0 0 12px;line-height:1.05}
.hero p{font-size:15px;line-height:1.6;max-width:640px;color:rgba(255,255,255,.85);margin:0}
.hero .badge{display:inline-block;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:6px 12px;border-radius:999px;font-family:var(--font-label);font-weight:700;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:16px;backdrop-filter:blur(6px)}

.layout{display:grid;grid-template-columns:260px 1fr;gap:40px;padding-bottom:64px;align-items:start;position:relative}
.toc{background:var(--ink-25);border-radius:10px;padding:22px 20px;border:1px solid var(--ink-75);box-sizing:border-box}
.toc h4{font-family:var(--font-label);font-weight:800;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-500);margin:0 0 12px}
.toc ol{list-style:none;padding:0;margin:0;counter-reset:t;display:flex;flex-direction:column;gap:4px}
.toc li{counter-increment:t}
.toc a{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:6px;font-family:var(--font-label);font-weight:600;font-size:13px;color:var(--ink-700);text-decoration:none;line-height:1.45}
.toc a::before{content:counter(t,decimal-leading-zero);font-family:var(--font-label);font-weight:800;font-size:10.5px;color:#cf0731;flex-shrink:0;padding-top:2px}
.toc a:hover{background:#fff;color:var(--ink-1000)}
.toc a.on{background:#fff;color:#cf0731}

.content{min-width:0}
.sec{margin-bottom:56px;scroll-margin-top:100px}
.sec h2{font-family:var(--font-label);font-weight:800;font-size:26px;letter-spacing:-.005em;margin:0 0 6px;color:var(--ink-1000)}
.sec .lead{font-size:14px;color:var(--ink-500);margin:0 0 22px;line-height:1.5}
.sec .lead b{color:#cf0731;font-weight:800}
.sec h3{font-family:var(--font-label);font-weight:800;font-size:17px;margin:22px 0 8px}
.sec p{font-size:14px;line-height:1.65;color:var(--ink-800);margin:0 0 12px}
.sec .rule{height:1px;background:var(--ink-50);margin:20px 0}
.sec .note{background:var(--ink-25);border-left:3px solid var(--ink-200);padding:12px 16px;font-size:13px;color:var(--ink-700);line-height:1.6;border-radius:0 6px 6px 0}
.sec .note b{color:#cf0731;font-weight:700}

.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
.tier{position:relative;border:1px solid var(--ink-75);border-radius:12px;padding:24px 22px;background:#fff;overflow:hidden}
.tier::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(207,7,49,.05) 0,transparent 40%);pointer-events:none}
.tier .t{font-family:var(--font-label);font-weight:700;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-500);margin-bottom:8px}
.tier .amt{font-family:var(--font-label);font-weight:800;font-size:22px;color:var(--ink-1000);line-height:1.15;margin-bottom:14px}
.tier .gift{font-family:var(--font-label);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#cf0731;background:#fde5ec;display:inline-block;padding:3px 10px;border-radius:999px;margin-bottom:10px}
.tier .reward{font-family:var(--font-label);font-weight:800;font-size:16px;color:var(--ink-1000);line-height:1.35}
.tier.gold{border-color:#cf0731;background:linear-gradient(180deg,#fff7f9 0,#fff 60%)}
.tier.gold::after{content:"BEST VALUE";position:absolute;top:12px;right:12px;background:#cf0731;color:#fff;font-family:var(--font-label);font-weight:800;font-size:9.5px;letter-spacing:.08em;padding:3px 8px;border-radius:999px}

.free-ship{display:flex;gap:18px;align-items:center;background:linear-gradient(90deg,#f4faf6 0,#e8f6ec 100%);border:1px solid #cce6d6;border-radius:12px;padding:20px 24px;margin-top:22px}
.free-ship .ic{width:48px;height:48px;border-radius:50%;background:#0a8a4a;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.free-ship .m .t{font-family:var(--font-label);font-weight:800;font-size:15px;color:#0a5a30}
.free-ship .m .s{font-size:13px;color:#0a5a30;margin-top:3px;line-height:1.5}

.tc{background:var(--ink-25);border-radius:10px;padding:20px 24px;margin-top:20px}
.tc ol,.tc ul{padding-left:20px;margin:0;font-size:13.5px;line-height:1.7;color:var(--ink-700)}
.tc li{margin-bottom:6px}
.tc h4{font-family:var(--font-label);font-weight:800;font-size:13.5px;margin:0 0 10px;letter-spacing:.02em;color:var(--ink-900)}
.tc h4:not(:first-child){margin-top:18px}

.baby{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.baby .card{border:1px solid var(--ink-75);border-radius:10px;padding:20px;background:#fff;display:flex;gap:16px;align-items:center}
.baby img{width:88px;height:88px;object-fit:contain;background:var(--ink-25);border-radius:8px;padding:8px;flex-shrink:0}
.baby .m{flex:1;min-width:0}
.baby .m .sku{font-family:var(--font-label);font-weight:700;font-size:10.5px;letter-spacing:.08em;color:var(--ink-500);margin-bottom:4px}
.baby .m .n{font-family:var(--font-label);font-weight:800;font-size:14px;line-height:1.3;margin-bottom:6px}
.baby .m .prices{display:flex;align-items:baseline;gap:8px;font-family:var(--font-label)}
.baby .m .prices .sp{font-weight:800;font-size:17px;color:#cf0731}
.baby .m .prices .up{font-weight:600;font-size:12.5px;color:var(--ink-500);text-decoration:line-through}

.return-card{display:flex;gap:20px;align-items:center;background:#fff;border:1px dashed var(--ink-200);border-radius:12px;padding:22px 26px;margin-top:14px}
.return-card .ic{width:64px;height:64px;background:#fff7f9;color:#cf0731;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.return-card .m .t{font-family:var(--font-label);font-weight:800;font-size:17px;margin-bottom:6px}
.return-card .m p{margin:0;font-size:13.5px;color:var(--ink-700);line-height:1.55}
.return-card .m .off{color:#cf0731;font-weight:800}

@media(max-width:900px){
  .layout{grid-template-columns:1fr;gap:24px}
  .toc{position:static;width:auto;max-height:none;top:auto;left:auto!important;order:-1}
  .hero{padding:40px 24px;border-radius:0;margin-left:-24px;margin-right:-24px}
  .hero h1{font-size:32px}
  .tiers{grid-template-columns:1fr}
  .baby{grid-template-columns:1fr}
  .return-card{flex-direction:column;align-items:flex-start}
}

/*om-footer*/
footer.site{background:#000;color:#fff;padding:60px 0 24px;margin-top:0;width:100vw;position:relative;left:50%;right:50%;margin-left:-50vw;margin-right:-50vw}
footer.site .footer-inner{max-width:1280px;margin:0 auto;padding:0 56px;box-sizing:border-box}
footer.site .cols{display:grid;grid-template-columns:repeat(4,1fr);gap:40px}
footer.site h4{font-family:var(--font-label);text-transform:uppercase;font-size:14px;margin:0 0 20px;letter-spacing:.06em;color:#fff}
footer.site ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
footer.site a,footer.site li{color:var(--ink-300);font-family:var(--font-label);font-size:13px;line-height:22px;text-decoration:none}
footer.site .socials{display:flex;gap:12px;margin-top:20px}
footer.site .socials a{width:36px;height:36px;border:1px solid rgba(255,255,255,.25);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff}
footer.site .base{display:flex;align-items:center;justify-content:space-between;padding-top:32px;margin-top:40px;border-top:1px solid rgba(255,255,255,.12);color:var(--ink-300);font-family:var(--font-label);font-size:13px}
.stores-strip{width:100vw;position:relative;left:50%;right:50%;margin-left:-50vw;margin-right:-50vw}
@media(max-width:900px){footer.site .cols{grid-template-columns:1fr;gap:24px}footer.site .footer-inner{padding:0 24px}}
</style></head><body>
<div id="root"></div>
<script type="text/babel">
const { Navi, Icon } = window.TheSingaporeMintDesignSystem_6a655a;

const SECTIONS = [
  { id:'catalogue', label:'Catalogue Promotions — 15 Jul to 31 Aug 2026' },
  { id:'limited',   label:'Limited Time Offers & Members\u2019 Price' },
  { id:'spend',     label:'Spend & Be Rewarded' },
  { id:'delivery',  label:'Free Local Delivery' },
  { id:'horse',     label:'2026 Year of the Horse Promotions' },
  { id:'early',     label:'Members\u2019 Exclusive Early Bird Prices' },
  { id:'newborn',   label:'Newborn Privilege' },
  { id:'return',    label:'Return & Reward' },
  { id:'terms',     label:'Terms and Conditions' },
];

const App = () => {
  const [active, setActive] = React.useState(SECTIONS[0].id);
  const lockRef = React.useRef(0);
  const tocRef = React.useRef(null);
  React.useEffect(() => {}, []);
  React.useEffect(() => {
    const onScroll = () => {
      if (Date.now() < lockRef.current) return;
      const y = window.scrollY + 140;
      let cur = SECTIONS[0].id;
      for (const s of SECTIONS){
        const el = document.getElementById(s.id);
        if (el){
          const top = el.getBoundingClientRect().top + window.scrollY;
          if (top <= y) cur = s.id;
        }
      }
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 4) cur = SECTIONS[SECTIONS.length-1].id;
      setActive(cur);
    };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive:true });
    window.addEventListener('resize', onScroll);
    return () => { window.removeEventListener('scroll', onScroll); window.removeEventListener('resize', onScroll); };
  }, []);

  const jump = (id) => (e) => { e.preventDefault(); const el = document.getElementById(id); if (el){ setActive(id); lockRef.current = Date.now() + 900; window.scrollTo({top: el.getBoundingClientRect().top + window.scrollY - 100, behavior:'smooth'}); } };

  return (
    <div className="wrap">
      {Navi ? <Navi active="Latest"/> : null}
      <div className="container">
        <nav className="crumbs"><a href="/">Home</a> / <span>Promotions</span></nav>

        <div className="layout">
          <aside className="toc" ref={tocRef} aria-label="On this page">
            <h4>On this page</h4>
            <ol>
              {SECTIONS.map(s => (
                <li key={s.id}><a href={'#'+s.id} className={active===s.id?'on':''} onClick={jump(s.id)}>{s.label}</a></li>
              ))}
            </ol>
          </aside>

          <main className="content">
            <section className="hero">
              <span className="badge">15 Jul — 31 Aug 2026</span>
              <div className="kicker">Latest Offers</div>
              <h1>Promotions</h1>
              <p>Enjoy launch specials, member pricing, gift-with-purchase, and exclusive early-bird savings across our 2026 collection — including the Singapore Year of the Horse Chinese Almanac Coins.</p>
            </section>

            <section id="catalogue" className="sec">
              <h2>Catalogue Promotions*</h2>
              <p className="lead">*Valid for orders and purchases made at The Singapore Mint between <b>15 July to 31 August 2026</b> only.</p>
            </section>

            <section id="limited" className="sec">
              <h2>Limited Time Offers & Members’ Price</h2>
              <p>Launch Special &amp; Special Buy promotional prices for products featured in the catalogue are valid for a limited time until <b>31 August 2026</b>.</p>
              <div className="rule"/>
              <p>Members with valid <b>GOLD</b> or <b>PLATINUM</b> membership can enjoy members’ prices for purchases made at retail shops or through mail-order form.</p>
            </section>

            <section id="spend" className="sec">
              <h2>Spend & Be Rewarded<sup>^</sup></h2>
              <p>Receive up to <b>$100 gift vouchers</b> when you place your order online, via mail order, or make a purchase at any of The Singapore Mint retail shops between 15 July to 31 August 2026:</p>

              <h3>Gift Tiers</h3>
              <div className="tiers">
                <div className="tier">
                  <div className="t">Tier 1</div>
                  <div className="amt">$300 – $599</div>
                  <div className="gift">Gifts worth ≥ $30</div>
                  <div className="reward">$30 Singapore Mint<br/>Gift Vouchers<sup>^</sup></div>
                </div>
                <div className="tier gold">
                  <div className="t">Tier 2</div>
                  <div className="amt">$600 – $899</div>
                  <div className="gift">Gifts worth ≥ $50</div>
                  <div className="reward">$50 Singapore Mint<br/>Gift Vouchers<sup>^</sup></div>
                </div>
                <div className="tier">
                  <div className="t">Tier 3</div>
                  <div className="amt">$900 & Above</div>
                  <div className="gift">Gifts worth ≥ $100</div>
                  <div className="reward">$100 Singapore Mint<br/>Gift Vouchers<sup>^</sup></div>
                </div>
              </div>

              <div className="note" style={{marginTop:18}}><b>^Note:</b> Terms and conditions apply. See full terms at the bottom of this page.</div>
            </section>

            <section id="delivery" className="sec">
              <h2>Free Delivery on Orders $500 & Above</h2>
              <div className="free-ship">
                <div className="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></div>
                <div className="m">
                  <div className="t">Enjoy free local delivery</div>
                  <div className="s">With a minimum spend of <b>$500</b> in a single transaction.</div>
                </div>
              </div>

              <div className="tc">
                <h4>Terms & Conditions</h4>
                <ul>
                  <li>Promotions are applicable to purchases and orders made through The Singapore Mint retail stores, mail orders, and online at <a href="#">www.singaporemint.com</a>.</li>
                  <li>Promotions do not apply to investment-grade precious metal products or products under the Lion Bullion range.</li>
                  <li>The Singapore Mint gift vouchers may be used to offset up to <b>50%</b> of the total transaction value in a single receipt for a subsequent purchase.</li>
                  <li>Gift vouchers are not valid for the purchase of precious metal products, coins, or notes.</li>
                  <li>Availability of products and promotional items is subject to stock availability and is offered while stocks last.</li>
                  <li>Gift items may be substituted with another item of similar value without prior notice.</li>
                  <li>All other terms and conditions of The Singapore Mint apply.</li>
                  <li>The management reserves the right to amend terms and conditions of the promotions without prior notice.</li>
                </ul>
              </div>
            </section>

            <section id="horse" className="sec">
              <h2>2026 Singapore Year of the Horse Chinese Almanac Coins</h2>
              <p className="lead">Celebrate the Year of the Horse with exclusive coin promotions.</p>
            </section>

            <section id="early" className="sec">
              <h2>Members’ Exclusive Early Bird Prices</h2>
              <p>Members enjoy early bird pricing on selected 2026 Singapore Year of the Horse Chinese Almanac coins.</p>
              <p>Look out for limited-time special prices listed on the order forms, which will be mailed to your registered address. <b>Valid for mail orders received by 14th December 2025.</b></p>
            </section>

            <section id="newborn" className="sec">
              <h2>Newborn Privilege</h2>
              <p>Celebrate the arrival of your little one with special savings!</p>
              <p>Simply present your baby's birth certificate or supporting documents to enjoy exclusive discounts on selected coins. Offer applies to orders placed via email and retail shops received by <b>31st December 2026</b>. Terms and conditions apply.</p>

              <div className="baby">
                <div className="card">
                  <img src="../../assets/imagery/coins/coin-03.png" alt=""/>
                  <div className="m">
                    <div className="sku">[S003]</div>
                    <div className="n">1 troy oz 999 Fine Silver Proof Coin</div>
                    <div className="prices"><span className="sp">$148</span><span className="up">U.P $163</span></div>
                  </div>
                </div>
                <div className="card">
                  <img src="../../assets/imagery/coins/coin-04.png" alt=""/>
                  <div className="m">
                    <div className="sku">[S004]</div>
                    <div className="n">1 troy oz 999 Fine Silver Proof Colour Coin</div>
                    <div className="prices"><span className="sp">$158</span><span className="up">U.P $173</span></div>
                  </div>
                </div>
              </div>

              <div className="tc" style={{marginTop:18}}>
                <ul>
                  <li>Applicable for babies due to be born from <b>17th February 2026 to 6th February 2027</b> only.</li>
                  <li>Limited to <b>one piece</b> per selected 2026 Singapore Year of the Horse coins (products S003 &amp; S004) per baby only.</li>
                  <li>Offer is valid until <b>31st December 2026</b>.</li>
                  <li>All products are subject to availability and on a while-stock-last basis.</li>
                </ul>
              </div>
            </section>

            <section id="return" className="sec">
              <h2>Return & Reward</h2>
              <div className="return-card">
                <div className="ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></div>
                <div className="m">
                  <div className="t">Trade in your empty coin boxes</div>
                  <p>Got your coin collection in a set and no longer need the individual boxes? Bring your <b>S001 / S002 boxes</b> back to our retail shops and enjoy <span className="off">$2 OFF</span> your next purchase for every box returned! Declutter, save, and upgrade your collection today.</p>
                </div>
              </div>
              <p style={{marginTop:14,fontSize:13,color:'var(--ink-500)'}}>$2 discount applies to any purchases made at the retail shops, excluding [S624] Lunar Horse Red Packets. Terms and conditions apply.</p>
            </section>

            <section id="terms" className="sec">
              <h2>Terms and Conditions</h2>
              <div className="tc">
                <h4>General Terms</h4>
                <ul>
                  <li>All products and promotional items are subject to stock availability.</li>
                  <li>Proof of identification will be required for collection of pre-orders along with the original copy of the collection letter.</li>
                  <li>Customers may be required to provide their name, mobile number, the last 4 characters of their NRIC, and/or email, and consent to the PDPA clause to be eligible for any of The Singapore Mint’s promotional activities.</li>
                  <li>The Management reserves the right to amend the terms and conditions without prior notice.</li>
                </ul>

                <h4>Terms & Conditions for Gift with Purchase (GWP)</h4>
                <ol>
                  <li>Redemption of gifts is exclusively available at The Singapore Mint retail shops at <b>Coin Gallery (Head Office)</b>, <b>Chinatown Point Mall</b>, and <b>Suntec City Mall</b>.</li>
                  <li>Orders opting for local delivery may redeem their free gifts at The Singapore Mint retail stores during the promotional period by presenting the original delivery letter. Redemption for gift(s) may be rejected if original delivery letter is not produced.</li>
                  <li>Original proof of purchase and proof of identification must be presented for any redemption(s).</li>
                  <li>One receipt is only entitled to <b>1 gift tier redemption</b>.</li>
                  <li>Redemption value must be in a single receipt only and cannot be of combined receipts. Redemption value does not include the purchase of vouchers or the use of any vouchers.</li>
                  <li>Gift items may be replaced with another item of similar size or value.</li>
                  <li>Strictly no cancellation of orders.</li>
                  <li>Gifts are available on a while-stocks-last basis.</li>
                  <li>Gifts are limited to <b>one gift tier per redemption</b>.</li>
                  <li>The Singapore Mint reserves the right in its sole discretion to amend the Terms and Conditions without prior notice.</li>
                </ol>
              </div>
            </section>
          </main>
        </div>
      </div>

      <SiteFooter Icon={Icon}/>
    </div>
  );
};
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
