<body><div id="root"></div>
<script type="text/babel">
const { useState } = React;
const NS = window.TheSingaporeMintDesignSystem_e173f5 || {};
function Ic({name,size=22,color}){
  const C = NS[name];
  const glyph = C ? <C size={size}/> : (NS.Icon ? <NS.Icon name={name} size={size}/> : null);
  return glyph ? <span style={{color,display:'inline-flex'}}>{glyph}</span> : <span style={{width:size,height:size,display:'inline-block'}}/>;
}
const mLink={fontFamily:'var(--desktop-body-m-font-family)',fontSize:16,fontWeight:400,color:'#000',lineHeight:1.2};
const mHead={fontFamily:'var(--desktop-subheading-5-uppercase-font-family)',fontSize:12,fontWeight:500,letterSpacing:'0.96px',textTransform:'uppercase',color:'#BABABA'};
const RAFFLES_SLUG={'Sanrio':'sanrio','Peanuts':'peanuts','Pokemon':'pokemon','Teletubbies':'teletubbies','Strawberry Shortcake':'strawberry-shortcake','Mr Merlion':'mr-merlion'};
function navHref(label){if(!label)return '#';if(RAFFLES_SLUG[label])return 'Collection.html?c='+RAFFLES_SLUG[label];const m={'About us':'About.html','Membership':'Membership.html','Visit our stores':'Stores.html','All Raffles Mint':'Collection.html','Custom corporate gifts':'CorporateGifts.html','Catalogue orders':'CatalogueOrders.html','Coin recycling':'CoinRecycling.html'};return m[label]||'Shop.html';}

const SHOP_MENU_A = ['Bestsellers','Sale items','Shop all'];
const SHOP_MENU_B = [
  {h:'Shop by Type',items:['Coins','Medallions & Ingots','Figurines & Ornaments','Jewelry & Accessories','Notes','International Collectibles'],all:'All types'},
  {h:'Raffles Mint',items:['Sanrio','Peanuts','Pokemon','Teletubbies','Strawberry Shortcake','Mr Merlion'],all:'All Raffles Mint'},
];
const SHOP_MENU_C = [
  {h:'Shop by Theme',items:['2026 Lunar New Year','Singapore Series','Pop Culture'],all:'All themes'},
  {h:'Gifting Ideas',items:['Corporate','Babies','Weddings'],all:'All gifting ideas'},
];
const DISCOVER_MENU = [
  {h:'The Singapore Mint',items:['About us','Membership','Visit our stores']},
  {h:'Our Services',items:['Custom corporate gifts','Catalogue orders','Coin recycling']},
  {h:'Investment-grade bullion',items:['Lion Bullion by The Singapore Mint'],ext:true},
];
function MenuGroup({group}){
  return (
    <div style={{width:210,display:'flex',flexDirection:'column',gap:20}}>
      <div style={mHead}>{group.h}</div>
      <div style={{display:'flex',flexDirection:'column',gap:12,opacity:.8}}>
        {group.items.map(x=><a key={x} href={group.ext?"https://lionbullion.com.sg/":navHref(x)} target={group.ext?"_blank":undefined} rel={group.ext?"noopener noreferrer":undefined} style={{...mLink,display:'inline-flex',alignItems:'flex-end',gap:6}}>{x}{group.ext&&<Ic name="IconsOpenLink" size={12}/>}</a>)}
        {group.all && <a href={navHref(group.all)} style={{...mLink,textDecoration:'underline'}}>{group.all}</a>}
      </div>
    </div>
  );
}
const MSHOP=[
  {h:'SHOP',items:['Bestsellers',{t:'Sale items',tag:true}],all:'Shop all'},
  {h:'SHOP BY TYPE',items:['Coins','Medallions & Ingots','Figurines & Ornaments','Jewelry & Accessories','Notes','International Collectibles'],all:'All types'},
  {h:'SHOP BY THEME',items:['2026 Lunar New Year','Singapore Series','Pop Culture'],all:'Shop all'},
  {h:'RAFFLES MINT',items:['Sanrio','Peanuts','Pokemon','Teletubbies','Strawberry Shortcake','Mr Merlion'],all:'All Raffles Mint'},
  {h:'GIFTING IDEAS',items:['Corporate','Babies','Weddings'],all:'All gifting ideas'},
];
function MobGroup({g}){
  return (
    <div className="mob-grp">
      <div className="mob-grp-h">{g.h}</div>
      {g.items.map((it,idx)=>{
        const label = typeof it==='string'?it:it.t;
        const tag = typeof it==='object'&&it.tag;
        return <a key={idx} href={g.ext?"https://lionbullion.com.sg/":navHref(label)} target={g.ext?"_blank":undefined} rel={g.ext?"noopener noreferrer":undefined} className="mob-grp-a">{label}{tag&&<Ic name="IconsDiscount" size={14} color="var(--tsm-red)"/>}{g.ext&&<Ic name="IconsOpenLink" size={12}/>}</a>;
      })}
      {g.all&&<a href={navHref(g.all)} className="mob-grp-a all">{g.all}</a>}
    </div>
  );
}
function MobMenu({open,onClose,onCart}){
  const [sub,setSub]=useState(null);
  if(!open) return null;
  const groups = sub==='shop'?MSHOP:sub==='discover'?DISCOVER_MENU:null;
  return ReactDOM.createPortal((
    <div className="mob-menu">
      <div className="mob-menu-top">
        <img src="assets/logo.svg" style={{height:22,display:'block'}}/>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <button className="icobtn" aria-label="Cart" onClick={onCart}><Ic name="IconsCart"/></button>
          <button className="icobtn" aria-label="Close menu" onClick={()=>{setSub(null);onClose();}}><Ic name="IconsClose"/></button>
        </div>
      </div>
      {!sub ? <>
        <div className="mob-menu-body">
          <div className="mob-search"><input placeholder="Search..."/><Ic name="IconsSearch" color="var(--grey-60)"/></div>
          <button className="mob-row" onClick={()=>setSub('shop')}>Shop<span className="mob-chev"><Ic name="IconsDropdown" size={18}/></span></button>
          <button className="mob-row" onClick={()=>setSub('discover')}>Discover<span className="mob-chev"><Ic name="IconsDropdown" size={18}/></span></button>
          <a className="mob-row" href="News.html">News<span className="mob-chev"><Ic name="IconsDropdown" size={18}/></span></a>
          <a className="mob-row" href="Favourites.html">Favourites<span className="mob-chev"><Ic name="IconsLeftArrow" size={16}/></span></a>
          <a className="mob-row" href="Compare.html">Compare<span className="mob-chev"><Ic name="IconsLeftArrow" size={16}/></span></a>
        </div>
        <a href="#" className="mob-login">Login/Register</a>
      </> : <div className="mob-menu-body">
        <button className="mob-back" onClick={()=>setSub(null)}><Ic name="IconsLeftArrow" size={16}/>Back</button>
        {groups.map(g=><MobGroup key={g.h} g={g}/>)}
      </div>}
    </div>
  ), document.body);
}
function FootAcc({title,cls,children}){
  const [open,setOpen]=useState(false);
  return (
    <div className={(cls||'frame-7')+' foot-acc'+(open?' open':'')}>
      <button type="button" className="foot-head" onClick={()=>setOpen(o=>!o)}>
        <div className="text-wrapper-5">{title}</div>
        <span className="foot-toggle"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg></span>
      </button>
      <div className="foot-body">{children}</div>
    </div>
  );
}
function CartDrawer({open,onClose}){
  const [qty,setQty]=useState(1);
  const [gone,setGone]=useState(false);
  const unit=33700;
  const money=(n)=>'S$'+n.toLocaleString('en-SG',{minimumFractionDigits:2});
  return ReactDOM.createPortal((
    <>
      <div className={"cart-scrim"+(open?" show":"")} onClick={onClose}/>
      <aside className={"cart-drawer"+(open?" open":"")} aria-hidden={!open}>
        <div className="cart-head">
          <h2 className="serif cart-title">Shopping Cart ({gone?0:qty})</h2>
          <button className="cart-x" aria-label="Close cart" onClick={onClose}><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg></button>
        </div>
        <div className="cart-body">
          {gone ? <div className="cart-empty"><p>Your cart is empty.</p><a href="Shop.html" className="cart-shopall">Shop all</a></div> : <div className="cart-item">
            <div className="cart-item-img"><img src="assets/coin-horse-gold.png" alt=""/></div>
            <div className="cart-item-main">
              <div className="cart-item-top">
                <div className="cart-item-name">Singapore Lunar Horse</div>
                <div className="cart-item-price">{money(unit)}</div>
              </div>
              <div className="cart-item-meta">
                <span className="cart-badge">PRE-ORDER</span>
                <span>5 troy oz 999.9 Fine Gold Proof Coin</span>
                <span>S010</span>
              </div>
              <div className="cart-item-actions">
                <div className="cart-qty">
                  <button onClick={()=>setQty(q=>Math.max(1,q-1))} aria-label="Decrease"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M5 12h14" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/></svg></button>
                  <span>{qty}</span>
                  <button onClick={()=>setQty(q=>q+1)} aria-label="Increase"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/></svg></button>
                </div>
                <button className="cart-remove" onClick={()=>setGone(true)}>Remove</button>
              </div>
            </div>
          </div>}
        </div>
        {!gone && <div className="cart-foot">
          <div className="cart-subtotal"><span>Subtotal</span><span>{money(unit*qty)}</span></div>
          <button className="cart-checkout" onClick={()=>location.href='Checkout.html'}>Checkout</button>
          <button className="cart-viewcart" onClick={()=>location.href='Cart.html'}>View cart</button>
        </div>}
      </aside>
    </>
  ), document.body);
}
function Header(){
  const [menu,setMenu]=useState(null);
  const [mob,setMob]=useState(false);
  const [cart,setCart]=useState(false);
  return (
    <header className="site-header" style={{position:'relative',background:'#fff',borderBottom:'1px solid rgba(0,0,0,.4)'}} onMouseLeave={()=>setMenu(null)}>
      <div className="wrap" style={{height:72,display:'grid',gridTemplateColumns:'1fr auto 1fr',alignItems:'center'}}>
        <a href="Homepage.html" aria-label="The Singapore Mint" style={{justifySelf:'start'}}><img src="assets/logo.svg" style={{height:24,display:'block'}}/></a>
        <nav className="hdr-nav" style={{display:'flex',gap:30,justifySelf:'center'}}>
          <a className="navlink" href="Shop.html" onMouseEnter={()=>setMenu('shop')} style={(menu?menu==='shop':/(shop|collection|product|compare|favourites)\.html$/i.test(location.pathname))?{color:'#000',borderBottom:'2px solid #000'}:undefined}>Shop</a>
          <a className="navlink" href="About.html" onMouseEnter={()=>setMenu('discover')} style={(menu?menu==='discover':/(about|corporategifts|account|stores|membership|catalogueorders|coinrecycling)\.html$/i.test(location.pathname))?{color:'#000',borderBottom:'2px solid #000'}:undefined}>Discover</a>
          <a className="navlink" href="News.html" onMouseEnter={()=>setMenu(null)} style={(menu?false:/(news|article)\.html$/i.test(location.pathname))?{color:'#000',borderBottom:'2px solid #000'}:undefined}>News</a>
        </nav>
        <div style={{display:'flex',alignItems:'center',gap:6,justifySelf:'end'}}>
          <button className="icobtn hdr-util"><Ic name="IconsSearch"/></button>
          {(()=>{let u=null;try{u=JSON.parse(localStorage.getItem('tsm_user'));}catch(e){}return u?(
            <div className="acct hdr-util" tabIndex={0}>
              <button className="acct-trigger" aria-label="Account">{u.name}</button>
              <div className="acct-menu">
                <div className="acct-head"><div className="acct-name">{u.name}</div><div className="acct-email">{u.email}</div></div>
                <a className="acct-link" href="Account.html"><Ic name="IconsAccount" size={18}/>My Account</a>
                <button className="acct-link acct-signout" onClick={()=>{localStorage.removeItem('tsm_user');location.reload();}}><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 17l5-5-5-5M20 12H9M12 4H6a2 2 0 00-2 2v12a2 2 0 002 2h6" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>Sign out</button>
              </div>
            </div>
          ):(<a className="icobtn hdr-util" href="Login.html" aria-label="Account"><Ic name="IconsAccount"/></a>);})()}
          <button className="icobtn hdr-util" aria-label="Favorites" onClick={()=>location.href='Favourites.html'}><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 21l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.18L12 21z" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round"/></svg></button>
          <button className="icobtn hdr-util" aria-label="Compare" onClick={()=>location.href='Compare.html'}><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 4v17M7.5 21h9M4 7h16M12 4.5a1 1 0 100-.01M4 7l-2.5 5.5a3 3 0 006 0L4 7zM20 7l-2.5 5.5a3 3 0 006 0L20 7z" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg></button>
          <button className="icobtn" style={{position:'relative'}} aria-label="Cart" onClick={()=>setCart(true)}><Ic name="IconsCart"/><span style={{position:'absolute',top:-2,right:-2,minWidth:16,height:16,padding:'0 4px',borderRadius:999,background:'var(--tsm-red,#ed1b2f)',color:'#fff',fontSize:10,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center'}}>3</span></button>
          <button className="icobtn hdr-burger" aria-label="Menu" onClick={()=>setMob(true)}><Ic name="IconsMenu"/></button>
        </div>
      </div>
      {menu==='shop' && <div style={{position:'absolute',top:'100%',left:0,width:'100%',background:'#fff',borderTop:'1px solid #EDEDED',boxShadow:'0 24px 40px rgba(0,0,0,.08)',zIndex:20}}>
        <div className="wrap" style={{display:'flex',gap:20,padding:'40px 40px 48px',alignItems:'stretch'}}>
          <div style={{width:210,display:'flex',flexDirection:'column',gap:20}}>
            {SHOP_MENU_A.map(x=>(
              <a key={x} href={navHref(x)} style={{...mLink,fontSize:20,display:'inline-flex',alignItems:'center',gap:6}}>{x}{x==='Sale items'&&<Ic name="IconsDiscount" size={14} color="var(--tsm-red)"/>}</a>
            ))}
          </div>
          <div style={{width:210,display:'flex',flexDirection:'column',gap:32}}>{SHOP_MENU_B.map(g=><MenuGroup key={g.h} group={g}/>)}</div>
          <div style={{width:210,display:'flex',flexDirection:'column',gap:32}}>{SHOP_MENU_C.map(g=><MenuGroup key={g.h} group={g}/>)}</div>
          <a href="Shop.html" style={{flex:1,minWidth:0,background:'radial-gradient(ellipse 65% 65% at 50% 50%, #EE313D 0%, #A70000 100%)',display:'flex',flexDirection:'column',alignItems:'flex-start',gap:20,padding:'28px 20px',overflow:'hidden',color:'#fff'}}>
            <div style={{alignSelf:'stretch',fontFamily:'var(--desktop-body-XL-font-family)',fontSize:20,fontWeight:500,color:'#fff'}}>Year of the Horse 2026</div>
            <span className="arrow-cta" style={{color:'#fff'}}>Shop<span className="ln"/></span>
            <div style={{alignSelf:'stretch',display:'flex',flexDirection:'column',alignItems:'center',gap:2}}>
              <img src="assets/coin-horse-gold.png" style={{width:130}}/>
              <img src="assets/cat-snake.png" style={{width:120,marginTop:-10}}/>
              <img src="assets/coin-botanic-silver.png" style={{width:100,marginTop:-10}}/>
            </div>
          </a>
          <a href="Shop.html" style={{flex:1,minWidth:0,background:'linear-gradient(215deg,#F5E3BA 0%,#C1A96B 100%)',display:'flex',flexDirection:'column',alignItems:'flex-start',gap:20,padding:'28px 20px',overflow:'hidden',color:'var(--tsm-black)'}}>
            <div style={{alignSelf:'stretch',fontFamily:'var(--desktop-body-XL-font-family)',fontSize:20,fontWeight:500,color:'var(--tsm-black)'}}>Gifting Ideas</div>
            <span className="arrow-cta" style={{color:'var(--tsm-black)'}}>Shop<span className="ln"/></span>
            <div style={{alignSelf:'stretch',flex:1,display:'flex',alignItems:'center',justifyContent:'center',gap:16}}>
              <img src="assets/coin-horse-silver.png" style={{width:130,filter:'drop-shadow(-4px 4px 9px rgba(0,0,0,.18))'}}/>
              <img src="assets/cat-vanda.png" style={{width:110,filter:'drop-shadow(-4px 4px 9px rgba(0,0,0,.18))'}}/>
            </div>
          </a>
        </div>
      </div>}
      {menu==='discover' && <div style={{position:'absolute',top:'100%',left:0,width:'100%',background:'#fff',borderTop:'1px solid #EDEDED',boxShadow:'0 24px 40px rgba(0,0,0,.08)',zIndex:20}}>
        <div className="wrap" style={{display:'flex',gap:20,padding:'40px 40px 60px',justifyContent:'center'}}>
          {DISCOVER_MENU.map(g=><MenuGroup key={g.h} group={g}/>)}
        </div>
      </div>}
      <MobMenu open={mob} onClose={()=>setMob(false)} onCart={()=>{setMob(false);setCart(true);}}/>
      <CartDrawer open={cart} onClose={()=>setCart(false)}/>
    </header>
  );
}

/* image renderer: real photo, composed gold horse panel, or neutral placeholder */
function CardMedia({n}){
  if(n.horse) return (
    <div className="ph" style={{width:'100%',aspectRatio:'1/1',overflow:'hidden',background:'radial-gradient(60% 60% at 55% 45%, #E8CE8E 0%, #C9A85C 100%)'}}>
      <img src="assets/coin-horse-gold.png" alt="" style={{position:'absolute',left:'14%',top:'50%',transform:'translateY(-50%)',width:'42%',filter:'drop-shadow(-4px 6px 12px rgba(90,60,10,.35))'}}/>
      <img src="assets/coin-horse-silver.png" alt="" style={{position:'absolute',right:'14%',top:'50%',transform:'translateY(-50%)',width:'40%',filter:'drop-shadow(-4px 6px 12px rgba(90,60,10,.25))'}}/>
    </div>
  );
  if(n.img) return (
    <div style={{width:'100%',aspectRatio:'1/1',overflow:'hidden',background:'#eee'}}>
      <img className="news-img-scale" src={n.img} alt="" style={{width:'100%',height:'100%',objectFit:'cover',objectPosition:n.pos||'center',transition:'transform .45s var(--ease-standard)'}}/>
    </div>
  );
  return <div className="ph" data-ph={n.ph||'Image'} style={{width:'100%',aspectRatio:'1/1'}}/>;
}

    {/* Filter tabs (desktop) */}
    <section className="wrap">
      <div className="desk-tabs" style={{display:'flex',alignItems:'center',gap:40,padding:'56px 0',borderBottom:'1px solid #dcdddd'}}>
        {TABS.map(t=><button key={t} className={"tab"+(tab===t?" active":"")} onClick={()=>setTab(t)}>{t}</button>)}
      </div>
      {/* Filter dropdown (mobile) */}
      <div className="mob-filter" style={{padding:'28px 0',borderBottom:'1px solid #dcdddd',alignItems:'center',justifyContent:'space-between'}}>
        <label style={{position:'relative',display:'flex',alignItems:'center',width:'100%',justifyContent:'space-between'}}>
          <select value={tab} onChange={e=>setTab(e.target.value)} style={{appearance:'none',WebkitAppearance:'none',border:'none',background:'transparent',fontFamily:'var(--font-serif)',fontSize:28,color:'var(--tsm-black)',width:'100%',outline:'none'}}>
            {TABS.map(t=><option key={t} value={t}>{t}</option>)}
          </select>
          <span style={{pointerEvents:'none',display:'inline-flex'}}><Ic name="IconsDropdown" size={22}/></span>
        </label>
      </div>
    </section>

    {/* News grid */}
    <section className="wrap" style={{padding:'40px 40px 60px'}}>
      <div className="news-grid" style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',columnGap:20,rowGap:64}}>
        {items.map((n,i)=><NewsCard key={i} n={n} idx={NEWS.indexOf(n)}/>)}
      </div>
      <div className="show-all" style={{justifyContent:'center',paddingTop:56}}>
        <span className="arrow-cta" style={{color:'var(--tsm-black)'}}>Show all<span className="ln"/></span>
      </div>
    </section>

    {/* Footer */}
    <footer style={{background:'var(--tsm-black)',marginTop:40}}>
      <div className="navigation-nav-bar">
        <div className="frame">
          <div className="text-wrapper">Stay connected with us</div>
          <div className="div">
            <p className="p">Be the first to know about new releases, exclusive drops and seasonal collections.</p>
            <form className="frame-2" onSubmit={submit}>
              <div className="newsletter-signup">
                <label htmlFor="nl-email" style={{position:'absolute',width:1,height:1,overflow:'hidden',clip:'rect(0 0 0 0)'}}>Email Address</label>
                <input id="nl-email" type="email" required className="text-wrapper-2" placeholder="Email Address" value={email} onChange={e=>{setEmail(e.target.value);setSent(false);}}/>
                <button type="submit" className="CTA-buttons-desktop"><div className="text-wrapper-3">SIGN UP</div></button>
              </div>
              <p className="text-wrapper-4">By providing your email address and clicking on "Sign Up", you consent to the collection, use, and disclosure of your personal data by The Singapore Mint, its related companies, and business partners, to send you promotional and marketing information and materials, including information on events, promotions and lucky draws.</p>
              <p aria-live="polite" style={{position:'absolute',width:1,height:1,overflow:'hidden',clip:'rect(0 0 0 0)'}}>{sent?'Thank you for signing up to our newsletter.':''}</p>
            </form>
          </div>
        </div>
        <div className="frame-3">
          <div className="frame-4">
            <FootAcc title="THE SINGAPORE MINT STORES" cls="frame-5">
              <div className="frame-6">
                <div className="text-wrapper-6">Coin Gallery (Head Office)</div>
                <p className="text-wrapper-7">20 Teban Gardens Crescent<br/>S608928<br/>+65 6895 0288<br/>Mon - Fri from 8.30am to 4.30pm</p>
              </div>
              <div className="frame-6">
                <div className="text-wrapper-6">Chinatown Point</div>
                <p className="text-wrapper-7">133 New Bridge Road, #02-18<br/>S059413<br/>+65 6222 2486<br/>Daily from 11.00am to 9.30pm</p>
              </div>
              <div className="frame-6">
                <div className="text-wrapper-6">Suntec City Mall</div>
                <p className="text-wrapper-7">3 Temasek Blvd, #02-719 East Wing Tower 3<br/>S038983<br/>+65 6336 2878<br/>Daily from 11.00am to 9.30pm</p>
              </div>
            </FootAcc>
            <FootAcc title="SUPPORT">
              <div className="frame-6">
                <a className="text-wrapper-6" href="#">FAQs</a>
                <a className="text-wrapper-8" href="#">Contact us</a>
              </div>
            </FootAcc>
            <FootAcc title="LEGAL">
              <div className="frame-6">
                <a className="text-wrapper-6" href="#">Lifetime guarantee</a>
                <a className="text-wrapper-8" href="#">Return policy</a>
                <a className="text-wrapper-8" href="#">Privacy policy</a>
                <a className="text-wrapper-8" href="#">Terms &amp; conditions</a>
              </div>
            </FootAcc>
            <div className="frame-7">
              <div className="text-wrapper-5">CONNECT</div>
              <div className="frame-8">
                <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Follow The Singapore Mint on Instagram" style={{color:'#fff',display:'inline-flex'}}>
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="2.5" y="2.5" width="19" height="19" rx="5" stroke="currentColor" strokeWidth="1.7"/><circle cx="12" cy="12" r="4.3" stroke="currentColor" strokeWidth="1.7"/><circle cx="17.4" cy="6.6" r="1.2" fill="currentColor"/></svg>
                </a>
                <a href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer" aria-label="Follow The Singapore Mint on Facebook" style={{color:'#fff',display:'inline-flex'}}>
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 8.5h-2V7c0-.7.2-1 1-1h1V3.2C15.1 3.1 14.2 3 13.4 3c-2.1 0-3.4 1.3-3.4 3.6v1.9H8V11.4h2V21h3.5v-9.6h2.1l.4-2.9Z"/></svg>
                </a>
              </div>
            </div>
          </div>
          <p className="copyright-the">COPYRIGHT © 2023 THE SINGAPORE MINT. ALL RIGHTS RESERVED.</p>
        </div>
      </div>
    </footer>
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<!-- support chat widget -->
<style>

.sm-chat-btn:hover{transform:scale(1.06)}
.sm-chat-btn svg{width:100%;height:100%;display:block;border-radius:50%}
.sm-chat-panel{position:fixed;right:24px;bottom:96px;z-index:901;width:360px;max-width:calc(100vw - 32px);background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.28);display:none;flex-direction:column;font-family:var(--font-sans,"Kumbh Sans",sans-serif)}
.sm-chat-panel.open{display:flex}
.sm-chat-head{background:#03363d;color:#fff;padding:22px 24px;display:flex;align-items:center;justify-content:space-between}
.sm-chat-head h3{margin:0;font-family:var(--font-sans,"Kumbh Sans",sans-serif);font-size:22px;font-weight:700}
.sm-chat-close{background:none;border:none;color:#fff;cursor:pointer;display:inline-flex;padding:4px}
.sm-chat-body{padding:24px}
.sm-chat-greet{margin:0 0 24px;font-size:18px;line-height:1.5;color:#3a3a3a}
.sm-chat-row{display:flex;gap:14px}
.sm-chat-input{flex:1;min-width:0;border:1px solid #dcdddd;border-radius:12px;padding:16px;font-size:16px;font-family:inherit;outline:none;color:#000}
.sm-chat-input:focus{border-color:#03363d}
.sm-chat-send{flex:0 0 auto;border:none;border-radius:12px;padding:0 26px;background:var(--tsm-red,#ed1b2f);color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer}
.sm-chat-send:hover{background:#cf1526}
</style>
<button class="sm-chat-btn" aria-label="Chat with support" onclick="document.getElementById('sm-chat-panel').classList.toggle('open')"><svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="400" cy="400" r="400" fill="#03363d"></circle><path fill="#fff" d="M383 359V541H236zM383 289q0 61-43 103.5T236 435V289zM417 541q0-61 43-103.5T564 395v146zM417 471 564 289v182z"></path></svg></button>
<div class="sm-chat-panel" id="sm-chat-panel">

  </div>
</div>
