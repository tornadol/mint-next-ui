<script type="text/babel">
const { Navi, Icon } = window.TheSingaporeMintDesignSystem_6a655a;

const product = {
  sku:'S217',
  title:'PREORDER: Tabebuia Rosea 999 Fine Silver Proof Coloured Ingot',
  badges:['NEW','PREORDER'],
  prices:{ retail:65, gold:60, platinum:58 },
  images:[
    '../../assets/imagery/coins/coin-05.png',
    '../../assets/imagery/coins/coin-04.png',
    '../../assets/imagery/coins/coin-12.png',
    '../../assets/imagery/coins/coin-01.png',
  ],
  description:'The Tabebuia Rosea, also known as the Trumpet tree or pink Tecoma, is commonly seen growing along the streets of Singapore. Its delicate pink blooms appear in fleeting bursts, transforming ordinary surroundings with a gentle vibrancy — often called Singapore\u2019s version of the Sakura. This 999 fine silver proof coloured ingot preserves that moment in a keepsake worthy of any collector.',
  specs:[
    ['Product Code','S217'],
    ['Metal','999 Fine Silver'],
    ['Weight','1 oz (31.1g)'],
    ['Dimensions','45mm × 27mm × 3mm'],
    ['Finish','Proof, Coloured'],
    ['Mintage','888 pieces'],
    ['Packaging','Presentation case with certificate'],
  ],
};
const related = [
  {sku:'S218', name:'Ixora Silver Ingot', img:'../../assets/imagery/coins/coin-07.png', price:65, badges:['NEW','PREORDER']},
  {sku:'S219', name:'Tecoma Stans Silver Ingot', img:'../../assets/imagery/coins/coin-12.png', price:65, badges:['NEW','PREORDER']},
  {sku:'S220', name:'Tabernaemontana Silver Ingot', img:'../../assets/imagery/coins/coin-04.png', price:65, badges:['NEW','PREORDER']},
  {sku:'S221', name:'Bougainvillea Silver Ingot', img:'../../assets/imagery/coins/coin-11.png', price:65, badges:['NEW','PREORDER']},
  {sku:'S222', name:'Frangipani Silver Ingot', img:'../../assets/imagery/coins/coin-01.png', price:65, badges:['NEW']},
  {sku:'S223', name:'Heliconia Silver Ingot', img:'../../assets/imagery/coins/coin-13.png', price:65, badges:['NEW','PREORDER']},
];

const fmt = (n) => '$' + n.toFixed(2);

const RelatedTile = ({item}) => {
  const [wish, setWish] = React.useState(false);
  const [cmp, setCmp] = React.useState(false);
  const [added, setAdded] = React.useState(false);
  const toggle = (setter, key) => (e) => {
    e.preventDefault(); e.stopPropagation();
    setter(v => {
      try {
        const list = JSON.parse(localStorage.getItem('sm-'+key) || '[]');
        const idx = list.findIndex(x => (x.img||x) === item.img);
        if (v) { if (idx>=0) list.splice(idx,1); } else if (idx<0) {
          const priceNum = (typeof item.price === 'number') ? item.price : (parseFloat(String(item.price||'').replace(/[^0-9.]/g,''))||0);
          list.push({ img:item.img, name:item.name||'', sku:item.sku||'', price:priceNum, meta:item.meta||(item.sku?item.sku+' · 45mm':'') });
        }
        localStorage.setItem('sm-'+key, JSON.stringify(list));
        window.dispatchEvent(new CustomEvent('sm-'+key+'-updated'));
      } catch(_){}
      return !v;
    });
  };
  const addToCart = (e) => {
    e.preventDefault(); e.stopPropagation();
    try {
      const list = JSON.parse(localStorage.getItem('sm-cart') || '[]');
      const existing = list.find(x => x.img === item.img);
      if (existing) existing.qty = (existing.qty||1) + 1;
      else list.push({ img:item.img, name:item.name, meta:`${item.sku} · 45mm`, price:item.price, qty:1 });
      localStorage.setItem('sm-cart', JSON.stringify(list));
      window.dispatchEvent(new CustomEvent('sm-cart-updated'));
    } catch(_){}
    setAdded(true); setTimeout(()=>setAdded(false), 1400);
  };
  return (
    <div className="card">
      <div className="quick-actions">
        <button className={`qa-btn${wish?' on':''}`} aria-label="Wishlist" onClick={toggle(setWish,'wishlist')}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill={wish?'currentColor':'none'} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
        </button>
        <button className={`qa-btn${cmp?' on':''}`} aria-label="Compare" onClick={toggle(setCmp,'compare')}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 4v17"/><path d="M7 21h10"/><path d="M6 8l-4 8a4 4 0 008 0L6 8z"/><path d="M18 8l-4 8a4 4 0 008 0L18 8z"/><path d="M3 7l9-1 9 1"/></svg>
        </button>
      </div>
      <div className="coin-photo">
        <img src={item.img} alt=""/>
      </div>
      <div className="meta">{item.sku} · 45mm</div>
      <div className="name">{item.name}</div>
      <div className="price">$ {item.price.toFixed(2)}</div>
      <button className="add-cart" onClick={addToCart}>{added ? 'Added to Cart' : 'Add to Cart'}</button>
    </div>
  );
};

const App = () => {
  const [imgIdx, setImgIdx] = React.useState(0);
  const [tier, setTier] = React.useState('retail');
  const [qty, setQty] = React.useState(1);
  const [tab, setTab] = React.useState('desc');
  const [wish, setWish] = React.useState(false);
  const [cmp, setCmp] = React.useState(false);

  const price = product.prices[tier];

  const addToCart = () => {
    try {
      const list = JSON.parse(localStorage.getItem('sm-cart') || '[]');
      const existing = list.find(x => x.img === product.images[0]);
      if (existing) existing.qty = (existing.qty||1) + qty;
      else list.push({ img:product.images[0], name:product.title, meta:`${product.sku} · 45mm`, price, qty });
      localStorage.setItem('sm-cart', JSON.stringify(list));
      window.dispatchEvent(new CustomEvent('sm-cart-updated'));
    } catch(_){}
  };

  return (
    <div className="wrap">
      {Navi ? <Navi/> : null}
      <div className="page-pad">
        <nav className="crumbs" aria-label="Breadcrumb">
          <a href="index.html">Home</a>
          <span className="sep">/</span>
          <a href="product-list.html">Shop</a>
          <span className="sep">/</span>
          <span className="current">Tabebuia Rosea Silver Ingot</span>
        </nav>

        <div className="pdp">
          <div className="gallery">
            <div className="gallery-main">
              <div className="gallery-badges">
                {product.badges.includes('NEW') && <span className="badge new">NEW</span>}
                {product.badges.includes('PREORDER') && <span className="badge preorder">PREORDER</span>}
              </div>
              <img src={product.images[imgIdx]} alt=""/>
            </div>
            <div className="gallery-thumbs">
              {product.images.map((src,i)=>(
                <button key={i} className={`thumb${i===imgIdx?' on':''}`} onClick={()=>setImgIdx(i)} aria-label={`Image ${i+1}`}>
                  <img src={src} alt=""/>
                </button>
              ))}
            </div>
          </div>

          <div className="info">
            <div className="sku">Product Code:<b>{product.sku}</b></div>
            <h1 className="p-title">{product.title}</h1>

            <div className="pricing">
              <div className="price-hero">{fmt(price)}</div>
              {[
                {k:'retail', label:'Retail Price', amount:product.prices.retail},
                {k:'gold', label:'Gold Member Price', amount:product.prices.gold},
                {k:'platinum', label:'Platinum Member Price', amount:product.prices.platinum},
              ].map(row => (
                <div key={row.k} className={`price-row${tier===row.k?' active':''}`} onClick={()=>setTier(row.k)}>
                  <span>{row.label}</span>
                  <span style={{display:'inline-flex',alignItems:'center',gap:8}}>
                    <span className="amt">{fmt(row.amount)}</span>
                    <svg className="check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
                  </span>
                </div>
              ))}
              <div className="note">Switch to Gold or Platinum member view (top nav) to see member pricing applied automatically.</div>
            </div>

            <div className="qty-row">
              <div className="qty">
                <button onClick={()=>setQty(q=>Math.max(1,q-1))} aria-label="Decrease">−</button>
                <input value={qty} onChange={e=>{ const n=parseInt(e.target.value,10); setQty(isNaN(n)?1:Math.max(1,n)); }}/>
                <button onClick={()=>setQty(q=>q+1)} aria-label="Increase">+</button>
              </div>
              <button className="add-cart-lg" onClick={addToCart}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
                Add to Cart · {fmt(price * qty)}
              </button>
            </div>

            <div className="sec-btn-row">
              <button className={`sec-btn${wish?' on':''}`} onClick={()=>setWish(v=>!v)}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill={wish?'currentColor':'none'} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
                {wish ? 'In Wishlist' : 'Add to Wishlist'}
              </button>
              <button className={`sec-btn${cmp?' on':''}`} onClick={()=>setCmp(v=>!v)}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 4v17"/><path d="M7 21h10"/><path d="M6 8l-4 8a4 4 0 008 0L6 8z"/><path d="M18 8l-4 8a4 4 0 008 0L18 8z"/><path d="M3 7l9-1 9 1"/></svg>
                {cmp ? 'Added to Compare' : 'Compare'}
              </button>
            </div>

            <div className="tabs">
              <div className="tab-heads" role="tablist">
                <button className={`tab-head${tab==='desc'?' on':''}`} onClick={()=>setTab('desc')}>Description</button>
                <button className={`tab-head${tab==='spec'?' on':''}`} onClick={()=>setTab('spec')}>Specifications</button>
              </div>
              <div className="tab-body">
                {tab==='desc' ? <p style={{margin:0}}>{product.description}</p> : (
                  <ul className="specs">
                    {product.specs.map(([k,v])=>(<li key={k}><span>{k}</span><span>{v}</span></li>))}
                  </ul>
                )}
              </div>
            </div>
          </div>
        </div>

        <section className="related">
          <h2>You May Also Like</h2>
          <div className="related-grid">
            {related.map(r => <RelatedTile key={r.sku} item={r}/>)}
          </div>
        </section>
      </div>

      <section className="banner">
        <div className="banner-inner">
          <div>
            <h3>Become a member &amp; Get 15% off</h3>
            <p>Be first to receive updates on new collections, inspiration, gift ideas and exclusive access</p>
          </div>
          <button className="btn-dark">JOIN THE CLUB</button>
        </div>
      </section>

      <SiteFooter Icon={Icon}/>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script id="om-fly-cart-js">
(function(){
  function fly(fromEl){
    var img = fromEl && fromEl.closest('.card') && fromEl.closest('.card').querySelector('.coin-photo img');
    var target = document.querySelector('[aria-label="Cart"]') || document.querySelector('.sm-navi-right');
    if(!img || !target) return;
    var s = img.getBoundingClientRect(), t = target.getBoundingClientRect();
    var clone = document.createElement('img');
    clone.src = img.src; clone.className = 'fly-coin';
    clone.style.left = s.left + s.width/2 - 28 + 'px';
    clone.style.top = s.top + s.height/2 - 28 + 'px';
    clone.style.setProperty('--dx', (t.left + t.width/2 - s.left - s.width/2) + 'px');
    clone.style.setProperty('--dy', (t.top + t.height/2 - s.top - s.height/2) + 'px');
    var kf = [
      {transform:'translate(0,0) scale(1) rotate(0)', opacity:1},
      {transform:'translate(calc(var(--dx)*.5), calc(var(--dy)*.2 - 80px)) scale(.7) rotate(120deg)', opacity:.9, offset:.5},
      {transform:'translate(var(--dx), var(--dy)) scale(.15) rotate(240deg)', opacity:0}
    ];
    document.body.appendChild(clone);
    var a = clone.animate(kf, {duration:800, easing:'cubic-bezier(.5,0,.7,1)', fill:'forwards'});
    a.onfinish = function(){ clone.remove(); target.animate([{transform:'scale(1)'},{transform:'scale(1.25)'},{transform:'scale(1)'}], {duration:400, easing:'cubic-bezier(.34,1.56,.64,1)'}); };
  }
  document.addEventListener('click', function(e){
    var b = e.target && e.target.closest && e.target.closest('.add-cart');
    if(b){ b.classList.remove('added'); void b.offsetWidth; b.classList.add('added'); fly(b); }
  }, true);
})();
</script>
</body></html>
