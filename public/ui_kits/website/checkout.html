    {id:'chinatown',name:'Chinatown Point',addr:'133 New Bridge Road, #02-18, S 059413',tel:'+65 6222 2486',hours:'Daily, 11.00am–9.30pm'},
    {id:'suntec',name:'Suntec City Mall',addr:'3 Temasek Blvd, #02-719 East Wing Tower 3, S 038983',tel:'+65 6336 2878',hours:'Daily, 11.00am–9.30pm'},
  ];
  const [pickupStore, setPickupStore] = React.useState(STORES[0].id);
  const [savedAddrs, setSavedAddrs] = React.useState(readAddresses());
  const [addrMode, setAddrMode] = React.useState('saved'); // 'saved' | 'new'
  const [selectedAddrId, setSelectedAddrId] = React.useState(null);
  const applyAddress = (a) => {
    setSelectedAddrId(a.id);
    setAddrMode('saved');
    setF(prev => ({ ...prev,
      firstName: (a.name||'').split(' ')[0]||prev.firstName,
      lastName: (a.name||'').split(' ').slice(1).join(' ')||prev.lastName,
      phone: a.phone||prev.phone,
      addr: [a.line1,a.line2].filter(Boolean).join(', '),
      city: a.country||'Singapore',
      postcode: a.postal||'',
      country: a.country||'Singapore'
    }));
  };
  React.useEffect(() => {
    const list = readAddresses();
    setSavedAddrs(list);
    if (list.length){ const def = list.find(a=>a.default) || list[0]; applyAddress(def); }
    else setAddrMode('new');
  }, []);
  const saveNewAddress = () => {
    if (!f.addr.trim() || !f.postcode.trim()){ alert('Please enter street address and postal code.'); return; }
    const id = 'a'+Date.now();
    const na = { id, label:'New address', name:`${f.firstName} ${f.lastName}`.trim()||'Recipient', phone:f.phone||'', line1:f.addr, line2:'', postal:f.postcode, country:f.country, default:false };
    let list = readAddresses();
    if (list.length===0) na.default = true;
    list = [...list, na];
    try { localStorage.setItem('sm-addresses', JSON.stringify(list)); window.dispatchEvent(new CustomEvent('sm-addresses-updated')); } catch(_){}
    setSavedAddrs(list); setSelectedAddrId(id); setAddrMode('saved');
  };
  const [method, setMethod] = React.useState('dbs-card');
  const [step, setStep] = React.useState(1); // 1 form 2 dbs 3 done
  const [dbs, setDbs] = React.useState('form'); // form|processing|otp|verifying|done
  const [otp, setOtp] = React.useState(['','','','','','']);
  const [order, setOrder] = React.useState(null);
  const [f, setF] = React.useState({
    email:'', firstName:'', lastName:'', phone:'',
    addr:'', city:'Singapore', postcode:'', country:'Singapore',
    cardName:'', cardNum:'4111 2222 3333 4444', exp:'12/28', cvv:'123'
  });
  React.useEffect(() => {
    try {
      const raw = JSON.parse(localStorage.getItem('sm-cart') || '[]');
      setCart(raw);
      const user = JSON.parse(localStorage.getItem('sm-user') || 'null');
      if (user) setF(s => ({...s, email:user.email||'', firstName:(user.name||'').split(' ')[0]||'', lastName:(user.name||'').split(' ').slice(1).join(' ')||''}));
    } catch(_){}
  }, []);
  const subtotal = cart.reduce((s,i)=>s + (i.price||0)*(i.qty||1), 0);
  const itemCount = cart.reduce((s,i)=>s + (i.qty||1), 0);
  // Mock FedEx zone rates (SGD): base + per-kg, plus est. transit days
  const FEDEX_ZONES = {
    'Singapore':     {zone:'Zone SG', base:8,  perKg:4,  days:'1–2'},
    'Malaysia':      {zone:'Zone A', base:18, perKg:9,  days:'2–3'},
    'Indonesia':     {zone:'Zone A', base:20, perKg:10, days:'3–4'},
    'Thailand':      {zone:'Zone A', base:20, perKg:10, days:'3–4'},
    'China':         {zone:'Zone B', base:28, perKg:14, days:'3–5'},
    'Australia':     {zone:'Zone C', base:34, perKg:17, days:'4–6'},
    'United Kingdom':{zone:'Zone D', base:46, perKg:22, days:'5–7'},
    'United States': {zone:'Zone D', base:48, perKg:24, days:'5–7'},
  };
  const weightKg = Math.max(0.5, itemCount * 0.25); // ~250g per coin, min 0.5kg
  // UI display: always show calculated FedEx rate (free-shipping logic bypassed)
  const isOverseas = fulfill==='ship';
  const fedex = FEDEX_ZONES[f.country] || FEDEX_ZONES['Singapore'];
  const fedexRate = (isOverseas && fedex) ? Math.round((fedex.base + fedex.perKg * weightKg) * 100)/100 : 0;
  const delivery = fulfill==='pickup' ? 0 : fedexRate;
  const gst = subtotal * 0.09;
  const total = subtotal + delivery;
  const orderNo = React.useMemo(()=>('TSM'+Math.floor(100000+Math.random()*900000)),[]);

  const startPayment = () => {
    if (cart.length === 0) return;
    setStep(2);
    setDbs('processing');
    setTimeout(()=>setDbs('otp'), 1400);
  };
  const submitOtp = () => {
    const val = otp.join('');
    if (val.length !== 6) return;
    setDbs('verifying');
    setTimeout(()=>{
      setDbs('done');
      // save order
      try {
        const orders = JSON.parse(localStorage.getItem('sm-orders') || '[]');
        const o = {
          id: orderNo, date: new Date().toISOString(),
          items: cart, subtotal, delivery, gst, total,
          method: 'DBS Bank · **** '+ (f.cardNum.slice(-4)),
          fulfill: fulfill,
          pickupStore: fulfill==='pickup' ? STORES.find(s=>s.id===pickupStore) : null,
          address: fulfill==='pickup'
            ? `Pickup at ${STORES.find(s=>s.id===pickupStore).name} — ${STORES.find(s=>s.id===pickupStore).addr}`
            : `${f.firstName} ${f.lastName}, ${f.addr}, ${f.city} ${f.postcode}, ${f.country}`,
          status: 'Paid'
        };
        orders.unshift(o);
        localStorage.setItem('sm-orders', JSON.stringify(orders));
        localStorage.setItem('sm-cart','[]');
        window.dispatchEvent(new CustomEvent('sm-cart-updated'));
        setOrder(o);
        setStep(3);
      } catch(_){}
    }, 1400);
  };
  const setOtpAt = (i,v) => {
    v = v.replace(/\D/g,'').slice(-1);
    setOtp(prev => { const n=[...prev]; n[i]=v; return n; });
    if (v && i < 5) { const next = document.getElementById('otp-'+(i+1)); if (next) next.focus(); }
  };

  return (
    <div className="wrap">
      {Navi ? <Navi active="Home"/> : null}
      <div className="container">
        <nav className="crumbs" aria-label="Breadcrumb">
          <a href="index.html">Home</a> / <a href="product-list.html">Shop</a> / <span className="current">Checkout</span>
        </nav>
        <h1>Checkout</h1>
        <div className="steps">
          <div className={`step ${step===1?'on':step>1?'done':''}`}><span className="n">{step>1?'✓':'1'}</span> Details</div>
          <div className={`dash ${step>1?'done':''}`}/>
          <div className={`step ${step===2?'on':step>2?'done':''}`}><span className="n">{step>2?'✓':'2'}</span> Payment</div>
          <div className={`dash ${step>2?'done':''}`}/>
          <div className={`step ${step===3?'on':''}`}><span className="n">3</span> Confirmation</div>
        </div>

        {step === 3 ? (
          <div className="card" style={{textAlign:'center',padding:'64px 32px',maxWidth:640,margin:'0 auto'}}>
            <div className="success">
              <div className="check"><Icon name="Check" size={30}/></div>
              <h3 style={{fontFamily:'var(--font-label)',fontWeight:800,fontSize:24}}>Payment successful</h3>
              <p style={{color:'var(--ink-500)',fontSize:14,margin:'0 0 24px'}}>Order <strong>{order?.id}</strong> was confirmed. A receipt has been sent to {order?.address.split(',')[0] ? f.email : 'your email'}.</p>
              <div style={{background:'var(--ink-25)',borderRadius:6,padding:'16px 20px',display:'flex',justifyContent:'space-between',fontFamily:'var(--font-label)',fontWeight:700,fontSize:14,marginBottom:24}}>
                <span>Amount charged</span><span>{fmt(order?.total||0)}</span>
              </div>
              <div style={{display:'flex',gap:12,justifyContent:'center'}}>
                <a href="order-history.html" className="pay-btn" style={{background:'#fff',color:'#cf0731',border:'1px solid #cf0731',textDecoration:'none',display:'inline-block',padding:'14px 24px',width:'auto',marginTop:0}}>View Orders</a>
                <a href="index.html" className="pay-btn" style={{width:'auto',padding:'14px 24px',textDecoration:'none',display:'inline-block',marginTop:0}}>Continue Shopping</a>
              </div>
            </div>
          </div>
        ) : (
          <div className="grid">
            <div className="checkout-scroll">
              <div className="card">
                <h2>Contact Information</h2>
                <p className="sub">We'll send your receipt and shipping updates here.</p>
                <div className="field-row">
                  <div className="field full"><label>Email address</label><input value={f.email} onChange={e=>setF({...f,email:e.target.value})} placeholder="you@example.com"/></div>
                  <div className="field"><label>First name</label><input value={f.firstName} onChange={e=>setF({...f,firstName:e.target.value})}/></div>
                  <div className="field"><label>Last name</label><input value={f.lastName} onChange={e=>setF({...f,lastName:e.target.value})}/></div>
                  <div className="field full"><label>Phone</label><input value={f.phone} onChange={e=>setF({...f,phone:e.target.value})} placeholder="+65 8123 4567"/></div>
                </div>
              </div>

              <div className="card">
                <h2>Delivery Method</h2>
                <p className="sub">Choose how you’d like to receive your order.</p>
                <div className="fulfill">
                  <div className={`opt${fulfill==='ship'?' on':''}`} onClick={()=>setFulfill('ship')}>
                    <div className="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></div>
                    <div className="m">
                      <div className="l">Ship to address {fulfill==='ship' && f.country!=='Singapore' ? <span className="free" style={{background:'#ede7f6',color:'#4d148c'}}>FEDEX</span> : (subtotal>=150 && <span className="free">FREE</span>)}</div>
                      <div className="s">Local 2–4 days (free over $150) · Overseas via FedEx.</div>
                    </div>
                  </div>
                  <div className={`opt${fulfill==='pickup'?' on':''}`} onClick={()=>setFulfill('pickup')}>
                    <div className="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-6 9 6v10a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 21 9 12 15 12 15 21"/></svg></div>
                    <div className="m">
                      <div className="l">Store pickup <span className="free">FREE</span></div>
                      <div className="s">Collect from any of our 3 stores. Ready in 1–2 hours.</div>
                    </div>
                  </div>
                </div>
                {fulfill==='pickup' && (
                  <React.Fragment>
                    <div className="pickup-stores">
                      {STORES.map(s => (
                        <div key={s.id} className={`pickup-store${pickupStore===s.id?' on':''}`} onClick={()=>setPickupStore(s.id)}>
                          <div className="radio"/>
                          <div className="info">
                            <div className="name">{s.name} <span className="tag">In stock</span></div>
                            <div className="addr">{s.addr} · {s.tel}</div>
                            <div className="hours"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>{s.hours}</div>
                          </div>
                        </div>
                      ))}
                    </div>
                    <div className="pickup-note">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0,marginTop:1}}><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                      <span>You’ll receive an email and SMS when your order is ready for collection. Please bring your order confirmation and a photo ID.</span>
                    </div>
                  </React.Fragment>
                )}
              </div>

              {fulfill==='ship' && (
              <div className="card">
                <h2>Shipping Address</h2>
                <p className="sub">Delivery is free on local orders over $150.</p>
                {savedAddrs.length > 0 && (
                  <div className="saved-addrs">
                    {savedAddrs.map(a => (
                      <div key={a.id} className={`saved-addr${selectedAddrId===a.id && addrMode==='saved'?' on':''}`} onClick={()=>applyAddress(a)}>
                        <div className="radio"/>
                        <div className="info">
                          <div className="lb">{a.label} {a.default && <span className="df">Default</span>}</div>
                          <div className="bd">{a.name} · {a.phone}<br/>{[a.line1,a.line2].filter(Boolean).join(', ')}<br/>{a.country} {a.postal}</div>
                        </div>
                      </div>
                    ))}
                    <button className={`new-addr-btn${addrMode==='new'?' on':''}`} onClick={()=>{setAddrMode('new'); setSelectedAddrId(null);}}>
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                      Use a new address
                    </button>
                  </div>
                )}
                {(addrMode==='new' || savedAddrs.length===0) && (
                <div className="field-row">
                  <div className="field full"><label>Street address</label><input value={f.addr} onChange={e=>{setF({...f,addr:e.target.value}); setSelectedAddrId(null);}} placeholder="20 Teban Gardens Crescent"/></div>
                  <div className="field"><label>City</label><input value={f.city} onChange={e=>setF({...f,city:e.target.value})}/></div>
                  <div className="field"><label>Postal code</label><input value={f.postcode} onChange={e=>setF({...f,postcode:e.target.value})} placeholder="608928"/></div>
                  <div className="field full"><label>Country</label>
                    <select value={f.country} onChange={e=>setF({...f,country:e.target.value})}>
                      <option>Singapore</option><option>Malaysia</option><option>Indonesia</option><option>Thailand</option><option>China</option><option>Australia</option><option>United Kingdom</option><option>United States</option>
                    </select>
                  </div>
                  <div className="field full addr-save-row">
                    {savedAddrs.length>0 && <button type="button" className="addr-cancel" onClick={()=>{setAddrMode('saved'); const def=savedAddrs.find(a=>a.default)||savedAddrs[0]; if(def) applyAddress(def);}}>Cancel</button>}
                    <button type="button" className="addr-save" onClick={saveNewAddress}>Save address</button>
                  </div>
                </div>
                )}
                {isOverseas && (
                  <div className="fedex-box">
                    <div className="fx-head">
                      <span className="fx-logo"><span className="fed">Fed</span><span className="ex">Ex</span></span>
                      <span className="fx-auto"><span className="pulse"></span>Rate auto-calculated</span>
                    </div>
                    <div className="fx-grid">
                      <div className="fx-cell"><span className="k">Service</span><span className="v">International Priority</span></div>
                      <div className="fx-cell"><span className="k">Destination</span><span className="v">{f.country} · {fedex ? fedex.zone : '—'}</span></div>
                      <div className="fx-cell"><span className="k">Billable weight</span><span className="v">{weightKg.toFixed(2)} kg</span></div>
                      <div className="fx-cell"><span className="k">Est. transit</span><span className="v">{fedex ? fedex.days+' business days' : '—'}</span></div>
                    </div>
                    <div className="fx-total">
                      <span>Calculated shipping</span>
                      <span className="amt">{fedexRate>0 ? fmt(fedexRate) : '—'}</span>
                    </div>
                    <p className="fx-note">Duties & taxes may be collected on delivery by the carrier. Rate = base ({fedex?fmt(fedex.base):'—'}) + {fedex?fmt(fedex.perKg):'—'}/kg × {weightKg.toFixed(2)}kg.</p>
                  </div>
                )}
              </div>
              )}

              <div className="card">
                <h2>Payment Method</h2>
                <p className="sub">Secure checkout powered by DBS Bank Singapore.</p>
                <div className="pay-methods">
                  <div className={`pay-method ${method==='dbs-card'?'on':''}`} onClick={()=>setMethod('dbs-card')}>
                    <span className="pay-radio"/>
                    <div style={{width:44,height:28,borderRadius:4,background:'#e30613',color:'#fff',display:'inline-flex',alignItems:'center',justifyContent:'center',fontFamily:'var(--font-label)',fontWeight:900,fontSize:11,letterSpacing:'.08em'}}>DBS</div>
                    <span className="pay-title">DBS Credit / Debit Card</span>
                    <span className="pay-meta">Visa · Mastercard</span>
                  </div>
                  <div className={`pay-method ${method==='paynow'?'on':''}`} onClick={()=>setMethod('paynow')}>
                    <span className="pay-radio"/>
                    <div style={{width:44,height:28,borderRadius:4,background:'#0f2f52',color:'#fff',display:'inline-flex',alignItems:'center',justifyContent:'center',fontFamily:'var(--font-label)',fontWeight:900,fontSize:9,letterSpacing:'.04em'}}>PayNow</div>
                    <span className="pay-title">PayNow QR (DBS/POSB)</span>
                    <span className="pay-meta">Scan &amp; pay</span>
                  </div>
                  <div className={`pay-method ${method==='paylah'?'on':''}`} onClick={()=>setMethod('paylah')}>
                    <span className="pay-radio"/>
                    <div style={{width:44,height:28,borderRadius:4,background:'#e30613',color:'#fff',display:'inline-flex',alignItems:'center',justifyContent:'center',fontFamily:'var(--font-label)',fontWeight:900,fontSize:9,letterSpacing:'.04em'}}>PayLah!</div>
                    <span className="pay-title">DBS PayLah!</span>
                    <span className="pay-meta">Instant transfer</span>
                  </div>
                </div>

                {method === 'dbs-card' && (
                  <div className="dbs-panel">
                    <div className="dbs-brand"><span className="mark">DBS</span> BANK SINGAPORE</div>
                    <div className="card-visual">
                      <div style={{fontSize:11,opacity:.85,letterSpacing:'.08em',textTransform:'uppercase'}}>Card number</div>
                      <div className="number">{f.cardNum}</div>
                      <div className="row">
                        <div>Cardholder<strong>{(f.firstName+' '+f.lastName).trim() || 'YOUR NAME'}</strong></div>
                        <div>Expires<strong>{f.exp}</strong></div>
                        <div>CVV<strong>•••</strong></div>
                      </div>
                    </div>
                    <div style={{marginTop:18,position:'relative',zIndex:1}}>
                      <div className="field-row">
                        <div className="field full" style={{marginBottom:8}}><label style={{color:'#ffd9de'}}>Card number</label><input value={f.cardNum} onChange={e=>setF({...f,cardNum:e.target.value})}/></div>
                        <div className="field" style={{marginBottom:0}}><label style={{color:'#ffd9de'}}>Expiry (MM/YY)</label><input value={f.exp} onChange={e=>setF({...f,exp:e.target.value})}/></div>
                        <div className="field" style={{marginBottom:0}}><label style={{color:'#ffd9de'}}>CVV</label><input value={f.cvv} onChange={e=>setF({...f,cvv:e.target.value})} maxLength={3}/></div>
                        <div className="field full" style={{marginBottom:0,marginTop:12}}><label style={{color:'#ffd9de'}}>Name on card</label><input value={f.cardName} onChange={e=>setF({...f,cardName:e.target.value})} placeholder="As shown on card"/></div>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>

            <div className="summary">
              <h3>Order Summary ({cart.reduce((s,i)=>s+(i.qty||1),0)} items)</h3>
              {cart.length === 0 ? (
                <p style={{color:'var(--ink-500)',fontSize:13,textAlign:'center',padding:'30px 0'}}>Your cart is empty. <a href="product-list.html">Continue shopping</a>.</p>
              ) : (
                <>
                  {cart.map((it,i) => (
                    <div key={i} className="sum-row">
                      <img src={it.img} alt=""/>
                      <div className="info">
                        <div className="n">{it.name}</div>
                        <div className="m">Qty: {it.qty||1}</div>
                      </div>
                      <div className="p">{fmt((it.price||0)*(it.qty||1))}</div>
                    </div>
                  ))}
                  <div className="totals">
                    <div className="line"><span>Subtotal</span><span>{fmt(subtotal)}</span></div>
                    <div className="line"><span>GST (9%, incl.)</span><span>{fmt(gst)}</span></div>
                    <div className="line"><span>{fulfill==='pickup'?'Store pickup':'Delivery'}{isOverseas && <span className="fx-tag">FedEx {fedex?fedex.zone:''}</span>}</span><span>{delivery===0?'FREE':fmt(delivery)}</span></div>
                    {isOverseas && fedex && <div className="line fx-sub"><span>FedEx Intl Priority · {weightKg.toFixed(2)}kg · {fedex.days} days</span><span></span></div>}
                    <div className="line total"><span>Total</span><span>{fmt(total)}</span></div>
                  </div>
                </>
              )}
              <button className="pay-btn" disabled={cart.length===0} onClick={startPayment}>Pay {fmt(total)} with DBS</button>
              <div className="secure"><Icon name="Lock" size={12}/> Secured by DBS Bank · 256-bit SSL encryption</div>
            </div>
          </div>
        )}
      </div>

      {step === 2 && (
        <div className="dbs-modal-backdrop">
          <div className="dbs-modal">
            <div className="dbs-modal-head">
              <span className="mark">DBS</span>
              <div>
                <div className="t">DBS SECURE PAYMENT</div>
                <div style={{fontSize:11,opacity:.85,marginTop:2}}>3-D Secure Verification</div>
              </div>
            </div>
            <div className="dbs-modal-body">
              {dbs === 'processing' && (
                <div className="processing">
                  <div className="spinner"/>
                  <h3>Contacting DBS Bank…</h3>
                  <p className="sub">Verifying your card ending in •••• {f.cardNum.slice(-4)}</p>
                </div>
              )}
              {dbs === 'otp' && (
                <>
                  <h3>Enter your 6-digit OTP</h3>
                  <p className="sub">A one-time password has been sent to your DBS-registered mobile ending in <strong>••••23</strong>. Use <strong>123456</strong> for this demo.</p>
                  <div style={{background:'#fff8ea',border:'1px solid #f0e2bb',borderRadius:4,padding:'10px 14px',fontSize:12.5,color:'#7a6b1a',marginBottom:12}}>
                    <strong>Merchant:</strong> THE SINGAPORE MINT · <strong>Amount:</strong> {fmt(total)}
                  </div>
                  <div className="otp-boxes">
                    {otp.map((v,i)=><input key={i} id={`otp-${i}`} value={v} onChange={e=>setOtpAt(i,e.target.value)} inputMode="numeric" maxLength={1}/>)}
                  </div>
                  <div className="otp-note">OTP is valid for 3 minutes · <a href="#" onClick={e=>e.preventDefault()} style={{color:'#e30613'}}>Resend</a></div>
                  <div className="dbs-modal-actions">
                    <button className="dbs-btn ghost" onClick={()=>{setStep(1);setOtp(['','','','','','']);}}>Cancel</button>
                    <button className="dbs-btn primary" onClick={submitOtp} disabled={otp.join('').length !== 6}>Verify &amp; Pay</button>
                  </div>
                </>
              )}
              {dbs === 'verifying' && (
                <div className="processing">
                  <div className="spinner"/>
                  <h3>Verifying OTP…</h3>
                  <p className="sub">Processing your payment of {fmt(total)}</p>
                </div>
              )}
            </div>
          </div>
        </div>
      )}

      <SiteFooter Icon={Icon} noStores={true}/>
    </div>
  );
};
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
